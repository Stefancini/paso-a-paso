lready know one: *quiero*, *quieres*, *queremos*.", "The 'we' form keeps the plain e, because the push moves to the ending: *empezamos*."], "examples": [["yo empiezo", "I start"], ["tú empiezas", "you start (a mate)"], ["usted empieza", "you start (respectful)"], ["él empieza, ella empieza", "he starts, she starts"], ["nosotros empezamos", "we start"], ["ustedes empiezan", "you all start"], ["ellos empiezan", "they start"]], "mistake": {"wrong": "Yo empezo a las siete.", "right": "Yo empiezo a las siete.", "why": "*empezar* changes e to ie: *empiezo*."}, "say": ["empiezo", "empiezas", "empieza", "empezamos", "empiezan"]}, {"t": "learn", "title": "Handy e → ie verbs", "text": ["Same change, same endings as any -ar, -er or -ir verb. Only 'we' keeps the e."], "examples": [["cerrar → cierro", "to close → I close"], ["pensar → pienso", "to think → I think"], ["entender → entiendo", "to understand → I understand"], ["preferir → prefiero", "to prefer → I prefer"], ["empezar → empiezo", "to start → I start"]], "mistake": {"wrong": "Nosotros empiezamos.", "right": "Nosotros empezamos.", "why": "'We' keeps the plain e: *empezamos*, *cerramos*, *entendemos*."}}, {"t": "choice", "id": "6.1.empiezo", "prompt": "Completa: Yo ___ a las siete. (empezar)", "options": ["empiezo", "empezo", "empezamos"], "answer": "empiezo", "why": "e becomes ie: *empiezo*.", "speak": "Yo empiezo a las siete."}, {"t": "choice", "id": "6.1.cerramos", "prompt": "Completa: Nosotros ___ la tienda a las cinco. (cerrar)", "options": ["cerramos", "cierramos", "cierran"], "answer": "cerramos", "why": "'We' keeps the plain e: *cerramos*.", "speak": "Nosotros cerramos la tienda a las cinco."}, {"t": "choice", "id": "6.1.entiendes", "prompt": "Completa: ¿___ el plan? (entender, to a mate)", "options": ["Entiendes", "Entendes", "Entienden"], "answer": "Entiendes", "why": "*tú* form with e to ie: *entiendes*.", "speak": "¿Entiendes el plan?"}, {"t": "choice", "id": "6.1.meaning", "prompt": "What does this mean?", "es": "No entiendo.", "options": ["I don't understand.", "I don't think so.", "I don't want to."], "answer": "I don't understand.", "why": "*entiendo* is I understand. Super handy: *No entiendo.*", "speak": "No entiendo.", "optLang": "en"}, {"t": "listen", "id": "6.1.listen", "prompt": "Escucha. Which did you hear?", "es": "Prefiero el café.", "options": ["Prefiero el café.", "Preferimos el café.", "Prefiere el café."], "answer": "Prefiero el café.", "why": "*prefiero* (I prefer) ends in -o."}, {"t": "build", "id": "6.1.build", "en": "The shop closes at six.", "tiles": ["la", "tienda", "cierra", "a", "las", "seis"], "extra": ["cerra"], "why": "*cerrar* changes e to ie: *cierra*.", "alts": [["a", "las", "seis", "la", "tienda", "cierra"], ["a", "las", "seis", "cierra", "la", "tienda"], ["cierra", "la", "tienda", "a", "las", "seis"]]}, {"t": "type", "id": "6.1.change", "prompt": "Cambia a yo: Nosotros empezamos mañana.", "answers": ["yo empiezo mañana", "empiezo mañana", "mañana empiezo", "mañana yo empiezo", "yo mañana empiezo"], "why": "*nosotros empezamos* → *yo empiezo*. The e becomes ie for yo.", "show": "Yo empiezo mañana."}, {"t": "type", "id": "6.1.think", "prompt": "Escribe: I think so. (think = *pensar*, so = *que sí*)", "answers": ["pienso que sí", "yo pienso que sí", "creo que sí", "yo creo que sí"], "why": "*pensar* → *pienso*. *Pienso que sí.* (*Creo que sí* also works.)", "show": "Pienso que sí."}, {"t": "say", "id": "6.1.say", "es": "Empiezo a las siete y cierro a las cinco.", "en": "I start at seven and I close at five.", "tip": "Hear the ie: em-PYEH-soh, SYEH-rroh."}]}, {"id": "6.2", "title": "o becomes ue: puedo, cuesta", "minutes": 9, "steps": [{"t": "learn", "title": "o becomes ue", "text": ["Some verbs change o to ue in the same places: *poder* (to be able to) becomes *puedo* (I can).", "Again, 'we' keeps the plain o: *podemos*."], "examples": [["yo puedo", "I can"], ["tú puedes", "you can (a mate)"], ["usted puede", "you can (respectful)"], ["él puede, ella puede", "he can, she can"], ["nosotros podemos", "we can"], ["ustedes pueden", "you all can"], ["ellos pueden", "they can"]], "mistake": {"wrong": "Yo podo.", "right": "Yo puedo.", "why": "*poder* changes o to ue: *puedo*."}, "say": ["puedo", "puedes", "puede", "podemos", "pueden"]}, {"t": "learn", "title": "Puedo + a verb", "text": ["*puedo* works like *quiero*: the next verb stays in its dictionary form. *No puedo trabajar hoy.* I can't work today.", "*¿Puedes…?* is a friendly way to ask a mate for something: *¿Puedes llamar al jefe?*"], "mistake": {"wrong": "No puedo trabajo hoy.", "right": "No puedo trabajar hoy.", "why": "After *puedo*, use the dictionary form: *trabajar*."}, "chile": "In Chile a traffic jam is *un taco*: *Estoy en un taco.* I'm stuck in traffic."}, {"t": "learn", "title": "Handy o → ue verbs", "text": ["Same change, same endings. Only 'we' keeps the o.", "*¿Cuánto cuesta?* How much does it cost? More than one: *¿Cuánto cuestan?*", "Not every verb with an o or an e changes: *como*, *bebo* and *trabajo* stay as they are."], "examples": [["costar → cuesta", "to cost → it costs"], ["volver → vuelvo", "to come back → I come back"], ["dormir → duermo", "to sleep → I sleep"], ["encontrar → encuentro", "to find → I find"]], "mistake": {"wrong": "¿Cuánto cuesta las láminas?", "right": "¿Cuánto cuestan las láminas?", "why": "*las láminas* is more than one, so *cuestan*."}}, {"t": "choice", "id": "6.2.puedo", "prompt": "Completa: No ___ trabajar mañana. (poder, yo)", "options": ["puedo", "podo", "podemos"], "answer": "puedo", "why": "o becomes ue: *puedo*.", "speak": "No puedo trabajar mañana."}, {"t": "choice", "id": "6.2.podemos", "prompt": "Completa: Nosotros ___ terminar hoy. (poder)", "options": ["podemos", "puedemos", "pueden"], "answer": "podemos", "why": "'We' keeps the plain o: *podemos*.", "speak": "Nosotros podemos terminar hoy."}, {"t": "choice", "id": "6.2.cuestan", "prompt": "Completa: ¿Cuánto ___ los tornillos?", "options": ["cuestan", "cuesta", "costan"], "answer": "cuestan", "why": "*los tornillos* is more than one, so *cuestan*.", "speak": "¿Cuánto cuestan los tornillos?"}, {"t": "choice", "id": "6.2.ask", "prompt": "Elige: Can you call the boss? (to a mate)", "options": ["¿Puedes llamar al jefe?", "¿Puedes llamas al jefe?", "¿Podes a llamar al jefe?"], "answer": "¿Puedes llamar al jefe?", "why": "*puedes* + the verb in its dictionary form.", "speak": "¿Puedes llamar al jefe?"}, {"t": "listen", "id": "6.2.listen", "prompt": "Escucha. Which did you hear?", "es": "Vuelvo a las cuatro.", "options": ["Vuelvo a las cuatro.", "Volvemos a las cuatro.", "Vuelve a las cuatro."], "answer": "Vuelvo a las cuatro.", "why": "*vuelvo* (I come back) ends in -o."}, {"t": "build", "id": "6.2.build", "en": "I can't find the key.", "tiles": ["no", "encuentro", "la", "llave."], "extra": ["encontro"], "why": "*encontrar* changes o to ue: *encuentro*."}, {"t": "type", "id": "6.2.cant", "prompt": "Escribe: I can't today.", "answers": ["no puedo hoy", "hoy no puedo", "yo no puedo hoy", "hoy yo no puedo", "no puedo hoy día", "hoy día no puedo", "yo hoy no puedo", "hoy no puedo yo"], "why": "*no* + *puedo*.", "show": "Hoy no puedo."}, {"t": "type", "id": "6.2.cost", "prompt": "Pregunta (in a shop): How much do the sheets cost?", "answers": ["¿cuánto cuestan las láminas?", "¿cuánto valen las láminas?", "¿las láminas cuánto cuestan?", "¿cuánto cuestan las láminas, por favor?", "¿cuánto son las láminas?", "¿a cuánto están las láminas?", "¿cuánto salen las láminas?", "¿qué precio tienen las láminas?", "¿cuánto valen las láminas, por favor?", "¿cuánto cuestan estas láminas?"], "why": "*las láminas* is more than one: *cuestan*.", "show": "¿Cuánto cuestan las láminas?"}, {"t": "choice", "id": "6.2.chile", "prompt": "A Chilean mate texts Estoy en un taco. Where are they?", "options": ["stuck in traffic", "at a taco shop", "at the beach"], "answer": "stuck in traffic", "why": "In Chile, *un taco* is a traffic jam.", "speak": "Estoy en un taco.", "optLang": "en"}, {"t": "say", "id": "6.2.say", "es": "No puedo hoy. ¿Puedes mañana?", "en": "I can't today. Can you tomorrow?", "tip": "Hear the ue: PWEH-doh, PWEH-dehs."}]}, {"id": "6.3", "title": "e becomes i: pido, repito", "minutes": 7, "steps": [{"t": "learn", "title": "e becomes i", "text": ["A few -ir verbs change e to i: *pedir* (to ask for, to order) becomes *pido*. (Not all of them: *preferir* is e to ie.)", "'We' keeps the plain e: *pedimos*."], "examples": [["yo pido", "I order, I ask for"], ["tú pides", "you order (a mate)"], ["usted pide", "you order (respectful)"], ["nosotros pedimos", "we order"], ["ellos piden", "they order"]], "mistake": {"wrong": "Nosotros pidimos un café.", "right": "Nosotros pedimos un café.", "why": "'We' keeps the plain e: *pedimos*."}}, {"t": "learn", "title": "Pedir or preguntar?", "text": ["English 'ask' is two verbs in Spanish.", "*pedir*: ask for a thing, or order it. *Pido un café.*", "*preguntar*: ask a question. *Pregunto dónde está el baño.*"], "mistake": {"wrong": "Pregunto un café.", "right": "Pido un café.", "why": "Asking for a thing is *pedir*. *preguntar* is for questions."}, "examples": [["Pido la cuenta.", "I ask for the bill."]]}, {"t": "learn", "title": "Repeat that, please", "text": ["*repetir* (to repeat) changes the same way: *repito*, *repites*, *repite*.", "The most useful sentence in this level: *¿Puede repetir, por favor?* Could you repeat that, please? Add *más despacio* (more slowly) if you need it."], "examples": [["Perdón, no entiendo.", "Sorry, I don't understand."], ["¿Puede repetir, por favor?", "Could you repeat that, please?"], ["Más despacio, por favor.", "More slowly, please."]], "mistake": {"wrong": "¿Puede repite, por favor?", "right": "¿Puede repetir, por favor?", "why": "After *puede*, the dictionary form: *repetir*."}}, {"t": "choice", "id": "6.3.pido", "prompt": "Completa: Siempre ___ café con leche. (pedir, yo)", "options": ["pido", "pide", "pedimos"], "answer": "pido", "why": "e becomes i: *pido*.", "speak": "Siempre pido café con leche."}, {"t": "choice", "id": "6.3.ask", "prompt": "Elige: I'm going to ask for help.", "options": ["Voy a pedir ayuda.", "Voy a preguntar ayuda.", "Voy a pido ayuda."], "answer": "Voy a pedir ayuda.", "why": "Asking for a thing is *pedir*.", "speak": "Voy a pedir ayuda."}, {"t": "choice", "id": "6.3.question", "prompt": "Elige: I'm asking where the hotel is.", "options": ["Pregunto dónde está el hotel.", "Pido dónde está el hotel.", "Pregunto dónde es el hotel."], "answer": "Pregunto dónde está el hotel.", "why": "A question is *preguntar*, and where a place is takes *está*.", "speak": "Pregunto dónde está el hotel."}, {"t": "listen", "id": "6.3.listen", "prompt": "Escucha. Which did you hear?", "es": "¿Puede repetir, por favor?", "options": ["¿Puede repetir, por favor?", "¿Puedes repetir, por favor?", "¿Puede pedir, por favor?"], "answer": "¿Puede repetir, por favor?", "why": "*puede* (usted) + *repetir*."}, {"t": "build", "id": "6.3.build", "en": "We order coffee with milk.", "tiles": ["pedimos", "café", "con", "leche."], "extra": ["pidimos"], "why": "'We' keeps the plain e: *pedimos*."}, {"t": "type", "id": "6.3.repeat", "prompt": "Pregunta (to a customer): Could you repeat that, please?", "answers": ["¿puede repetir, por favor?", "¿puede repetir?", "¿me puede repetir, por favor?", "¿lo puede repetir, por favor?", "¿puede repetirlo, por favor?", "¿podría repetir, por favor?", "¿puede repetir más despacio, por favor?", "por favor, ¿puede repetir?", "¿puede repetirlo?", "¿me lo puede repetir, por favor?", "¿me puede repetir?", "¿puede repetir eso, por favor?", "¿podría repetirlo, por favor?", "¿podría repetir?", "¿puede repetir otra vez, por favor?", "¿me podría repetir?", "¿podría repetirme eso?", "¿puede repetirme, por favor?"], "why": "*¿Puede repetir, por favor?*", "show": "¿Puede repetir, por favor?"}, {"t": "type", "id": "6.3.order", "prompt": "Cambia a nosotros: Yo pido la cuenta.", "answers": ["nosotros pedimos la cuenta", "pedimos la cuenta"], "why": "'We' keeps the plain e: *pedimos*. (*la cuenta* = the bill)", "show": "Pedimos la cuenta."}, {"t": "say", "id": "6.3.say", "es": "Perdón, no entiendo. ¿Puede repetir más despacio?", "en": "Sorry, I don't understand. Could you repeat that more slowly?", "tip": "despacio is des-PAH-syoh."}]}, {"id": "6.4", "title": "Odd yo forms: hago, pongo, salgo", "minutes": 8, "steps": [{"t": "learn", "title": "-go in the yo form", "text": ["A handful of everyday verbs end in -go for *yo* only. For these four verbs, every other form is regular."], "examples": [["hacer → hago", "to do, to make → I do, I make"], ["poner → pongo", "to put → I put"], ["salir → salgo", "to leave, to go out → I leave"], ["traer → traigo", "to bring → I bring"]], "mistake": {"wrong": "Yo hace la lista.", "right": "Yo hago la lista.", "why": "*hacer* is *hago* for yo. *hace* is for usted, él and ella."}, "say": ["hago", "pongo", "salgo", "traigo"]}, {"t": "learn", "title": "Tener and venir", "text": ["*tener* and *venir* (to come) do both: -go for *yo*, and e to ie for tú, él and ellos.", "*tengo, tienes, tiene, tenemos, tienen*. *vengo, vienes, viene, venimos, vienen*."], "examples": [["Vengo mañana.", "I'm coming tomorrow."], ["¿Vienes conmigo?", "Are you coming with me?"], ["Mi jefe viene a las ocho.", "My boss is coming at eight."]], "mistake": {"wrong": "Yo veno mañana.", "right": "Yo vengo mañana.", "why": "*venir* is *vengo* for yo."}}, {"t": "learn", "title": "¿Qué haces?", "text": ["*¿Qué haces?* means 'What are you doing?' (right now).", "Usually you answer with the action itself: *¿Qué haces? Trabajo en el techo.* (*Hago la lista* is fine too, when making something is the action.)"], "mistake": {"wrong": "Hago trabajar en el techo.", "right": "Trabajo en el techo.", "why": "Don't put *hago* in front of another verb. Just say the action: *trabajo*."}}, {"t": "choice", "id": "6.4.hago", "prompt": "Completa: Yo ___ la lista. (hacer)", "options": ["hago", "hace", "haco"], "answer": "hago", "why": "*hacer* is *hago* for yo.", "speak": "Yo hago la lista."}, {"t": "choice", "id": "6.4.salgo", "prompt": "Completa: ___ a las cinco. (salir, yo)", "options": ["Salgo", "Salo", "Sale"], "answer": "Salgo", "why": "*salir* is *salgo* for yo.", "speak": "Salgo a las cinco."}, {"t": "choice", "id": "6.4.vienes", "prompt": "Completa: ¿___ mañana? (venir, to a mate)", "options": ["Vienes", "Venes", "Vengo"], "answer": "Vienes", "why": "*venir* changes e to ie for tú: *vienes*.", "speak": "¿Vienes mañana?"}, {"t": "choice", "id": "6.4.answer", "prompt": "Responde: ¿Qué haces?", "options": ["Corto las láminas.", "Hago corto las láminas.", "Hago las láminas cortar."], "answer": "Corto las láminas.", "why": "Answer with the real verb: *corto*.", "speak": "¿Qué haces? Corto las láminas."}, {"t": "listen", "id": "6.4.listen", "prompt": "Escucha. Which did you hear?", "es": "Traigo los clavos.", "options": ["Traigo los clavos.", "Trae los clavos.", "Traen los clavos."], "answer": "Traigo los clavos.", "why": "*traigo* (I bring) ends in -go."}, {"t": "build", "id": "6.4.build", "en": "I put the nails in the truck.", "tiles": ["pongo", "los", "clavos", "en", "el", "camión."], "extra": ["pono"], "why": "*poner* is *pongo* for yo."}, {"t": "type", "id": "6.4.bring", "prompt": "Cambia a yo: Él trae el martillo.", "answers": ["yo traigo el martillo", "traigo el martillo"], "why": "*traer* is *traigo* for yo.", "show": "Yo traigo el martillo."}, {"t": "type", "id": "6.4.what", "prompt": "Pregunta (to a mate): What are you doing?", "answers": ["¿qué haces?", "¿qué haces tú?", "¿tú qué haces?", "¿qué estás haciendo?", "¿qué hacís?", "¿qué estás haciendo tú?", "¿qué haces ahora?", "¿qué estái haciendo?", "¿qué hacés?", "¿qué estás haciendo ahora?"], "why": "*¿Qué haces?*", "show": "¿Qué haces?"}, {"t": "say", "id": "6.4.say", "es": "Hago la lista, traigo los clavos y salgo a las cinco.", "en": "I make the list, I bring the nails and I leave at five.", "tip": "Hear the g in each: AH-goh, TRY-goh, SAHL-goh."}]}, {"id": "6.5", "title": "Me, te, se verbs", "minutes": 8, "steps": [{"t": "learn", "title": "Me llamo was one all along", "text": ["Some verbs come with a little word that points back at the person: *me llamo* (I call myself).", "In the dictionary they end in -se: *levantarse* (to get up). The little word changes with the person, and the verb takes its normal ending."], "examples": [["me levanto", "I get up"], ["te levantas", "you get up (a mate)"], ["se levanta", "he, she gets up, you get up (usted)"], ["nos levantamos", "we get up"], ["se levantan", "they get up, you all get up"]], "mistake": {"wrong": "Yo levanto a las seis.", "right": "Me levanto a las seis.", "why": "Getting yourself up needs *me*: *me levanto*."}, "say": ["me levanto", "te levantas", "se levanta", "nos levantamos", "se levantan"]}, {"t": "learn", "title": "Daily me, te, se verbs", "text": ["These all work like *levantarse*. *acostarse* also changes o to ue: *me acuesto*."], "examples": [["levantarse → me levanto", "to get up → I get up"], ["ducharse → me ducho", "to shower → I shower"], ["acostarse → me acuesto", "to go to bed → I go to bed"], ["quedarse → me quedo", "to stay → I stay"]], "mistake": {"wrong": "Nosotros se levantamos.", "right": "Nosotros nos levantamos.", "why": "'We' takes *nos*: *nos levantamos*."}}, {"t": "choice", "id": "6.5.me", "prompt": "Completa: Yo ___ levanto a las cinco.", "options": ["me", "se", "te"], "answer": "me", "why": "*yo* takes *me*.", "speak": "Yo me levanto a las cinco."}, {"t": "choice", "id": "6.5.nos", "prompt": "Completa: Nosotros ___ quedamos en el hotel.", "options": ["nos", "se", "me"], "answer": "nos", "why": "*nosotros* takes *nos*.", "speak": "Nosotros nos quedamos en el hotel."}, {"t": "choice", "id": "6.5.te", "prompt": "Elige: What time do you get up? (to a mate)", "options": ["¿A qué hora te levantas?", "¿A qué hora se levantas?", "¿A qué hora levantas?"], "answer": "¿A qué hora te levantas?", "why": "*tú* takes *te*: *te levantas*.", "speak": "¿A qué hora te levantas?"}, {"t": "choice", "id": "6.5.acuesto", "prompt": "Completa: Me ___ a las diez. (acostarse)", "options": ["acuesto", "acosto", "acuestas"], "answer": "acuesto", "why": "o becomes ue: *me acuesto*.", "speak": "Me acuesto a las diez."}, {"t": "listen", "id": "6.5.listen", "prompt": "Escucha. Which did you hear?", "es": "Se ducha a las seis.", "options": ["Se ducha a las seis.", "Me ducho a las seis.", "Nos duchamos a las seis."], "answer": "Se ducha a las seis.", "why": "*se ducha* is he or she showers."}, {"t": "build", "id": "6.5.build", "en": "We get up at six.", "tiles": ["nos", "levantamos", "a", "las", "seis"], "extra": ["se"], "why": "'We' takes *nos*: *nos levantamos*.", "alts": [["a", "las", "seis", "nos", "levantamos"]]}, {"t": "type", "id": "6.5.getup", "prompt": "Escribe: I get up at six.", "answers": ["me levanto a las seis", "yo me levanto a las seis", "a las seis me levanto", "me levanto a las 6", "yo me levanto a las 6", "a las 6 me levanto", "a las seis yo me levanto", "me levanto a las seis de la mañana", "me levanto a las 6 de la mañana", "yo me levanto a las seis de la mañana", "a las seis de la mañana me levanto"], "why": "*me levanto* + *a las seis*.", "show": "Me levanto a las seis."}, {"t": "type", "id": "6.5.change", "prompt": "Cambia a nosotros: Me quedo en Sídney.", "answers": ["nos quedamos en sídney", "nosotros nos quedamos en sídney", "nos quedamos en sydney", "nosotros nos quedamos en sydney"], "why": "*me quedo* → *nos quedamos*.", "show": "Nos quedamos en Sídney."}, {"t": "say", "id": "6.5.say", "es": "Me levanto a las cinco y me acuesto a las diez.", "en": "I get up at five and I go to bed at ten.", "tip": "acuesto is ah-KWEHS-toh."}]}, {"id": "6.6", "title": "My day", "minutes": 8, "steps": [{"t": "learn", "title": "Me on the end", "text": ["After *tengo que*, *voy a*, *quiero* or *puedo*, the little word can go on the end of the dictionary form: *Tengo que levantarme.* I have to get up.", "It must match the person: *levantarme*, *levantarte*, *levantarnos*.", "It can also go first, before the whole thing: *Me tengo que levantar.* Both are right."], "examples": [["Tengo que levantarme temprano.", "I have to get up early."], ["Voy a quedarme en casa.", "I'm going to stay home."], ["¿Quieres quedarte?", "Do you want to stay?"]], "mistake": {"wrong": "Tengo que levantarse temprano.", "right": "Tengo que levantarme temprano.", "why": "It's me getting up, so *levantarme*."}}, {"t": "learn", "title": "Telling your day in order", "text": ["Four handy words for your day, and one verb for the morning."], "examples": [["primero", "first"], ["después", "after that"], ["temprano", "early"], ["tarde", "late"], ["desayunar → desayuno", "to have breakfast → I have breakfast"]], "mistake": {"wrong": "Me levanto tardo.", "right": "Me levanto tarde.", "why": "*tarde* means late and it never changes. *tardo* is a different word."}, "chile": "In Chile a party or a night out is *un carrete*: *El sábado voy a un carrete.* On Saturday I'm going to a party."}, {"t": "choice", "id": "6.6.end", "prompt": "Elige: I have to get up early.", "options": ["Tengo que levantarme temprano.", "Tengo que levantarse temprano.", "Tengo que levanto temprano."], "answer": "Tengo que levantarme temprano.", "why": "It's me, so *levantarme*.", "speak": "Tengo que levantarme temprano."}, {"t": "choice", "id": "6.6.stay", "prompt": "Completa: ¿Quieres ___ en el hotel? (stay, to a mate)", "options": ["quedarte", "quedarme", "quedas"], "answer": "quedarte", "why": "Asking a mate, so *quedarte*.", "speak": "¿Quieres quedarte en el hotel?"}, {"t": "choice", "id": "6.6.order", "prompt": "What does this mean?", "es": "Primero me ducho, después desayuno.", "options": ["First I shower, then I have breakfast.", "I shower after breakfast.", "First I have breakfast, then I shower."], "answer": "First I shower, then I have breakfast.", "why": "*primero* is first, *después* is after that. *desayuno* is I have breakfast.", "speak": "Primero me ducho, después desayuno.", "optLang": "en"}, {"t": "listen", "id": "6.6.listen", "prompt": "Escucha. Which did you hear?", "es": "Voy a quedarme en casa.", "options": ["Voy a quedarme en casa.", "Voy a quedarte en casa.", "Vamos a quedarnos en casa."], "answer": "Voy a quedarme en casa.", "why": "*quedarme*, I'm going to stay home."}, {"t": "build", "id": "6.6.build", "en": "I have to stay at the hotel.", "tiles": ["tengo", "que", "quedarme", "en", "el", "hotel."], "extra": ["quedarte"], "why": "It's me, so *quedarme*."}, {"t": "type", "id": "6.6.home", "prompt": "Usa voy a: I'm going to stay home.", "answers": ["voy a quedarme en casa", "me voy a quedar en casa", "yo voy a quedarme en casa", "yo me voy a quedar en casa", "voy a quedarme en la casa", "me voy a quedar en la casa", "voy a quedarme en mi casa", "me voy a quedar en mi casa"], "why": "*voy a quedarme* (or *me voy a quedar*) + *en casa*.", "show": "Voy a quedarme en casa."}, {"t": "type", "id": "6.6.day", "prompt": "Escribe: First I shower, then I eat.", "answers": ["primero me ducho, después como", "primero me ducho y después como", "primero me ducho, luego como", "primero me ducho y luego como", "primero me ducho, después yo como", "primero me ducho y después yo como", "primero me baño, después como", "primero me baño y después como", "primero me baño y luego como", "primero me ducho, luego yo como", "primero me ducho y luego yo como"], "why": "*Primero me ducho, después como.*", "show": "Primero me ducho, después como."}, {"t": "choice", "id": "6.6.chile", "prompt": "A Chilean mate says El sábado voy a un carrete. On Saturday they're going to…", "options": ["a party", "a job", "the beach"], "answer": "a party", "why": "In Chile *un carrete* is a party or a night out.", "speak": "El sábado voy a un carrete.", "optLang": "en"}, {"t": "say", "id": "6.6.say", "es": "Primero me levanto, después me ducho y salgo a las seis.", "en": "First I get up, then I shower and I leave at six.", "tip": "después has the push on the end: des-PWEHS."}]}], "check": {"title": "Level 6 check", "pass": 0.8, "steps": [{"t": "choice", "id": "6.c.cierra", "prompt": "Completa: ¿A qué hora ___ la tienda? (cerrar)", "options": ["cierra", "cerra", "cierramos"], "answer": "cierra", "why": "e becomes ie: *cierra*.", "speak": "¿A qué hora cierra la tienda?"}, {"t": "choice", "id": "6.c.empezamos", "prompt": "Completa: Nosotros ___ el lunes. (empezar)", "options": ["empezamos", "empiezamos", "empiezan"], "answer": "empezamos", "why": "'We' keeps the plain e.", "speak": "Nosotros empezamos el lunes."}, {"t": "type", "id": "6.c.understand", "prompt": "Escribe: I don't understand.", "answers": ["no entiendo", "yo no entiendo", "no te entiendo", "no le entiendo", "no comprendo", "no lo entiendo", "yo no comprendo", "perdón, no entiendo", "no lo comprendo", "no te comprendo"], "why": "*entender* → *entiendo*.", "show": "No entiendo."}, {"t": "choice", "id": "6.c.pueden", "prompt": "Completa: Ellos no ___ venir hoy. (poder)", "options": ["pueden", "poden", "podemos"], "answer": "pueden", "why": "o becomes ue for ellos: *pueden*.", "speak": "Ellos no pueden venir hoy."}, {"t": "type", "id": "6.c.cost", "prompt": "Pregunta (in a shop): How much does the hammer cost?", "answers": ["¿cuánto cuesta el martillo?", "¿cuánto vale el martillo?", "¿el martillo cuánto cuesta?", "¿cuánto es el martillo?", "¿cuánto cuesta el martillo, por favor?", "¿cuánto sale el martillo?", "¿a cuánto está el martillo?", "¿qué precio tiene el martillo?", "¿cuánto vale el martillo, por favor?", "¿cuánto cuesta un martillo?"], "why": "One hammer: *cuesta*.", "show": "¿Cuánto cuesta el martillo?"}, {"t": "choice", "id": "6.c.vuelvo", "prompt": "Completa: ___ a las tres. (volver, yo)", "options": ["Vuelvo", "Volvo", "Vuelve"], "answer": "Vuelvo", "why": "o becomes ue: *vuelvo*.", "speak": "Vuelvo a las tres."}, {"t": "choice", "id": "6.c.pedir", "prompt": "Elige: We're going to ask for the bill.", "options": ["Vamos a pedir la cuenta.", "Vamos a preguntar la cuenta.", "Vamos a pidir la cuenta."], "answer": "Vamos a pedir la cuenta.", "why": "Asking for a thing is *pedir*.", "speak": "Vamos a pedir la cuenta."}, {"t": "type", "id": "6.c.coming", "prompt": "Pregunta (to a mate): Are you coming to the shop tomorrow?", "answers": ["¿vienes a la tienda mañana?", "¿mañana vienes a la tienda?", "¿tú vienes a la tienda mañana?", "¿vienes tú a la tienda mañana?", "¿vas a venir a la tienda mañana?", "¿venís a la tienda mañana?", "¿vienes mañana a la tienda?"], "why": "*venir* changes e to ie for tú: *¿Vienes a la tienda mañana?*", "show": "¿Vienes a la tienda mañana?"}, {"t": "choice", "id": "6.c.salgo", "prompt": "Completa: Hoy ___ temprano. (salir, yo)", "options": ["salgo", "salo", "sale"], "answer": "salgo", "why": "*salir* is *salgo* for yo.", "speak": "Hoy salgo temprano."}, {"t": "choice", "id": "6.c.vengo", "prompt": "Completa: Yo ___ mañana con el camión. (venir)", "options": ["vengo", "veno", "viene"], "answer": "vengo", "why": "*venir* is *vengo* for yo.", "speak": "Yo vengo mañana con el camión."}, {"t": "build", "id": "6.c.build", "en": "I make the list and I bring the screws.", "tiles": ["hago", "la", "lista", "y", "traigo", "los", "tornillos."], "extra": ["hace"], "why": "*hago* and *traigo*, the -go yo forms."}, {"t": "choice", "id": "6.c.se", "prompt": "Completa: Mi jefe ___ levanta a las cinco.", "options": ["se", "me", "te"], "answer": "se", "why": "*él* (my boss) takes *se*: *se levanta*.", "speak": "Mi jefe se levanta a las cinco."}, {"t": "listen", "id": "6.c.listen", "prompt": "Escucha. Which did you hear?", "es": "Me acuesto tarde.", "options": ["Me acuesto tarde.", "Me levanto tarde.", "Se acuesta tarde."], "answer": "Me acuesto tarde.", "why": "*me acuesto* is I go to bed. *tarde* is late."}, {"t": "type", "id": "6.c.stay", "prompt": "Usa quiero: I want to stay at the hotel.", "answers": ["quiero quedarme en el hotel", "me quiero quedar en el hotel", "yo quiero quedarme en el hotel", "yo me quiero quedar en el hotel"], "why": "*quiero quedarme*: the *me* goes on the end (or first: *me quiero quedar*).", "show": "Quiero quedarme en el hotel."}, {"t": "choice", "id": "6.c.tienen", "prompt": "Completa: Ellos ___ mucho trabajo. (tener)", "options": ["tienen", "tenen", "tengo"], "answer": "tienen", "why": "*tener* changes e to ie for ellos: *tienen*.", "speak": "Ellos tienen mucho trabajo."}]}}, "7": {"id": 7, "lessons": [{"id": "7.1", "title": "-ar past: trabajé", "minutes": 9, "steps": [{"t": "learn", "title": "Talking about yesterday", "text": ["This level is about finished actions: things you did yesterday, last week, last year.", "The instruction *Cambia al pasado* means 'change it to the past'."], "examples": [["ayer", "yesterday"], ["anoche", "last night"], ["la semana pasada", "last week"], ["el año pasado", "last year"], ["el lunes pasado", "last Monday"]], "mistake": {"wrong": "el año pasada", "right": "el año pasado", "why": "*año* is masculine, so *pasado*. (*la semana pasada*, *el mes pasado*.)"}}, {"t": "learn", "title": "The -ar past endings", "text": ["Drop the -ar and add these. Watch the accent marks on yo and él."], "examples": [["yo trabajé", "I worked"], ["tú trabajaste", "you worked (a mate)"], ["usted trabajó", "you worked (respectful)"], ["él trabajó, ella trabajó", "he worked, she worked"], ["nosotros trabajamos", "we worked"], ["ustedes trabajaron", "you all worked"], ["ellos trabajaron", "they worked"]], "mistake": {"wrong": "Ayer trabajo diez horas.", "right": "Ayer trabajé diez horas.", "why": "Yesterday is finished, so the past: *trabajé*."}, "say": ["trabajé", "trabajaste", "trabajó", "trabajamos", "trabajaron"]}, {"t": "learn", "title": "The accent mark matters", "text": ["*trabajo* (push on BA) is 'I work'. *trabajó* (push on JÓ) is 'he worked'. One accent mark, a different person and time.", "*trabajamos* is both 'we work' and 'we worked'. Words like *ayer* make it clear."], "examples": [["Trabajo en el techo.", "I work on the roof."], ["Trabajó en el techo.", "He worked on the roof."]], "mistake": {"wrong": "Mi jefe trabajo ayer.", "right": "Mi jefe trabajó ayer.", "why": "He worked: *trabajó*, with the accent and the push on the end."}}, {"t": "choice", "id": "7.1.trabaje", "prompt": "Completa: Ayer ___ en el techo. (trabajar, yo)", "options": ["trabajé", "trabajo", "trabajó"], "answer": "trabajé", "why": "Yesterday, I: *trabajé*.", "speak": "Ayer trabajé en el techo."}, {"t": "choice", "id": "7.1.compraron", "prompt": "Completa: Ellos ___ las láminas ayer. (comprar)", "options": ["compraron", "compran", "compramos"], "answer": "compraron", "why": "They, in the past: *compraron*.", "speak": "Ellos compraron las láminas ayer."}, {"t": "choice", "id": "7.1.accent", "prompt": "What does this mean?", "es": "Mi hermano llamó anoche.", "options": ["My brother called last night.", "I call my brother at night.", "My brother calls at night."], "answer": "My brother called last night.", "why": "*llamó*, with the accent, is he called. *anoche* is last night.", "speak": "Mi hermano llamó anoche.", "optLang": "en"}, {"t": "choice", "id": "7.1.tu", "prompt": "Completa: ¿___ el techo ayer? (terminar, to a mate)", "options": ["Terminaste", "Terminó", "Termina"], "answer": "Terminaste", "why": "*tú* in the past ends in -aste: *terminaste*.", "speak": "¿Terminaste el techo ayer?"}, {"t": "listen", "id": "7.1.listen", "prompt": "Escucha. Which did you hear?", "es": "Cortó las láminas.", "options": ["Cortó las láminas.", "Corto las láminas.", "Cortaron las láminas."], "answer": "Cortó las láminas.", "why": "The push on the end, cor-TÓ: he or she cut."}, {"t": "build", "id": "7.1.build", "en": "We finished the roof yesterday.", "tiles": ["terminamos", "el", "techo", "ayer"], "extra": ["terminaron"], "why": "We: *terminamos*. *ayer* says it's the past.", "alts": [["ayer", "terminamos", "el", "techo"]]}, {"t": "type", "id": "7.1.past", "prompt": "Cambia al pasado: Hoy hablo con el jefe. (ayer)", "answers": ["ayer hablé con el jefe", "hablé con el jefe ayer", "ayer yo hablé con el jefe", "yo hablé con el jefe ayer"], "why": "*hablo* → *hablé*.", "show": "Ayer hablé con el jefe."}, {"t": "type", "id": "7.1.bought", "prompt": "Escribe: I bought nails yesterday.", "answers": ["compré clavos ayer", "ayer compré clavos", "yo compré clavos ayer", "ayer yo compré clavos", "ayer compré unos clavos", "compré unos clavos ayer", "ayer compré los clavos", "compré los clavos ayer", "ayer yo compré unos clavos", "yo compré unos clavos ayer"], "why": "*comprar* → *compré*.", "show": "Ayer compré clavos."}, {"t": "say", "id": "7.1.say", "es": "Ayer trabajé diez horas y terminé el techo.", "en": "Yesterday I worked ten hours and finished the roof.", "tip": "Push the end of each past verb: tra-ba-JÉ, ter-mi-NÉ."}]}, {"id": "7.2", "title": "-er and -ir past: comí, viví", "minutes": 8, "steps": [{"t": "learn", "title": "The -er and -ir past endings", "text": ["-er and -ir verbs share one set of past endings.", "*vivir* works the same: *viví*, *viviste*, *vivió*, *vivimos*, *vivieron*.", "*ya* means 'already': *¿Ya comiste?* Did you eat yet?", "(For -er verbs 'we' changes: *comemos* is 'we eat', *comimos* is 'we ate'.)"], "examples": [["yo comí", "I ate"], ["tú comiste", "you ate (a mate)"], ["usted comió", "you ate (respectful)"], ["él comió, ella comió", "he ate, she ate"], ["nosotros comimos", "we ate"], ["ustedes comieron", "you all ate"], ["ellos comieron", "they ate"], ["yo viví en Chile", "I lived in Chile"]], "mistake": {"wrong": "Ayer comé en el camión.", "right": "Ayer comí en el camión.", "why": "-er and -ir verbs end in -í for yo: *comí*."}, "say": ["comí", "comiste", "comió", "comimos", "comieron"]}, {"t": "learn", "title": "Good news: most shape-shifters relax", "text": ["Most -ar and -er verbs that change their middle in the present stay regular in the past.", "*cierro* → *cerré*. *vuelvo* → *volví*. *entiendo* → *entendí*.", "(*salgo* is just an odd yo form. *salir* is regular in the past: *salí*.)", "(A few very common verbs are the exception, like *poder* → *pude* and *tener* → *tuve*. They come in Lesson 7.4.)", "(-ir verbs that change, like *pedir* and *dormir*, still change a little for él and ellos: *pidió*, *durmió*. You'll meet those later.)"], "examples": [["Cerré la tienda a las seis.", "I closed the shop at six."], ["Volví tarde.", "I came back late."], ["Salimos a las cinco.", "We left at five."]], "mistake": {"wrong": "Vuelví tarde.", "right": "Volví tarde.", "why": "No ue in the past: *volví*."}}, {"t": "choice", "id": "7.2.comi", "prompt": "Completa: Anoche ___ pizza. (comer, yo)", "options": ["comí", "como", "comió"], "answer": "comí", "why": "Last night, I: *comí*.", "speak": "Anoche comí pizza."}, {"t": "choice", "id": "7.2.vendieron", "prompt": "Completa: Ellos ___ el camión el mes pasado. (vender)", "options": ["vendieron", "vendimos", "vendió"], "answer": "vendieron", "why": "They, in the past: *vendieron*.", "speak": "Ellos vendieron el camión el mes pasado."}, {"t": "choice", "id": "7.2.volvi", "prompt": "Completa: Ayer ___ a las ocho. (volver, yo)", "options": ["volví", "vuelví", "vuelvo"], "answer": "volví", "why": "No ue in the past: *volví*.", "speak": "Ayer volví a las ocho."}, {"t": "choice", "id": "7.2.meaning", "prompt": "What does this mean?", "es": "¿Entendiste?", "options": ["Did you understand?", "Do you understand?", "Did they understand?"], "answer": "Did you understand?", "why": "-iste is the tú past ending: *entendiste*.", "speak": "¿Entendiste?", "optLang": "en"}, {"t": "listen", "id": "7.2.listen", "prompt": "Escucha. Which did you hear?", "es": "Salimos temprano.", "options": ["Salimos temprano.", "Salió temprano.", "Salí temprano."], "answer": "Salimos temprano.", "why": "*salimos*, we left. (It's also 'we leave'; context tells you.)"}, {"t": "build", "id": "7.2.build", "en": "She wrote the list last night.", "tiles": ["ella", "escribió", "la", "lista", "anoche"], "extra": ["escribí"], "why": "She, in the past: *escribió*.", "alts": [["anoche", "ella", "escribió", "la", "lista"]]}, {"t": "type", "id": "7.2.closed", "prompt": "Cambia al pasado: Cierro la tienda a las seis. (ayer)", "answers": ["ayer cerré la tienda a las seis", "cerré la tienda a las seis ayer", "ayer yo cerré la tienda a las seis", "cerré la tienda a las seis", "cerré la tienda ayer a las seis", "ayer a las seis cerré la tienda", "ayer cerré la tienda a las 6", "yo cerré la tienda a las seis ayer"], "why": "*cierro* → *cerré*. No ie in the past.", "show": "Ayer cerré la tienda a las seis."}, {"t": "type", "id": "7.2.ate", "prompt": "Pregunta (to a mate): Did you eat?", "answers": ["¿comiste?", "¿tú comiste?", "¿comiste tú?", "¿ya comiste?", "¿comiste algo?", "¿ya comiste algo?", "¿comiste ya?", "¿ya comiste tú?", "¿tú ya comiste?"], "why": "*tú* past of *comer*: *comiste*.", "show": "¿Comiste?"}, {"t": "say", "id": "7.2.say", "es": "Salí a las cinco, comí y volví tarde.", "en": "I left at five, I ate and I came back late.", "tip": "Push the í on each: sa-LÍ, co-MÍ, vol-VÍ."}]}, {"id": "7.3", "title": "Fui: I went, I was", "minutes": 7, "steps": [{"t": "learn", "title": "One past for ir and ser", "text": ["*ir* (to go) and *ser* (to be) share the same past forms. The sentence tells you which one.", "*Fui a Chile.* I went to Chile. *Fue un buen día.* It was a good day."], "examples": [["yo fui", "I went, I was"], ["tú fuiste", "you went (a mate)"], ["usted fue", "you went (respectful)"], ["él fue, ella fue", "he went, she went, it was"], ["nosotros fuimos", "we went"], ["ustedes fueron", "you all went"], ["ellos fueron", "they went"]], "mistake": {"wrong": "Yo fue a la playa.", "right": "Yo fui a la playa.", "why": "*yo* takes *fui*. *fue* is for usted, él and ella."}, "say": ["fui", "fuiste", "fue", "fuimos", "fueron"]}, {"t": "learn", "title": "¿Cómo te fue?", "text": ["*¿Cómo te fue?* means 'How did it go?' Answer with *me fue*: *Me fue bien.* It went well. *Me fue mal.* It went badly."], "examples": [["¿Cómo te fue en el trabajo?", "How did it go at work?"], ["Me fue muy bien.", "It went really well."]], "mistake": {"wrong": "Me fui bien.", "right": "Me fue bien.", "why": "'It' went well, so *fue*. *Me fui* means 'I left'."}}, {"t": "choice", "id": "7.3.fui", "prompt": "Completa: El sábado pasado ___ a la playa. (ir, yo)", "options": ["fui", "fue", "voy"], "answer": "fui", "why": "Saturday is finished, I: *fui*.", "speak": "El sábado pasado fui a la playa."}, {"t": "choice", "id": "7.3.fuimos", "prompt": "Completa: Nosotros ___ a Chile el año pasado.", "options": ["fuimos", "fueron", "vamos"], "answer": "fuimos", "why": "We, last year: *fuimos*.", "speak": "Nosotros fuimos a Chile el año pasado."}, {"t": "choice", "id": "7.3.was", "prompt": "What does this mean?", "es": "Fue un día largo.", "options": ["It was a long day.", "I went for a long day.", "It's a long day."], "answer": "It was a long day.", "why": "Here *fue* is the past of *ser*: it was.", "speak": "Fue un día largo.", "optLang": "en"}, {"t": "choice", "id": "7.3.how", "prompt": "Responde: ¿Cómo te fue? (it went well)", "options": ["Me fue bien.", "Me fui bien.", "Fui bien."], "answer": "Me fue bien.", "why": "'It went well to me': *me fue bien*.", "speak": "Me fue bien."}, {"t": "listen", "id": "7.3.listen", "prompt": "Escucha. Which did you hear?", "es": "¿Adónde fuiste?", "options": ["¿Adónde fuiste?", "¿Adónde fueron?", "¿Adónde vas?"], "answer": "¿Adónde fuiste?", "why": "*fuiste*, where did you go?"}, {"t": "build", "id": "7.3.build", "en": "They went to the beach on Sunday.", "tiles": ["fueron", "a", "la", "playa", "el", "domingo"], "extra": ["fuimos"], "why": "They: *fueron*.", "alts": [["el", "domingo", "fueron", "a", "la", "playa"]]}, {"t": "type", "id": "7.3.ask", "prompt": "Pregunta (to a mate): How did it go?", "answers": ["¿cómo te fue?", "¿y cómo te fue?", "¿qué tal te fue?", "¿cómo te fue hoy?", "¿cómo te fue en el trabajo?", "¿cómo te fue ayer?", "¿y qué tal te fue?"], "why": "*¿Cómo te fue?*", "show": "¿Cómo te fue?"}, {"t": "type", "id": "7.3.went", "prompt": "Escribe: I went to Chile last year.", "answers": ["fui a chile el año pasado", "el año pasado fui a chile", "yo fui a chile el año pasado", "el año pasado yo fui a chile"], "why": "*ir* → *fui*.", "show": "Fui a Chile el año pasado."}, {"t": "say", "id": "7.3.say", "es": "¿Cómo te fue? Me fue muy bien, gracias.", "en": "How did it go? It went really well, thanks.", "tip": "fue is one beat: FWEH."}]}, {"id": "7.4", "title": "Odd pasts: hice, tuve, estuve", "minutes": 9, "steps": [{"t": "learn", "title": "Hacer in the past", "text": ["*hacer* has its own past. These have no accent marks.", "*hizo* is spelt with a z, to keep the s sound."], "examples": [["yo hice", "I did, I made"], ["tú hiciste", "you did (a mate)"], ["él hizo, ella hizo", "he did, she did"], ["nosotros hicimos", "we did"], ["ellos hicieron", "they did"]], "mistake": {"wrong": "Yo hací la lista.", "right": "Yo hice la lista.", "why": "*hacer* is irregular in the past: *hice*."}, "say": ["hice", "hiciste", "hizo", "hicimos", "hicieron"]}, {"t": "learn", "title": "Tuve, estuve, pude, vine", "text": ["These four share one pattern: a new middle, and the endings -e, -iste, -o, -imos, -ieron with no accents.", "*tener* → *tuve*. *estar* → *estuve*. *poder* → *pude*. *venir* → *vine*.", "For 'I was' in a place, use *estuve*, not *fui*. *Estuve en Chile* = I was in Chile. *Fui a Chile* = I went to Chile."], "examples": [["Tuve que trabajar.", "I had to work."], ["Estuve en Chile.", "I was in Chile."], ["No pude venir.", "I couldn't come."], ["Vino a las ocho.", "He came at eight."]], "mistake": {"wrong": "Tení que trabajar.", "right": "Tuve que trabajar.", "why": "*tener* is irregular in the past: *tuve*."}, "chile": "In Chile you might hear *El carrete estuvo bacán.* The party was awesome."}, {"t": "choice", "id": "7.4.hice", "prompt": "Completa: Ayer ___ la lista. (hacer, yo)", "options": ["hice", "hací", "hizo"], "answer": "hice", "why": "*hacer* → *hice* for yo.", "speak": "Ayer hice la lista."}, {"t": "choice", "id": "7.4.tuve", "prompt": "Completa: El sábado pasado ___ que trabajar. (tener, yo)", "options": ["tuve", "tení", "tengo"], "answer": "tuve", "why": "*tener* → *tuve*.", "speak": "El sábado pasado tuve que trabajar."}, {"t": "choice", "id": "7.4.estuvimos", "prompt": "Completa: La semana pasada nosotros ___ en el hotel dos días. (estar)", "options": ["estuvimos", "estamos", "estuvieron"], "answer": "estuvimos", "why": "We, in the past: *estuvimos*.", "speak": "La semana pasada nosotros estuvimos en el hotel dos días."}, {"t": "choice", "id": "7.4.pude", "prompt": "Elige: I couldn't come.", "options": ["No pude venir.", "No podí venir.", "No puedo vine."], "answer": "No pude venir.", "why": "*poder* → *pude*, then *venir* in its dictionary form.", "speak": "No pude venir."}, {"t": "listen", "id": "7.4.listen", "prompt": "Escucha. Which did you hear?", "es": "¿Qué hiciste el sábado?", "options": ["¿Qué hiciste el sábado?", "¿Qué haces el sábado?", "¿Qué hizo el sábado?"], "answer": "¿Qué hiciste el sábado?", "why": "*hiciste*, what did you do?"}, {"t": "build", "id": "7.4.build", "en": "I had to buy screws.", "tiles": ["tuve", "que", "comprar", "tornillos."], "extra": ["compré"], "why": "*tuve que* + the dictionary form, just like *tengo que*."}, {"t": "type", "id": "7.4.past", "prompt": "Cambia al pasado: Estoy en Sídney. (la semana pasada)", "answers": ["la semana pasada estuve en sídney", "estuve en sídney la semana pasada", "la semana pasada estuve en sydney", "estuve en sydney la semana pasada", "la semana pasada yo estuve en sídney", "yo estuve en sídney la semana pasada", "yo estuve en sydney la semana pasada", "la semana pasada yo estuve en sydney"], "why": "*estoy* → *estuve*.", "show": "La semana pasada estuve en Sídney."}, {"t": "type", "id": "7.4.what", "prompt": "Pregunta (to a mate): What did you do yesterday?", "answers": ["¿qué hiciste ayer?", "¿ayer qué hiciste?", "¿qué hiciste tú ayer?", "¿tú qué hiciste ayer?", "¿y qué hiciste ayer?"], "why": "*¿Qué hiciste?* + *ayer*.", "show": "¿Qué hiciste ayer?"}, {"t": "choice", "id": "7.4.chile", "prompt": "A Chilean mate says El carrete estuvo bacán. The party was…", "options": ["awesome", "boring", "long"], "answer": "awesome", "why": "*bacán* is Chilean for great or awesome. *estuvo* is the past of *estar*.", "speak": "El carrete estuvo bacán.", "optLang": "en"}, {"t": "say", "id": "7.4.say", "es": "No pude venir porque tuve que trabajar.", "en": "I couldn't come because I had to work.", "tip": "pude and tuve: POO-deh, TOO-beh."}]}, {"id": "7.5", "title": "Llegué, pagué and 'ago'", "minutes": 8, "steps": [{"t": "learn", "title": "Spelling changes in the yo form", "text": ["Some -ar verbs change their spelling for yo in the past, only to keep the sound the same.", "-gar → -gué: *llegar* → *llegué*, *pagar* → *pagué*.", "-car → -qué: *buscar* (to look for) → *busqué*.", "-zar → -cé: *empezar* → *empecé*.", "The other forms are normal: *llegó*, *pagaste*, *buscaron*."], "mistake": {"wrong": "Llegé tarde.", "right": "Llegué tarde.", "why": "Add a u to keep the hard g: *llegué*."}}, {"t": "learn", "title": "Ago: hace + time", "text": ["For 'ago', put *hace* before the amount of time: *hace dos días* (two days ago), *hace una hora* (an hour ago)."], "examples": [["Llegué hace una hora.", "I arrived an hour ago."], ["Fui a Chile hace dos años.", "I went to Chile two years ago."]], "mistake": {"wrong": "Llegué dos días hace.", "right": "Llegué hace dos días.", "why": "*hace* comes before the time."}}, {"t": "choice", "id": "7.5.llegue", "prompt": "Completa: Ayer ___ tarde al trabajo. (llegar, yo)", "options": ["llegué", "llegé", "llegó"], "answer": "llegué", "why": "-gar → -gué for yo: *llegué*.", "speak": "Ayer llegué tarde al trabajo."}, {"t": "choice", "id": "7.5.busque", "prompt": "Completa: ___ la llave toda la mañana. (buscar, yo)", "options": ["Busqué", "Buscé", "Buscó"], "answer": "Busqué", "why": "-car → -qué for yo: *busqué*.", "speak": "Busqué la llave toda la mañana."}, {"t": "choice", "id": "7.5.pago", "prompt": "Completa: Mi jefe ___ la cuenta. (pagar, él)", "options": ["pagó", "pagué", "pago"], "answer": "pagó", "why": "Only yo changes spelling. He paid: *pagó*.", "speak": "Mi jefe pagó la cuenta."}, {"t": "choice", "id": "7.5.ago", "prompt": "Elige: I started two weeks ago.", "options": ["Empecé hace dos semanas.", "Empecé dos semanas hace.", "Empiezo hace dos semanas."], "answer": "Empecé hace dos semanas.", "why": "*empecé*, then *hace* + the time.", "speak": "Empecé hace dos semanas."}, {"t": "listen", "id": "7.5.listen", "prompt": "Escucha. When did they arrive?", "es": "Llegaron hace una hora.", "options": ["an hour ago", "in an hour", "at one o'clock"], "answer": "an hour ago", "why": "*hace una hora* is an hour ago.", "optLang": "en"}, {"t": "build", "id": "7.5.build", "en": "I paid the bill an hour ago.", "tiles": ["pagué", "la", "cuenta", "hace", "una", "hora"], "extra": ["pagé"], "why": "*pagué* keeps the hard g with a u, then *hace una hora*.", "alts": [["hace", "una", "hora", "pagué", "la", "cuenta"]]}, {"t": "type", "id": "7.5.arrived", "prompt": "Escribe: I arrived an hour ago.", "answers": ["llegué hace una hora", "yo llegué hace una hora", "hace una hora llegué", "hace una hora que llegué"], "why": "*llegué*, then *hace una hora*.", "show": "Llegué hace una hora."}, {"t": "type", "id": "7.5.started", "prompt": "Cambia al pasado: Empiezo a las siete. (ayer)", "answers": ["ayer empecé a las siete", "empecé a las siete ayer", "ayer yo empecé a las siete", "empecé a las siete", "ayer empecé a las 7", "empecé ayer a las siete", "ayer a las siete empecé"], "why": "*empiezo* → *empecé*: no ie, and z becomes c before é.", "show": "Ayer empecé a las siete."}, {"t": "say", "id": "7.5.say", "es": "Llegué hace una hora y pagué la cuenta.", "en": "I arrived an hour ago and I paid the bill.", "tip": "llegué and pagué: yeh-GEH, pah-GEH. The u is silent."}]}, {"id": "7.6", "title": "What happened?", "minutes": 8, "steps": [{"t": "learn", "title": "¿Qué pasó?", "text": ["*¿Qué pasó?* means 'What happened?' (*pasar* = to happen, or to pass).", "Answer with what happened, in the past: *Se rompió la escalera.* The ladder broke. (*se* here just means it broke by itself.)"], "examples": [["¿Qué pasó?", "What happened?"], ["No pasó nada.", "Nothing happened."], ["Llovió mucho.", "It rained a lot."]], "mistake": {"wrong": "¿Qué pasa ayer?", "right": "¿Qué pasó ayer?", "why": "Yesterday is finished, so the past: *pasó*."}}, {"t": "learn", "title": "Telling it in order", "text": ["Use *primero*, *después* and *luego* (then) to tell a story in the past."], "examples": [["Primero llegué al trabajo.", "First I got to work."], ["Después subí al techo.", "After that I went up on the roof."], ["Luego empezó a llover.", "Then it started to rain."]], "mistake": {"wrong": "Primero llego, después subí.", "right": "Primero llegué, después subí.", "why": "Keep the whole story in the past."}, "chile": "In Chile a girlfriend is *la polola* and a boyfriend is *el pololo*: *Fui al cine con mi polola.* I went to the cinema with my girlfriend."}, {"t": "choice", "id": "7.6.paso", "prompt": "What does this mean?", "es": "¿Qué pasó ayer?", "options": ["What happened yesterday?", "What's happening today?", "What did you buy yesterday?"], "answer": "What happened yesterday?", "why": "*pasó* is the past of *pasar*: happened.", "speak": "¿Qué pasó ayer?", "optLang": "en"}, {"t": "choice", "id": "7.6.story", "prompt": "Elige: First I arrived, then I went up on the roof.", "options": ["Primero llegué, después subí al techo.", "Primero llego, después subí al techo.", "Primero llegué, después subo al techo."], "answer": "Primero llegué, después subí al techo.", "why": "Both verbs in the past: *llegué*, *subí*.", "speak": "Primero llegué, después subí al techo."}, {"t": "choice", "id": "7.6.nothing", "prompt": "Responde: ¿Qué pasó? (nothing happened)", "options": ["No pasó nada.", "No pasa nada.", "Nada no pasó."], "answer": "No pasó nada.", "why": "*No pasó nada.* Spanish keeps both *no* and *nada*.", "speak": "No pasó nada."}, {"t": "listen", "id": "7.6.listen", "prompt": "Escucha. What happened?", "es": "Llovió mucho y no trabajamos.", "options": ["It rained a lot and we didn't work.", "It's raining a lot and we're not working.", "It rained a little and we worked."], "answer": "It rained a lot and we didn't work.", "why": "*llovió* (it rained), *no trabajamos* (we didn't work).", "optLang": "en"}, {"t": "build", "id": "7.6.build", "en": "Then it started to rain.", "tiles": ["luego", "empezó", "a", "llover."], "extra": ["empecé"], "why": "It started: *empezó*. *empezar a* + the dictionary form."}, {"t": "type", "id": "7.6.what", "prompt": "Pregunta (to a mate): What happened?", "answers": ["¿qué pasó?", "¿y qué pasó?", "¿qué fue lo que pasó?", "¿qué sucedió?"], "why": "*¿Qué pasó?*", "show": "¿Qué pasó?"}, {"t": "type", "id": "7.6.day", "prompt": "Escribe: Yesterday I worked and then I went to the beach.", "answers": ["ayer trabajé y después fui a la playa", "ayer trabajé y luego fui a la playa", "ayer trabajé y fui a la playa", "ayer yo trabajé y después fui a la playa", "ayer trabajé y después me fui a la playa", "ayer trabajé y luego me fui a la playa", "ayer trabajé, después fui a la playa", "ayer trabajé, luego fui a la playa", "trabajé ayer y después fui a la playa", "trabajé ayer y luego fui a la playa", "ayer yo trabajé y luego fui a la playa"], "why": "*trabajé*, then *fui a la playa*.", "show": "Ayer trabajé y después fui a la playa."}, {"t": "choice", "id": "7.6.chile", "prompt": "In Chile, mi polola is…", "options": ["my girlfriend", "my sister", "my boss"], "answer": "my girlfriend", "why": "In Chile *polola* is girlfriend and *pololo* is boyfriend.", "speak": "Fui al cine con mi polola.", "optLang": "en"}, {"t": "say", "id": "7.6.say", "es": "Primero llegué al trabajo, después subí al techo y luego empezó a llover.", "en": "First I got to work, then I went up on the roof, and then it started to rain.", "tip": "Slow down for the past endings: lle-GUÉ, su-BÍ, em-pe-ZÓ."}]}], "check": {"title": "Level 7 check", "pass": 0.8, "steps": [{"t": "choice", "id": "7.c.hable", "prompt": "Completa: Ayer ___ con el cliente. (hablar, yo)", "options": ["hablé", "hablo", "habló"], "answer": "hablé", "why": "Yesterday, I: *hablé*.", "speak": "Ayer hablé con el cliente."}, {"t": "choice", "id": "7.c.accent", "prompt": "What does this mean?", "es": "Mi hermana vendió el auto.", "options": ["My sister sold the car.", "I sell my sister's car.", "My sister sells the car."], "answer": "My sister sold the car.", "why": "*vendió*, with the accent, is she sold.", "speak": "Mi hermana vendió el auto.", "optLang": "en"}, {"t": "choice", "id": "7.c.comieron", "prompt": "Completa: ¿Ustedes ___ anoche? (comer)", "options": ["comieron", "comimos", "comen"], "answer": "comieron", "why": "You all, last night: *comieron*.", "speak": "¿Ustedes comieron anoche?"}, {"t": "choice", "id": "7.c.cerre", "prompt": "Completa: ___ la puerta a las nueve. (cerrar, yo)", "options": ["Cerré", "Cierré", "Cierro"], "answer": "Cerré", "why": "No ie in the past: *cerré*.", "speak": "Cerré la puerta a las nueve."}, {"t": "type", "id": "7.c.wrote", "prompt": "Escribe: We wrote the list.", "answers": ["escribimos la lista", "nosotros escribimos la lista"], "why": "*escribimos* is both 'we write' and 'we wrote'.", "show": "Escribimos la lista."}, {"t": "choice", "id": "7.c.fue", "prompt": "Completa: Mi jefe ___ a Chile el mes pasado. (ir)", "options": ["fue", "fui", "va"], "answer": "fue", "why": "He went: *fue*.", "speak": "Mi jefe fue a Chile el mes pasado."}, {"t": "type", "id": "7.c.how", "prompt": "Responde: ¿Cómo te fue? (it went well)", "answers": ["me fue bien", "me fue muy bien", "bien", "muy bien", "me fue bien, gracias", "me fue muy bien, gracias", "bien, gracias"], "why": "*Me fue bien.*", "show": "Me fue bien."}, {"t": "choice", "id": "7.c.hizo", "prompt": "Completa: ¿Quién ___ la lista? (hacer)", "options": ["hizo", "hició", "hice"], "answer": "hizo", "why": "*hacer* → *hizo* for él or ella.", "speak": "¿Quién hizo la lista?"}, {"t": "type", "id": "7.c.had", "prompt": "Usa tuve que: I had to work on Saturday.", "answers": ["tuve que trabajar el sábado", "el sábado tuve que trabajar", "yo tuve que trabajar el sábado", "el sábado yo tuve que trabajar"], "why": "*tuve que* + *trabajar*.", "show": "Tuve que trabajar el sábado."}, {"t": "choice", "id": "7.c.estuve", "prompt": "Elige: I was in Chile two years ago.", "options": ["Estuve en Chile hace dos años.", "Estoy en Chile hace dos años.", "Estuve en Chile dos años hace."], "answer": "Estuve en Chile hace dos años.", "why": "*estuve*, then *hace* + the time.", "speak": "Estuve en Chile hace dos años."}, {"t": "choice", "id": "7.c.pague", "prompt": "Completa: Ya ___ las láminas. (pagar, yo)", "options": ["pagué", "pagé", "pagó"], "answer": "pagué", "why": "-gar → -gué for yo.", "speak": "Ya pagué las láminas."}, {"t": "build", "id": "7.c.build", "en": "I couldn't come because I had to work.", "tiles": ["no", "pude", "venir", "porque", "tuve", "que", "trabajar"], "extra": ["tengo"], "why": "*pude* and *tuve*, both in the past.", "alts": [["porque", "tuve", "que", "trabajar", "no", "pude", "venir"]]}, {"t": "listen", "id": "7.c.listen", "prompt": "Escucha. Which did you hear?", "es": "Llegamos hace dos horas.", "options": ["Llegamos hace dos horas.", "Llegaron hace dos horas.", "Llegamos a las dos."], "answer": "Llegamos hace dos horas.", "why": "*llegamos* (we arrived), *hace dos horas* (two hours ago)."}, {"t": "type", "id": "7.c.what", "prompt": "Pregunta (to a mate): What did you do on Saturday?", "answers": ["¿qué hiciste el sábado?", "¿el sábado qué hiciste?", "¿qué hiciste tú el sábado?", "¿tú qué hiciste el sábado?", "¿y qué hiciste el sábado?"], "why": "*¿Qué hiciste* + *el sábado?*", "show": "¿Qué hiciste el sábado?"}, {"t": "choice", "id": "7.c.paso", "prompt": "Responde: ¿Qué pasó? (the boss arrived late)", "options": ["El jefe llegó tarde.", "El jefe llega tarde.", "El jefe llegué tarde."], "answer": "El jefe llegó tarde.", "why": "It's finished, so the past. He arrived: *llegó*.", "speak": "El jefe llegó tarde."}]}}, "8": {"id": 8, "lessons": [{"id": "8.1", "title": "Used to: trabajaba", "minutes": 9, "steps": [{"t": "learn", "title": "A second past", "text": ["Level 7's past (*trabajé*) is for finished, one-off things. Spanish has a second past for what *used to* happen, or what *was going on*.", "*Antes trabajaba en un banco.* I used to work in a bank."], "examples": [["antes", "before, back then"], ["siempre", "always"], ["todos los días", "every day"], ["los sábados", "on Saturdays (every week)"]], "mistake": {"wrong": "Antes trabajo en un banco.", "right": "Antes trabajaba en un banco.", "why": "It used to be true, so the second past: *trabajaba*."}}, {"t": "learn", "title": "The -ar endings: -aba", "text": ["Drop the -ar and add -aba. Only 'we' has an accent mark: *trabajábamos*.", "*yo* and *él* look the same: *trabajaba*. Add *yo* or a name if it isn't clear."], "examples": [["yo trabajaba", "I used to work, I was working"], ["tú trabajabas", "you used to work (a mate)"], ["usted trabajaba", "you used to work (respectful)"], ["él trabajaba, ella trabajaba", "he, she used to work"], ["nosotros trabajábamos", "we used to work"], ["ustedes trabajaban", "you all used to work"], ["ellos trabajaban", "they used to work"]], "mistake": {"wrong": "Nosotros trabajabamos juntos.", "right": "Nosotros trabajábamos juntos.", "why": "'We' takes an accent mark: *trabajábamos*."}, "say": ["trabajaba", "trabajabas", "trabajábamos", "trabajaban"]}, {"t": "choice", "id": "8.1.trabajaba", "prompt": "Completa: Antes ___ en Sídney. (trabajar, yo)", "options": ["trabajaba", "trabajábamos", "trabajaban"], "answer": "trabajaba", "why": "I used to: *trabajaba*.", "speak": "Antes trabajaba en Sídney."}, {"t": "choice", "id": "8.1.jugabamos", "prompt": "Completa: De niños, todos los sábados ___ al fútbol. (jugar, nosotros)", "options": ["jugábamos", "jugaban", "juegamos"], "answer": "jugábamos", "why": "We used to: *jugábamos*. *De niños* means 'as kids'.", "speak": "De niños, todos los sábados jugábamos al fútbol."}, {"t": "choice", "id": "8.1.meaning", "prompt": "What does this mean?", "es": "Yo siempre llamaba a mi madre.", "options": ["I always used to call my mother.", "I always call my mother.", "I called my mother once."], "answer": "I always used to call my mother.", "why": "*llamaba*: something you used to do again and again.", "speak": "Yo siempre llamaba a mi madre.", "optLang": "en"}, {"t": "choice", "id": "8.1.together", "prompt": "Elige: We used to work together.", "options": ["Trabajábamos juntos.", "Trabajamos juntos.", "Trabajaban juntos."], "answer": "Trabajábamos juntos.", "why": "'We used to': *trabajábamos*. *Trabajamos* is 'we work' or 'we worked'.", "speak": "Trabajábamos juntos."}, {"t": "listen", "id": "8.1.listen", "prompt": "Escucha. Which did you hear?", "es": "Antes cortaba las láminas a mano.", "options": ["Antes cortaba las láminas a mano.", "Antes corté las láminas a mano.", "Antes cortaban las láminas a mano."], "answer": "Antes cortaba las láminas a mano.", "why": "*cortaba*: I used to cut. *a mano* means by hand."}, {"t": "build", "id": "8.1.build", "en": "Back then, I used to buy the nails here.", "tiles": ["antes", "compraba", "los", "clavos", "aquí"], "extra": ["compré"], "why": "A habit back then: *compraba*.", "alts": [["antes", "compraba", "aquí", "los", "clavos"], ["aquí", "antes", "compraba", "los", "clavos"], ["compraba", "los", "clavos", "aquí", "antes"]]}, {"t": "type", "id": "8.1.bank", "prompt": "Usa antes: I used to work in a bank.", "answers": ["antes trabajaba en un banco", "yo antes trabajaba en un banco", "antes yo trabajaba en un banco", "trabajaba en un banco antes", "yo trabajaba en un banco antes", "trabajaba antes en un banco"], "why": "*antes* + *trabajaba*.", "show": "Antes trabajaba en un banco."}, {"t": "type", "id": "8.1.called", "prompt": "Escribe: We used to call the boss every day.", "answers": ["llamábamos al jefe todos los días", "nosotros llamábamos al jefe todos los días", "todos los días llamábamos al jefe", "todos los días nosotros llamábamos al jefe", "antes llamábamos al jefe todos los días", "llamábamos todos los días al jefe", "llamábamos al jefe cada día", "antes nosotros llamábamos al jefe todos los días"], "why": "'We used to': *llamábamos*. And *a* + *el* = *al*.", "show": "Llamábamos al jefe todos los días."}, {"t": "say", "id": "8.1.say", "es": "Antes trabajaba en un banco. Ahora trabajo en los techos.", "en": "I used to work in a bank. Now I work on roofs.", "tip": "trabajaba has the push on the third beat: tra-ba-HAH-bah."}]}, {"id": "8.2", "title": "-er and -ir: comía, vivía", "minutes": 8, "steps": [{"t": "learn", "title": "-ía for -er and -ir", "text": ["-er and -ir verbs share one set: drop the ending and add -ía. Every form has the accent mark on the í."], "examples": [["yo comía", "I used to eat, I was eating"], ["tú comías", "you used to eat (a mate)"], ["usted comía", "you used to eat (respectful)"], ["él comía, ella comía", "he, she used to eat"], ["nosotros comíamos", "we used to eat"], ["ustedes comían", "you all used to eat"], ["ellos comían", "they used to eat"]], "mistake": {"wrong": "Antes como en el camión.", "right": "Antes comía en el camión.", "why": "Back then is the past: *comía*."}, "say": ["comía", "comías", "comíamos", "comían"]}, {"t": "learn", "title": "No shape-shifting here", "text": ["Good news: in this past nothing changes its middle and nothing ends in -go.", "*quiero* → *quería*. *puedo* → *podía*. *tengo* → *tenía*. *hago* → *hacía*.", "And *hay* (there is, there are) becomes *había* (there was, there were)."], "examples": [["Tenía mucho trabajo.", "I had a lot of work."], ["No podía dormir.", "I couldn't sleep."], ["Había mucha gente.", "There were a lot of people."]], "mistake": {"wrong": "Antes tuvía un camión.", "right": "Antes tenía un camión.", "why": "Just -ía on the stem: *tenía*."}}, {"t": "choice", "id": "8.2.comia", "prompt": "Completa: Antes ___ pan todos los días. (comer, yo)", "options": ["comía", "comió", "comíamos"], "answer": "comía", "why": "I used to: *comía*. *comió* is he or she ate.", "speak": "Antes comía pan todos los días."}, {"t": "choice", "id": "8.2.teniamos", "prompt": "Completa: Antes nosotros ___ un camión viejo. (tener)", "options": ["teníamos", "tuvíamos", "tenían"], "answer": "teníamos", "why": "No shape-shifting: *tener* → *teníamos*.", "speak": "Antes nosotros teníamos un camión viejo."}, {"t": "choice", "id": "8.2.habia", "prompt": "What does this mean?", "es": "Había mucha gente en la playa.", "options": ["There were a lot of people at the beach.", "There are a lot of people at the beach.", "A lot of people went to the beach."], "answer": "There were a lot of people at the beach.", "why": "*había* is there was, there were.", "speak": "Había mucha gente en la playa.", "optLang": "en"}, {"t": "choice", "id": "8.2.queria", "prompt": "Elige: I wanted a coffee.", "options": ["Quería un café.", "Quiería un café.", "Queríamos un café."], "answer": "Quería un café.", "why": "No ie in this past: *quería*.", "speak": "Quería un café."}, {"t": "listen", "id": "8.2.listen", "prompt": "Escucha. Which did you hear?", "es": "No podía dormir.", "options": ["No podía dormir.", "No puedo dormir.", "No pudo dormir."], "answer": "No podía dormir.", "why": "*podía*: I couldn't (and it went on)."}, {"t": "build", "id": "8.2.build", "en": "There were a lot of screws in the truck.", "tiles": ["había", "muchos", "tornillos", "en", "el", "camión"], "extra": ["hay"], "why": "There were: *había*.", "alts": [["en", "el", "camión", "había", "muchos", "tornillos"]]}, {"t": "type", "id": "8.2.work", "prompt": "Usa tenía: I had a lot of work.", "answers": ["tenía mucho trabajo", "yo tenía mucho trabajo", "tenía harto trabajo", "yo tenía harto trabajo", "antes tenía mucho trabajo"], "why": "*tener* → *tenía*.", "show": "Tenía mucho trabajo."}, {"t": "type", "id": "8.2.lived", "prompt": "Usa antes: I used to live in Sydney.", "answers": ["antes vivía en sídney", "antes vivía en sydney", "yo antes vivía en sídney", "yo antes vivía en sydney", "antes yo vivía en sídney", "antes yo vivía en sydney", "vivía en sídney antes", "vivía en sydney antes", "vivía antes en sídney", "vivía antes en sydney", "yo vivía en sídney antes", "yo vivía en sydney antes"], "why": "*vivir* → *vivía*.", "show": "Antes vivía en Sídney."}, {"t": "say", "id": "8.2.say", "es": "Antes vivía en Sídney y comía en la playa todos los domingos.", "en": "I used to live in Sydney and eat at the beach every Sunday.", "tip": "Every -ía has the push on the í: vi-VEE-ah, co-MEE-ah."}]}, {"id": "8.3", "title": "Era, iba, veía", "minutes": 8, "steps": [{"t": "learn", "title": "Only three odd ones", "text": ["This past has just three irregular verbs. Learn these and you're done.", "*ser* → *era*. *ir* → *iba*. *ver* (to see) → *veía*."], "examples": [["yo era", "I was (what I was like)"], ["nosotros éramos", "we were"], ["yo iba", "I used to go, I was going"], ["nosotros íbamos", "we used to go"], ["yo veía", "I used to see"]], "mistake": {"wrong": "Cuando fui joven, jugaba al fútbol.", "right": "Cuando era joven, jugaba al fútbol.", "why": "Describing what you were like back then: *era*. (*Fui* is for a finished event, not a description.)"}, "say": ["era", "éramos", "iba", "íbamos", "veía"]}, {"t": "learn", "title": "Cuando era joven", "text": ["*Cuando era joven* (when I was young) and *cuando era niño* or *niña* (when I was a kid) start a lot of stories.", "The rest of the story about back then stays in the same past."], "examples": [["Cuando era joven, vivía en el campo.", "When I was young, I lived in the country."], ["Íbamos a la playa todos los veranos.", "We used to go to the beach every summer."], ["Era un hombre muy simpático.", "He was a really nice man."]], "mistake": {"wrong": "Antes voy a la playa los domingos.", "right": "Antes iba a la playa los domingos.", "why": "*ir* in this past is *iba*."}, "chile": "In Chile a baby is *una guagua*: *Cuando era guagua, vivía en Santiago.* When I was a baby, I lived in Santiago."}, {"t": "choice", "id": "8.3.era", "prompt": "Completa: Cuando ___ joven, vivía en el campo. (ser, yo)", "options": ["era", "fui", "soy"], "answer": "era", "why": "What you were like back then: *era*.", "speak": "Cuando era joven, vivía en el campo."}, {"t": "choice", "id": "8.3.iba", "prompt": "Completa: Antes, todos los domingos ___ a la playa. (ir, yo)", "options": ["iba", "iban", "voy"], "answer": "iba", "why": "I used to go: *iba*.", "speak": "Antes, todos los domingos iba a la playa."}, {"t": "choice", "id": "8.3.ibamos", "prompt": "Elige: We used to go to Chile every summer.", "options": ["Íbamos a Chile todos los veranos.", "Vamos a Chile todos los veranos.", "Iban a Chile todos los veranos."], "answer": "Íbamos a Chile todos los veranos.", "why": "We used to go: *íbamos*, with the accent on the first í.", "speak": "Íbamos a Chile todos los veranos."}, {"t": "choice", "id": "8.3.veia", "prompt": "What does this mean?", "es": "Yo veía a mi abuela los domingos.", "options": ["I used to see my grandmother on Sundays.", "I saw my grandmother on Sunday.", "I see my grandmother on Sundays."], "answer": "I used to see my grandmother on Sundays.", "why": "*veía*: used to see. *los domingos* means every Sunday.", "speak": "Yo veía a mi abuela los domingos.", "optLang": "en"}, {"t": "listen", "id": "8.3.listen", "prompt": "Escucha. Which did you hear?", "es": "Éramos cinco en el equipo.", "options": ["Éramos cinco en el equipo.", "Somos cinco en el equipo.", "Eran cinco en el equipo."], "answer": "Éramos cinco en el equipo.", "why": "*éramos*: we were. *el equipo* is the team."}, {"t": "build", "id": "8.3.build", "en": "When I was young, I used to go to the beach.", "tiles": ["cuando", "era", "joven,", "iba", "a", "la", "playa."], "extra": ["fui"], "why": "*era* sets the time, *iba* is the habit."}, {"t": "type", "id": "8.3.young", "prompt": "Escribe: When I was young, I lived in Chile.", "answers": ["cuando era joven, vivía en chile", "cuando yo era joven, vivía en chile", "cuando era joven, yo vivía en chile", "vivía en chile cuando era joven", "yo vivía en chile cuando era joven"], "why": "*era joven*, and *vivía* for what life was like back then.", "show": "Cuando era joven, vivía en Chile."}, {"t": "type", "id": "8.3.boss", "prompt": "Usa era: My boss was really nice. (nice = *simpático*)", "answers": ["mi jefe era muy simpático", "mi jefa era muy simpática", "mi jefe era muy amable", "mi jefa era muy amable", "mi jefe era bien simpático", "mi jefa era bien simpática", "mi jefe era simpático", "mi jefa era simpática"], "why": "What someone was like: *era*.", "show": "Mi jefe era muy simpático."}, {"t": "say", "id": "8.3.say", "es": "Cuando era joven, iba a la playa todos los veranos.", "en": "When I was young, I used to go to the beach every summer.", "tip": "era is EH-rah, with a quick tapped r."}]}, {"id": "8.4", "title": "Was doing, when…", "minutes": 9, "steps": [{"t": "learn", "title": "The scene and the event", "text": ["When you tell a story, Spanish uses both pasts together.", "The second past (*-aba*, *-ía*) sets the scene: what was going on. The first past (*-é*, *-ó*) is what happened.", "*Trabajaba en el techo cuando empezó a llover.* I was working on the roof when it started to rain."], "examples": [["Trabajaba en el techo…", "I was working on the roof…"], ["…cuando empezó a llover.", "…when it started to rain."], ["Comíamos cuando llamó el jefe.", "We were eating when the boss called."]], "mistake": {"wrong": "Trabajé en el techo cuando empezó a llover.", "right": "Trabajaba en el techo cuando empezó a llover.", "why": "For 'was working', use *trabajaba*. *Trabajé* would mean you started work once the rain began."}}, {"t": "learn", "title": "Weather, time and feelings", "text": ["The weather, the time and how people felt are nearly always the second past. They set the scene."], "examples": [["Hacía calor.", "It was hot."], ["Llovía.", "It was raining."], ["Eran las seis.", "It was six o'clock."], ["Estaba cansado.", "I was tired. (cansada for a woman)"]], "mistake": {"wrong": "Cuando llegué, llovió mucho.", "right": "Cuando llegué, llovía mucho.", "why": "The rain was already falling when you arrived: *llovía*. (*Llovió* would mean it started after you got there.)"}}, {"t": "choice", "id": "8.4.scene", "prompt": "Completa: ___ en el techo cuando empezó a llover. (I was working)", "options": ["Trabajaba", "Trabajé", "Trabajo"], "answer": "Trabajaba", "why": "Was working, the scene: *trabajaba*.", "speak": "Trabajaba en el techo cuando empezó a llover."}, {"t": "choice", "id": "8.4.event", "prompt": "Completa: Comíamos cuando ___ el jefe. (llamar, once)", "options": ["llamó", "llamaba", "llama"], "answer": "llamó", "why": "The call happened once, in the middle of the meal: *llamó*.", "speak": "Comíamos cuando llamó el jefe."}, {"t": "choice", "id": "8.4.weather", "prompt": "Elige: It was hot and I was tired.", "options": ["Hacía calor y estaba cansado.", "Hace calor y estoy cansado.", "Hacía calor y estuvo cansado."], "answer": "Hacía calor y estaba cansado.", "why": "Weather and feelings set the scene: *hacía*, *estaba*. (*estuvo* is he or she was, and a finished state.)", "speak": "Hacía calor y estaba cansado."}, {"t": "choice", "id": "8.4.time", "prompt": "What does this mean?", "es": "Eran las seis cuando llegamos.", "options": ["It was six o'clock when we arrived.", "We arrive at six o'clock.", "We arrived six hours ago. os jóvenes y no tenemos dinero.", "Eran jóvenes y no tenían dinero."], "answer": "Éramos jóvenes y no teníamos dinero.", "why": "*éramos* and *teníamos*: we were, we had."}, {"t": "choice", "id": "8.c.suddenly", "prompt": "Elige: Suddenly, the client arrived.", "options": ["De repente, llegó el cliente.", "De repente, llegaba el cliente.", "De repente, llega el cliente."], "answer": "De repente, llegó el cliente.", "why": "*de repente*, one moment: *llegó*.", "speak": "De repente, llegó el cliente."}, {"t": "choice", "id": "8.c.chile", "prompt": "In Chile, una guagua is…", "options": ["a baby", "a bus", "a dog"], "answer": "a baby", "why": "In Chile *una guagua* is a baby. (In Cuba and the Caribbean it's a bus!)", "speak": "Cuando era guagua, vivía en Santiago.", "optLang": "en"}]}}};
