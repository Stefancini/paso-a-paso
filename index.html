<meta name="apple-mobile-web-app-capable" content="yes">

<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>

<body>
<style>
/* Layout: one column like a site diary. Levels stack like roof courses; hi-vis yellow marks the one thing to press next. */
:root {
  --bg: #E4E8EA;
  --panel: #F6F7F8;
  --ink: #1C2226;
  --muted: #56636A;
  --line: #C3CBD0;
  --rib: #D3D9DD;
  --edge: #6B777E;
  --hivis: #F2B705;
  --hivis-ink: #1C2226;
  --ok: #2B7448;
  --ok-soft: #DCEFE3;
  --bad: #A93D2C;
  --bad-soft: #F6E1DC;
  --chile: #1F4E8C;
  --chile-soft: #E1E9F5;
  --display: "Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
  --body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #171C1F; --panel: #222A2E; --ink: #E8ECEE; --muted: #9AA6AC; --line: #36414A; --rib: #2D363C; --edge: #6F7C84;
    --hivis: #F5C02A; --hivis-ink: #171C1F; --ok: #63BE88; --ok-soft: #1E3628; --bad: #E2775F; --bad-soft: #3D231D;
    --chile: #8DB4EE; --chile-soft: #1D2A3D;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #171C1F; --panel: #222A2E; --ink: #E8ECEE; --muted: #9AA6AC; --line: #36414A; --rib: #2D363C; --edge: #6F7C84;
  --hivis: #F5C02A; --hivis-ink: #171C1F; --ok: #63BE88; --ok-soft: #1E3628; --bad: #E2775F; --bad-soft: #3D231D;
  --chile: #8DB4EE; --chile-soft: #1D2A3D;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 18px; line-height: 1.5;
  padding-inline: 16px; padding-block: 16px 48px;
}
.wrap { max-width: 760px; margin: 0 auto; display: grid; gap: 18px; }
p { margin: 0; }
.es { font-weight: 700; }

/* Top bar */
.top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; }
.brand { font-family: var(--display); font-weight: 800; font-size: 2.2rem; line-height: .9; text-transform: uppercase; margin: 0; letter-spacing: .01em; }
.brand button { all: unset; cursor: pointer; display: inline-flex; align-items: center; min-height: 44px; }
.meta { display: flex; gap: 14px; align-items: center; font: 500 .8rem var(--mono); color: var(--muted); }
.iconbtn { font: 700 .9rem var(--body); color: var(--ink); background: transparent; border: 1.5px solid var(--edge); border-radius: 8px; padding: 8px 14px; min-height: 44px; cursor: pointer; }

/* Generic */
.card { background: var(--panel); border: 1.5px solid var(--line); border-radius: 14px; padding: 20px; display: grid; gap: 14px; min-width: 0; }
.kicker { font: 700 .75rem var(--body); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
h2 { font-family: var(--display); font-weight: 800; font-size: clamp(1.9rem, 7vw, 2.6rem); line-height: .95; margin: 0; text-transform: uppercase; text-wrap: balance; }
h3 { font-size: 1.25rem; margin: 0; line-height: 1.25; text-wrap: balance; }
.muted { color: var(--muted); }
.btn {
  font: 700 1.05rem var(--body); border-radius: 10px; padding: 13px 20px; min-height: 50px; cursor: pointer;
  border: 1.5px solid var(--ink); background: transparent; color: var(--ink);
}
.btn.primary { background: var(--hivis); border-color: var(--hivis); color: var(--hivis-ink); }
.btn.small { font-size: .9rem; padding: 8px 14px; min-height: 44px; }
.btn:disabled { opacity: .45; cursor: default; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }

/* Home: today */
.today { display: grid; gap: 12px; }
.today .next { display: grid; gap: 4px; }
.stats { display: flex; flex-wrap: wrap; gap: 8px 18px; font: 500 .85rem var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }

/* Level path: each level is a roof course */
.path { display: grid; gap: 10px; }
.level { background: var(--panel); border: 1.5px solid var(--line); border-radius: 12px; overflow: hidden; }
.level-head { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; padding: 14px 16px; width: 100%; background: none; border: 0; color: inherit; font: inherit; text-align: left; cursor: pointer; }
.level-head:disabled { cursor: default; }
.lvnum { font-family: var(--display); font-weight: 800; font-size: 2rem; line-height: 1; width: 2.2ch; text-align: center; }
.lvtext { min-width: 0; display: grid; gap: 2px; }
.lvtitle { font-weight: 700; }
.lvidea { color: var(--muted); font-size: .9rem; }
.pill { font: 700 .72rem var(--body); letter-spacing: .08em; text-transform: uppercase; padding: 4px 9px; border-radius: 999px; border: 1.5px solid var(--line); color: var(--muted); white-space: nowrap; }
.pill.done { border-color: var(--ok); color: var(--ok); }
.pill.open { border-color: var(--ink); color: var(--ink); }
.level.locked { opacity: .6; }
.level.current { border-color: var(--ink); }
.level.current::before { content: ""; display: block; height: 8px; background: repeating-linear-gradient(90deg, var(--hivis) 0 10px, color-mix(in srgb, var(--hivis) 70%, var(--ink)) 10px 14px); }
.lessons { display: grid; border-top: 1.5px solid var(--line); }
.lesson-row { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; padding: 12px 16px; background: none; border: 0; border-top: 1px solid var(--line); color: inherit; font: inherit; text-align: left; cursor: pointer; min-height: 56px; }
.lesson-row:first-child { border-top: 0; }
.tick { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; font-size: .8rem; font-weight: 700; }
.tick.done { background: var(--ok); border-color: var(--ok); color: var(--panel); }
.lesson-row .mins { font: 500 .8rem var(--mono); color: var(--muted); white-space: nowrap; }

/* Runner */
.bar { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; }
.progress { height: 12px; border-radius: 3px; background: repeating-linear-gradient(90deg, var(--rib) 0 5px, var(--line) 5px 7px); overflow: hidden; }
.progress > span { display: block; height: 100%; background: repeating-linear-gradient(90deg, var(--hivis) 0 5px, color-mix(in srgb, var(--hivis) 70%, var(--ink)) 5px 7px); transition: width .25s ease; }
.count { font: 500 .85rem var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.prompt { font-size: 1.15rem; }
.big-es, .big-en { font-weight: 700; font-size: clamp(1.5rem, 6vw, 2rem); line-height: 1.3; text-wrap: balance; }
.en { color: var(--muted); font-style: italic; }
.learn-text { display: grid; gap: 10px; }
.examples { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none; }
.examples li { display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: center; }
.ex-es { font-weight: 700; }
.ex-en { color: var(--muted); font-size: .95rem; }
.speak { width: 46px; height: 46px; border-radius: 50%; border: 1.5px solid var(--edge); background: var(--bg); color: var(--ink); cursor: pointer; display: grid; place-items: center; flex: none; }
.speak svg { width: 18px; height: 18px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { font: 700 1rem var(--body); padding: 8px 14px; min-height: 44px; border-radius: 8px; border: 1.5px solid var(--edge); background: var(--bg); color: var(--ink); cursor: pointer; }
.mistake { display: grid; gap: 4px; border-left: 4px solid var(--bad); padding: 4px 0 4px 12px; }
.mistake .w { color: var(--bad); text-decoration: line-through; font-weight: 700; }
.mistake .r { color: var(--ok); font-weight: 700; }
.chile { display: grid; gap: 4px; background: var(--chile-soft); border-radius: 10px; padding: 12px 14px; }
.chile .kicker { color: var(--chile); }

.tile {
  position: relative; font: 700 1.1rem var(--body); color: var(--ink); background: var(--bg);
  border: 1.5px solid var(--edge); border-radius: 10px; padding: 18px 14px 12px; cursor: pointer; text-align: center;
  min-height: 58px; min-width: 0; overflow-wrap: anywhere;
}
.tile::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 7px; border-radius: 9px 9px 0 0; background: repeating-linear-gradient(90deg, var(--rib) 0 6px, var(--line) 6px 9px); }
@media (hover: hover) { .tile:hover:not(:disabled) { border-color: var(--ink); } }
.tile:disabled { cursor: default; }
.tile.ok { border-color: var(--ok); background: var(--ok-soft); }
.tile.bad { border-color: var(--bad); background: var(--bad-soft); }
.choices { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; }
.tray, .pool { display: flex; flex-wrap: wrap; gap: 8px; min-height: 62px; align-items: flex-start; }
.tray { border: 2px dashed var(--line); border-radius: 10px; padding: 8px; }
.tray .tile, .pool .tile { padding: 14px 12px 8px; font-size: 1.05rem; min-height: 50px; min-width: 48px; }
button { touch-action: manipulation; }
.answer-row { display: flex; gap: 10px; align-items: stretch; }
.answer-row .answer { flex: 1; min-width: 0; }
.confirm { display: grid; gap: 10px; color: var(--ink); }
body.sheet-open { padding-bottom: 60vh; }
.field { display: grid; gap: 6px; }
.field input { font: 400 1rem var(--body); padding: 10px; min-height: 44px; border-radius: 8px; border: 1.5px solid var(--edge); background: var(--bg); color: var(--ink); max-width: 100%; }
.label { font: 700 .75rem var(--body); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }

.answer { width: 100%; font: 700 1.25rem var(--body); padding: 14px; border-radius: 10px; border: 2px solid var(--edge); background: var(--bg); color: var(--ink); }
.answer:focus { border-color: var(--ink); }
.keys { display: flex; flex-wrap: wrap; gap: 6px; }
.keys button { font: 700 1.05rem var(--body); min-width: 44px; min-height: 44px; border-radius: 8px; border: 1.5px solid var(--edge); background: var(--bg); color: var(--ink); cursor: pointer; }

.play { display: grid; place-items: center; gap: 8px; }
.play .speak { width: 84px; height: 84px; border-color: var(--ink); }
.play .speak svg { width: 34px; height: 34px; }

.feedback { border-radius: 12px; padding: 14px 16px; display: grid; gap: 6px; }
.feedback.ok { background: var(--ok-soft); }
.feedback.bad { background: var(--bad-soft); }
.feedback.wait { background: var(--bg); border: 1.5px dashed var(--line); }
.verdict { font-family: var(--display); font-weight: 800; font-size: 1.6rem; line-height: 1; text-transform: uppercase; }
.feedback.ok .verdict { color: var(--ok); }
.feedback.bad .verdict { color: var(--bad); }
.linkbtn { all: unset; cursor: pointer; text-decoration: underline; color: var(--muted); font-size: .95rem; display: inline-flex; align-items: center; min-height: 44px; padding: 0 4px; }
.speak[hidden] { display: none; }
.notice { font-size: .9rem; color: var(--muted); border: 1.5px dashed var(--edge); border-radius: 8px; padding: 8px 12px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.selfmark { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.selfmark .btn { padding-inline: 8px; }

.result-score { font-family: var(--display); font-weight: 800; font-size: clamp(3rem, 14vw, 4.5rem); line-height: .9; }
ul.plain { margin: 0; padding-left: 1.2em; display: grid; gap: 4px; }

.sheet { position: fixed; inset: auto 0 0 0; background: var(--panel); border-top: 1.5px solid var(--line); padding: 18px 16px calc(18px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 12px; max-height: 80vh; overflow: auto; box-shadow: 0 -8px 30px rgb(0 0 0 / .18); }
.sheet .inner { max-width: 760px; margin: 0 auto; width: 100%; display: grid; gap: 12px; }
select { font: 400 1rem var(--body); padding: 10px; min-height: 44px; border-radius: 8px; border: 1.5px solid var(--edge); background: var(--bg); color: var(--ink); max-width: 100%; }

button:focus-visible, summary:focus-visible, select:focus-visible, input:focus-visible, #runner:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; box-shadow: 0 0 0 7px var(--hivis); }
@media (prefers-reduced-motion: reduce) { .progress > span { transition: none; } }
@media (max-width: 420px) { .card { padding: 16px; } body { font-size: 17px; } .selfmark { grid-template-columns: 1fr; } }
</style>

<div class="wrap" id="app"></div>

<script>
(function () {
  "use strict";
  const COURSE = {"levels": [{"id": 1, "title": "First words", "idea": "Sounds, greetings, el/la, numbers 0 to 20, soy and me llamo"}, {"id": 2, "title": "Is it ser or estar?", "idea": "Two verbs for 'to be', and describing things: la lámina es larga"}, {"id": 3, "title": "Doing things", "idea": "Present tense of regular verbs (hablo, comes, vivimos) and asking questions"}, {"id": 4, "title": "Plans and jobs", "idea": "tengo que / voy a / quiero / necesito + a verb"}, {"id": 5, "title": "Why and what you like", "idea": "por vs porque, gustar, and little words like a, de, en, con"}, {"id": 6, "title": "Shape-shifting verbs", "idea": "Verbs that change their middle (quiero, puedo) and me / te / se verbs"}, {"id": 7, "title": "Yesterday", "idea": "Talking about the past: trabajé, fui"}, {"id": 8, "title": "Two pasts", "idea": "'was doing' vs 'did': trabajaba vs trabajé"}, {"id": 9, "title": "Orders and plans", "idea": "Commands and future plans"}, {"id": 10, "title": "Wishes and real speed", "idea": "Wishes and feelings (quiero que...) and Chilean speech at full speed"}]};
  const LEVELS = {"1": {"id": 1, "lessons": [{"id": "1.1", "title": "How Spanish sounds", "minutes": 7, "steps": [{"t": "learn", "title": "Five vowels, five sounds", "text": ["English vowels change sound all the time. Spanish vowels never do. Learn these five and you can read most Spanish words out loud."], "examples": [["a", "ah, as in 'father'"], ["e", "eh, as in 'bed'"], ["i", "ee, as in 'see'"], ["o", "oh, short and clean, with no 'ow' glide at the end"], ["u", "oo, as in 'food'"]], "say": ["casa", "mesa", "libro", "uno"]}, {"t": "learn", "title": "Letters that trick English speakers", "text": ["*h* is always silent: *hola* is OH-lah.", "*j* is a soft, breathy h: *jefe* (boss) is HEH-feh.", "*ll* and *y* both sound like the English y: *llave* (key) is YAH-beh.", "*ñ* is 'ny', like canyon: *mañana* is mah-NYAH-nah.", "*c* before e or i, and every *z*, sound like s in Latin America: *cinco* is SEEN-koh, *zapato* is sah-PAH-toh."], "mistake": {"wrong": "THEEN-koh", "right": "SEEN-koh", "why": "The 'th' sound is only used in central and northern Spain. Latin Americans say s."}, "chile": "Chileans often swallow an s at the end of a syllable. *¿Cómo estás?* can sound like 'cómo ehtá', and *los amigos* like 'loh amigoh'. The s is still there in writing."}, {"t": "learn", "title": "Four more sounds", "text": ["*ch* is the English ch: *mucho*, *techo*, *chao*.", "*qu* is just k, the u is silent: *quince* is KEEN-seh, *¿qué tal?* is keh TAHL.", "*v* sounds like b: *llave* is YAH-beh, *vivo* is BEE-boh.", "One *r* is a quick tap, like the fast d sound in an Aussie 'butter': *tres*, *cuatro*, *por favor*. Double *rr* is rolled: *perro* (dog).", "The word *y* (and) on its own sounds like 'ee': *el techo y la puerta*."]}, {"t": "learn", "title": "Where to push", "text": ["Every word has one strong syllable. Three simple rules tell you which one.", "Ends in a vowel, n or s: push the second-to-last. CA-sa, TE-cho, GRA-cias.", "Ends in any other letter: push the last. pa-PEL, re-LOJ.", "An accent mark breaks the rules: push where the mark is. ca-FÉ, te-LÉ-fo-no."]}, {"t": "choice", "id": "1.1.h", "prompt": "How do you say the h in this word?", "es": "hola", "options": ["Silent: OH-lah", "Like English h: HOH-lah", "Like a j: JOH-lah"], "answer": "Silent: OH-lah", "why": "The h is always silent in Spanish.", "speak": "hola", "optLang": "en"}, {"t": "choice", "id": "1.1.ll", "prompt": "How does llave (key) sound?", "es": "llave", "options": ["YAH-beh", "LAH-beh", "JAH-beh"], "answer": "YAH-beh", "why": "ll sounds like the English y, and v sounds like b.", "speak": "llave", "optLang": "en"}, {"t": "choice", "id": "1.1.c", "prompt": "In Latin America, cinco (five) sounds like…", "es": "cinco", "options": ["SEEN-koh", "THEEN-koh", "KEEN-koh"], "answer": "SEEN-koh", "why": "c before e or i sounds like s. The 'th' version is Spain only.", "speak": "cinco", "optLang": "en"}, {"t": "choice", "id": "1.1.j", "prompt": "How does jefe (boss) sound?", "es": "jefe", "options": ["HEH-feh", "JEH-feh, like 'jet'", "YEH-feh"], "answer": "HEH-feh", "why": "j is a breathy h, never the English j.", "speak": "jefe", "optLang": "en"}, {"t": "choice", "id": "1.1.stress", "prompt": "Where's the push in teléfono?", "es": "teléfono", "options": ["te-LÉ-fo-no", "TE-le-fo-no", "te-le-FO-no"], "answer": "te-LÉ-fo-no", "why": "The accent mark shows exactly where to push.", "speak": "teléfono", "optLang": "en"}, {"t": "listen", "id": "1.1.listen", "prompt": "Listen. Which word did you hear?", "es": "mañana", "options": ["mañana", "manzana", "mano"], "answer": "mañana", "why": "mañana (tomorrow) has the ny sound of ñ. manzana is an apple."}, {"t": "say", "id": "1.1.say1", "es": "Hola. Mañana. La llave.", "en": "Hello. Tomorrow. The key.", "tip": "Silent h, 'ny' for ñ, 'y' for ll."}, {"t": "say", "id": "1.1.say2", "es": "Cinco zapatos.", "en": "Five shoes.", "tip": "Both the c and the z sound like s."}, {"t": "choice", "id": "1.1.chile", "prompt": "A Chilean mate says 'loh amigoh'. What did they say?", "options": ["los amigos", "lo amigo", "las amigas"], "answer": "los amigos", "why": "Chileans soften the s at the end of a syllable. It's still there in writing.", "speak": "los amigos"}]}, {"id": "1.2", "title": "Hello and goodbye", "minutes": 7, "steps": [{"t": "learn", "title": "Saying hello", "text": ["*Hola* works any time, with anyone.", "*Buenos días*: good morning, until about lunchtime.", "*Buenas tardes*: good afternoon, from lunch until dark.", "*Buenas noches*: good evening. It's also how you say goodnight."], "mistake": {"wrong": "Buenos tardes", "right": "Buenas tardes", "why": "It's *la tarde* and *la noche*, so buen*as*. Only *el día* takes buen*os*."}}, {"t": "learn", "title": "How are you?", "text": ["*¿Cómo estás?* How are you?", "Answers: *Bien, gracias.* (Good, thanks.) *Muy bien.* (Very good.) *Más o menos.* (So-so.) *Mal.* (Not good.)", "Then bounce it back: *¿Y tú?* (And you?)"], "examples": [["¿Cómo estás?", "How are you?"], ["Bien, gracias, ¿y tú?", "Good, thanks, and you?"]], "chile": "In Chile you'll hear *¿Cómo estai?* It means exactly the same as *¿Cómo estás?* Push the last bit: es-TAI. *¿Qué tal?* (How's it going?) works everywhere, Chile included."}, {"t": "learn", "title": "Meeting someone and leaving", "text": ["*Mucho gusto.* Nice to meet you. The reply is *Igualmente.* (Likewise.) You'll also hear *Encantado* (delighted).", "Leaving: *Chao.* (Bye, very common in Chile and much of South America.) *Adiós.* (Goodbye, a bit more final.) *Hasta luego.* (See you later.) *Nos vemos.* (See you.) *Hasta mañana.* (See you tomorrow.)"]}, {"t": "choice", "id": "1.2.morning", "prompt": "It's 7 am and you arrive on site. You say…", "options": ["Buenos días", "Buenas tardes", "Buenas noches"], "answer": "Buenos días", "why": "Buenos días is for the morning, until about lunchtime.", "speak": "Buenos días"}, {"t": "choice", "id": "1.2.afternoon", "prompt": "It's 3 pm and a customer walks in. You say…", "options": ["Buenas tardes", "Buenos días", "Buenas noches"], "answer": "Buenas tardes", "why": "Buenas tardes covers lunch until dark.", "speak": "Buenas tardes"}, {"t": "choice", "id": "1.2.fix", "prompt": "Fix this greeting.", "es": "Buenos tardes", "options": ["Buenas tardes", "Buena tarde", "Buenos tarde"], "answer": "Buenas tardes", "why": "It's la tarde, so buenas. Only el día takes buenos.", "speak": "Buenas tardes"}, {"t": "build", "id": "1.2.build", "en": "Good, thanks, and you?", "tiles": ["bien,", "gracias,", "¿y tú?"], "extra": ["buenos días"], "why": "Answer, say thanks, then bounce the question back."}, {"t": "type", "id": "1.2.type1", "prompt": "Someone asks: ¿Cómo estás? Say you're good, thanks.", "answers": ["bien, gracias", "muy bien, gracias", "bien, gracias, ¿y tú?", "muy bien, gracias, ¿y tú?", "estoy bien, gracias", "estoy muy bien, gracias", "bien gracias y usted", "muy bien gracias y usted", "estoy bien, gracias, ¿y tú?", "estoy muy bien, gracias, ¿y tú?", "gracias, bien", "bien, muchas gracias", "muy bien, muchas gracias", "bien, gracias, ¿y usted?", "estoy bien, gracias, ¿y usted?"], "why": "Bien, gracias. Add ¿y tú? to be friendly.", "show": "Bien, gracias."}, {"t": "choice", "id": "1.2.gusto", "prompt": "Someone says Mucho gusto. You reply…", "options": ["Igualmente", "De nada", "Hasta luego"], "answer": "Igualmente", "why": "Igualmente means likewise. De nada is 'you're welcome'.", "speak": "Mucho gusto. Igualmente."}, {"t": "choice", "id": "1.2.chile", "prompt": "A Chilean asks ¿Cómo estai? What do they mean?", "options": ["How are you?", "Where are you?", "Who are you?"], "answer": "How are you?", "why": "Chileans change estás to estai with friends. Same meaning.", "speak": "¿Cómo estai?", "optLang": "en"}, {"t": "type", "id": "1.2.type2", "prompt": "Knocking off for the day. Say 'See you tomorrow'.", "answers": ["hasta mañana", "chao, hasta mañana", "nos vemos mañana", "chao, nos vemos mañana", "hasta mañana, chao", "nos vemos, hasta mañana", "adiós, hasta mañana", "hasta mañana, nos vemos"], "why": "Hasta mañana. Nos vemos mañana works too.", "show": "Hasta mañana."}, {"t": "say", "id": "1.2.say", "es": "Buenos días, ¿cómo estás?", "en": "Good morning, how are you?", "tip": "Buenos with an o. Say it BWEH-nohs DEE-ahs."}]}, {"id": "1.3", "title": "Two ways to say 'you'", "minutes": 6, "steps": [{"t": "learn", "title": "Tú or usted", "text": ["Spanish has a friendly 'you' and a respectful 'you'.", "*tú*: mates, family, kids, people your own age.", "*usted*: the boss, customers, older people, strangers, police.", "Not sure? *usted* is the safe choice with strangers. With mates it can sound stiff."], "examples": [["¿Cómo estás?", "How are you? (tú, to a mate)"], ["¿Cómo está?", "How are you? (usted, to a customer)"]]}, {"t": "learn", "title": "Talking to a group", "text": ["For 'you all', Latin America always says *ustedes*. It works for mates and strangers alike.", "Spain has another word for this, but you won't need it."], "examples": [["¿Cómo están?", "How are you all?"]], "chile": "This is a Chile difference: Chileans use *tú* a lot, even with new people their own age. With *tú* they often change the verb ending and push the last bit: *¿cómo estai?* (es-TAI), *¿cachai?* (ca-CHAI, you get it?). Understand it for now, no need to say it yet."}, {"t": "choice", "id": "1.3.customer", "prompt": "An older customer on site. Which 'you'?", "options": ["usted", "tú", "ustedes"], "answer": "usted", "why": "Customers and older people get usted.", "speak": "¿Cómo está usted?"}, {"t": "choice", "id": "1.3.mate", "prompt": "Your mate from work. Which 'you'?", "options": ["tú", "usted", "ustedes"], "answer": "tú", "why": "Mates get tú.", "speak": "¿Cómo estás?"}, {"t": "choice", "id": "1.3.crew", "prompt": "Talking to the whole crew at once. Which 'you'?", "options": ["ustedes", "tú", "usted"], "answer": "ustedes", "why": "More than one person is always ustedes in Latin America.", "speak": "¿Cómo están ustedes?"}, {"t": "choice", "id": "1.3.police", "prompt": "A police officer stops you. Which 'you'?", "options": ["usted", "tú", "ustedes"], "answer": "usted", "why": "Officials and strangers get usted.", "speak": "Buenas tardes. ¿Cómo está usted?"}, {"t": "choice", "id": "1.3.esta", "prompt": "¿Cómo está? is said to…", "options": ["someone you call usted", "a close mate", "a group"], "answer": "someone you call usted", "why": "está goes with usted. estás goes with tú.", "speak": "¿Cómo está?", "optLang": "en"}, {"t": "build", "id": "1.3.build", "en": "How are you? (to a customer)", "tiles": ["¿cómo", "está", "usted?"], "extra": ["estás"], "why": "usted takes está, without the s."}, {"t": "type", "id": "1.3.type", "prompt": "Ask your mate how they are.", "answers": ["¿cómo estás?", "hola, ¿cómo estás?", "¿qué tal?", "hola, ¿qué tal?", "¿cómo estai?", "¿cómo estás tú?", "hola, ¿cómo estai?", "¿tú cómo estás?", "¿y tú, cómo estás?", "¿cómo andas?", "¿cómo te va?", "hola, ¿cómo te va?", "hola, ¿cómo estás tú?", "¿qué tal estás?"], "why": "¿Cómo estás? is the tú version for a mate.", "show": "¿Cómo estás?"}, {"t": "say", "id": "1.3.say", "es": "Mucho gusto, ¿cómo está usted?", "en": "Nice to meet you, how are you?", "tip": "Respectful, for a new customer. MOO-choh GOOS-toh."}]}, {"id": "1.4", "title": "El, la, los, las", "minutes": 8, "steps": [{"t": "learn", "title": "Every thing is el or la", "text": ["Every Spanish noun is either masculine or feminine. For things, it's just grammar. For people, it matches the person: *el amigo*, *la amiga*.", "*el* = the (masculine). *la* = the (feminine).", "Most words ending in -o take *el*: *el techo* (roof), *el martillo* (hammer).", "Most words ending in -a take *la*: *la puerta* (door), *la ventana* (window).", "Learn each word with its el or la, as one block."]}, {"t": "learn", "title": "The tricky ones", "text": ["A few break the pattern. Learn these as they come.", "End in -a but take el: *el día*, *el mapa*, *el problema*.", "End in -o but take la: *la mano* (hand), *la foto*.", "Words ending in -ción or -sión take la: *la canción* (song), *la información*. Other -ión words can differ: *el camión* (truck) and *el avión* (plane) are masculine.", "*el agua* (water) is feminine, but takes el because *la agua* is hard to say. Just learn it as *el agua*."], "mistake": {"wrong": "la problema", "right": "el problema", "why": "problema ends in -a but takes el. One of the rule-breakers."}}, {"t": "learn", "title": "More than one, and 'a'", "text": ["Ends in a vowel: add -s. *el techo* → *los techos*, *la puerta* → *las puertas*.", "Ends in a consonant: add -es. *el papel* → *los papeles*, *la flor* → *las flores*.", "*los* and *las* = the, for more than one.", "'A' or 'an' is *un* (masculine) or *una* (feminine): *un martillo*, *una llave* (a key)."], "chile": "Car is *el carro* in many countries, but in Chile it's *el auto*."}, {"t": "choice", "id": "1.4.techo", "prompt": "Pick the right word: ___ techo (roof)", "options": ["el", "la"], "answer": "el", "why": "techo ends in -o, so el techo.", "speak": "el techo"}, {"t": "choice", "id": "1.4.puerta", "prompt": "Pick the right word: ___ puerta (door)", "options": ["la", "el"], "answer": "la", "why": "puerta ends in -a, so la puerta.", "speak": "la puerta"}, {"t": "choice", "id": "1.4.dia", "prompt": "Pick the right word: ___ día (day)", "options": ["el", "la"], "answer": "el", "why": "día is a rule-breaker: it ends in -a but takes el.", "speak": "el día"}, {"t": "choice", "id": "1.4.mano", "prompt": "Pick the right word: ___ mano (hand)", "options": ["la", "el"], "answer": "la", "why": "mano is a rule-breaker: it ends in -o but takes la.", "speak": "la mano"}, {"t": "choice", "id": "1.4.cancion", "prompt": "Pick the right word: ___ canción (song)", "options": ["la", "el"], "answer": "la", "why": "Words ending in -ción take la.", "speak": "la canción"}, {"t": "choice", "id": "1.4.plural", "prompt": "More than one: el martillo → ?", "options": ["los martillos", "las martillos", "los martillo"], "answer": "los martillos", "why": "el becomes los, and add -s after a vowel.", "speak": "los martillos"}, {"t": "type", "id": "1.4.llaves", "prompt": "Make it more than one: la llave (the key)", "answers": ["las llaves"], "why": "la becomes las, and llave ends in a vowel, so add -s.", "show": "Las llaves."}, {"t": "type", "id": "1.4.un", "prompt": "Write 'a hammer' in Spanish.", "answers": ["un martillo"], "why": "martillo is masculine, so un martillo.", "show": "Un martillo."}, {"t": "build", "id": "1.4.build", "en": "the roof and the door", "tiles": ["el", "techo", "y", "la", "puerta"], "extra": ["los"], "why": "el techo, la puerta. y means 'and'."}, {"t": "say", "id": "1.4.say", "es": "El martillo, la llave y los clavos.", "en": "The hammer, the key and the nails.", "tip": "ll in martillo and llave sounds like y."}]}, {"id": "1.5", "title": "Numbers 0 to 20", "minutes": 7, "steps": [{"t": "learn", "title": "0 to 10", "text": ["*cero, uno, dos, tres, cuatro, cinco, seis, siete, ocho, nueve, diez*", "Before a noun, *uno* becomes *un* or *una*: *un martillo*, *una llave*."], "say": ["uno", "dos", "tres", "cuatro", "cinco", "seis", "siete", "ocho", "nueve", "diez"]}, {"t": "learn", "title": "11 to 20", "text": ["*once, doce, trece, catorce, quince*: just learn these five.", "16 to 19 are 'ten and six' squashed into one word: *dieciséis, diecisiete, dieciocho, diecinueve*.", "*veinte* = 20."], "mistake": {"wrong": "dieciseis", "right": "dieciséis", "why": "16 has an accent mark: dieci-SÉIS."}, "say": ["once", "doce", "trece", "catorce", "quince", "dieciséis", "veinte"]}, {"t": "choice", "id": "1.5.7", "prompt": "Which one is 7?", "options": ["siete", "seis", "diez"], "answer": "siete", "why": "seis is 6, siete is 7.", "speak": "siete"}, {"t": "choice", "id": "1.5.15", "prompt": "Which one is 15?", "options": ["quince", "cinco", "catorce"], "answer": "quince", "why": "cinco is 5, catorce is 14, quince is 15.", "speak": "quince"}, {"t": "listen", "id": "1.5.listen12", "prompt": "Listen. Which number?", "es": "doce", "options": ["12", "2", "20"], "answer": "12", "why": "doce is 12. dos is 2, veinte is 20.", "optLang": "en"}, {"t": "listen", "id": "1.5.listen13", "prompt": "Listen. Which number?", "es": "trece", "options": ["13", "3", "16"], "answer": "13", "why": "trece is 13. tres is 3.", "optLang": "en"}, {"t": "type", "id": "1.5.16", "prompt": "Write 16 as a word.", "answers": ["dieciséis", "diez y seis"], "why": "dieci + seis, with an accent: dieciséis.", "show": "Dieciséis."}, {"t": "type", "id": "1.5.20", "prompt": "Write 20 as a word.", "answers": ["veinte"], "why": "veinte, said BAYN-teh.", "show": "Veinte."}, {"t": "type", "id": "1.5.laminas", "prompt": "Write '12 sheets' (sheet = lámina).", "answers": ["doce láminas", "doce planchas", "12 láminas"], "why": "doce + láminas. Plural because there's more than one.", "show": "Doce láminas."}, {"t": "choice", "id": "1.5.una", "prompt": "Pick the right word: ___ llave (a key)", "options": ["una", "uno", "un"], "answer": "una", "why": "llave takes la, so it's una llave.", "speak": "una llave"}, {"t": "say", "id": "1.5.say1", "es": "Uno, dos, tres, cuatro, cinco.", "en": "One, two, three, four, five.", "tip": "cuatro is KWAH-troh, cinco is SEEN-koh."}, {"t": "say", "id": "1.5.say2", "es": "Diez tornillos, por favor.", "en": "Ten screws, please.", "tip": "diez is one beat, like 'yes' with a d in front: dyess."}]}, {"id": "1.6", "title": "Who you are", "minutes": 7, "steps": [{"t": "learn", "title": "Your name", "text": ["*Me llamo {name}.* My name is {name}. (Literally 'I call myself {name}'.)", "*Soy {name}.* I'm {name}. Just as common.", "Asking: *¿Cómo te llamas?* to a mate, *¿Cómo se llama?* to a customer."], "mistake": {"wrong": "Me llamo es {name}", "right": "Me llamo {name}", "why": "*me llamo* already means 'my name is'. No es needed."}, "chile": "A Chilean might ask *¿Cómo te llamai?* (te lla-MAI). Same question, Chilean ending."}, {"t": "learn", "title": "Where you're from and what you do", "text": ["*Soy de Australia.* I'm from Australia. Or *Soy australiano.* I'm Australian.", "*¿De dónde eres?* Where are you from? (to a mate). *¿De dónde es?* (to a customer).", "Two handy blocks to memorise whole: *Vivo en Sídney.* (I live in Sydney.) *Trabajo en una empresa de techos.* (I work for a roofing company.)"]}, {"t": "choice", "id": "1.6.meaning", "prompt": "What does this mean?", "es": "Me llamo {name}.", "options": ["My name is {name}.", "I call {name}.", "I'm calling {name}."], "answer": "My name is {name}.", "why": "Me llamo is how you give your name.", "speak": "Me llamo {name}.", "optLang": "en"}, {"t": "choice", "id": "1.6.fix", "prompt": "Fix this sentence.", "es": "Me llamo es {name}.", "options": ["Me llamo {name}.", "Me es llamo {name}.", "Llamo es {name}."], "answer": "Me llamo {name}.", "why": "No es after me llamo.", "speak": "Me llamo {name}."}, {"t": "choice", "id": "1.6.customer", "prompt": "Ask a new customer their name.", "options": ["¿Cómo se llama?", "¿Cómo te llamas?", "¿Cómo estás?"], "answer": "¿Cómo se llama?", "why": "se llama is the usted version, right for a customer.", "speak": "¿Cómo se llama?"}, {"t": "build", "id": "1.6.build", "en": "My name is {name} and I'm from Australia.", "tiles": ["me", "llamo", "{name}", "y", "soy", "de", "Australia."], "extra": ["es"], "why": "Me llamo + name, then soy de + place."}, {"t": "type", "id": "1.6.name", "prompt": "Tell someone your name (use {name}).", "answers": ["me llamo {name}", "soy {name}", "mi nombre es {name}", "hola, me llamo {name}", "hola, soy {name}", "yo me llamo {name}", "hola, mi nombre es {name}", "mucho gusto, me llamo {name}", "mucho gusto, soy {name}", "yo soy {name}", "me llamo {name}, mucho gusto", "soy {name}, mucho gusto"], "why": "Me llamo {name}, or Soy {name}.", "show": "Me llamo {name}."}, {"t": "type", "id": "1.6.from", "prompt": "Say you're from Australia.", "answers": ["soy de australia", "soy australiano", "yo soy de australia", "yo soy australiano", "soy australiana", "hola, soy de australia", "soy de australia, ¿y tú?", "vengo de australia"], "why": "Soy de Australia, or Soy australiano.", "show": "Soy de Australia."}, {"t": "type", "id": "1.6.where", "prompt": "Ask your mate where they're from.", "answers": ["¿de dónde eres?", "¿y tú, de dónde eres?", "¿de dónde eres tú?", "hola, ¿de dónde eres?", "¿tú de dónde eres?", "¿de dónde eres, amigo?"], "why": "¿De dónde eres? is the tú version.", "show": "¿De dónde eres?"}, {"t": "choice", "id": "1.6.chile", "prompt": "A Chilean asks ¿Cómo te llamai? They want to know…", "options": ["your name", "where you live", "how you are"], "answer": "your name", "why": "llamai is the Chilean ending on llamas.", "speak": "¿Cómo te llamai?", "optLang": "en"}, {"t": "say", "id": "1.6.say", "es": "Mucho gusto. Me llamo {name}. Soy de Australia.", "en": "Nice to meet you. My name is {name}. I'm from Australia.", "tip": "llamo sounds like YAH-moh."}]}], "check": {"title": "Level 1 check", "pass": 0.8, "steps": [{"t": "choice", "id": "1.c.h", "prompt": "How do you say the h in hotel?", "options": ["It's silent", "Like English h", "Like a j"], "answer": "It's silent", "why": "h is always silent.", "speak": "hotel", "optLang": "en"}, {"t": "choice", "id": "1.c.z", "prompt": "In Latin America, zapato (shoe) sounds like…", "options": ["sah-PAH-toh", "thah-PAH-toh", "zah-PAH-toh"], "answer": "sah-PAH-toh", "why": "z sounds like s in Latin America.", "speak": "zapato", "optLang": "en"}, {"t": "choice", "id": "1.c.tardes", "prompt": "It's 2 pm. You say…", "options": ["Buenas tardes", "Buenos días", "Buenas noches"], "answer": "Buenas tardes", "why": "Afternoon is buenas tardes.", "speak": "Buenas tardes"}, {"t": "type", "id": "1.c.gusto", "prompt": "Someone says Mucho gusto. Reply.", "answers": ["igualmente", "mucho gusto", "igualmente, mucho gusto", "encantado", "encantada", "mucho gusto, igualmente", "igualmente, encantado", "encantado, igualmente", "el gusto es mío", "encantada, igualmente"], "why": "Igualmente (likewise).", "show": "Igualmente."}, {"t": "choice", "id": "1.c.boss", "prompt": "The company owner. Which 'you'?", "options": ["usted", "tú", "ustedes"], "answer": "usted", "why": "Bosses get usted.", "speak": "¿Cómo está usted?"}, {"t": "choice", "id": "1.c.mapa", "prompt": "Pick the right word: ___ mapa", "options": ["el", "la"], "answer": "el", "why": "mapa is a rule-breaker: el mapa.", "speak": "el mapa"}, {"t": "choice", "id": "1.c.foto", "prompt": "Pick the right word: ___ foto", "options": ["la", "el"], "answer": "la", "why": "foto is a rule-breaker: la foto.", "speak": "la foto"}, {"t": "type", "id": "1.c.clavos", "prompt": "Make it more than one: el clavo (the nail)", "answers": ["los clavos"], "why": "los clavos.", "show": "Los clavos."}, {"t": "type", "id": "1.c.llave", "prompt": "Write 'a key' in Spanish.", "answers": ["una llave"], "why": "una llave.", "show": "Una llave."}, {"t": "listen", "id": "1.c.listen", "prompt": "Listen. Which number?", "es": "catorce", "options": ["14", "4", "15"], "answer": "14", "why": "catorce is 14. cuatro is 4, quince is 15.", "optLang": "en"}, {"t": "type", "id": "1.c.11", "prompt": "Write 11 as a word.", "answers": ["once"], "why": "once is 11.", "show": "Once."}, {"t": "build", "id": "1.c.build", "en": "Good afternoon, how are you? (to a customer)", "tiles": ["buenas", "tardes,", "¿cómo", "está", "usted?"], "extra": ["buenos"], "why": "buenas tardes, then the usted question."}, {"t": "choice", "id": "1.c.donde", "prompt": "What does ¿De dónde eres? mean?", "options": ["Where are you from?", "Where are you?", "Who are you?"], "answer": "Where are you from?", "why": "de dónde = from where.", "speak": "¿De dónde eres?", "optLang": "en"}, {"t": "type", "id": "1.c.name", "prompt": "Say your name (use {name}).", "answers": ["me llamo {name}", "soy {name}", "mi nombre es {name}", "yo me llamo {name}", "hola, me llamo {name}", "mucho gusto, me llamo {name}", "hola, soy {name}", "yo soy {name}", "mucho gusto, soy {name}", "hola, mi nombre es {name}", "me llamo {name}, mucho gusto", "soy {name}, mucho gusto"], "why": "Me llamo {name}.", "show": "Me llamo {name}."}, {"t": "choice", "id": "1.c.cachai", "prompt": "A Chilean says ¿Cachai? What do they mean?", "options": ["You get it?", "Are you hungry?", "See you later"], "answer": "You get it?", "why": "¿Cachai? means 'you know?' or 'get it?'.", "speak": "¿Cachai?", "optLang": "en"}]}}, "2": {"id": 2, "lessons": [{"id": "2.1", "title": "Ser: what something is", "minutes": 8, "steps": [{"t": "learn", "title": "A little Spanish in the instructions", "text": ["From this level on, some instructions start with a Spanish word. It's always one of these four, so you'll pick them up fast."], "examples": [["Escucha.", "Listen."], ["Elige.", "Pick one."], ["Completa.", "Fill the gap."], ["Escribe.", "Write it in Spanish."]]}, {"t": "learn", "title": "Two verbs for 'to be'", "text": ["English has one 'to be'. Spanish has two: *ser* and *estar*.", "*ser* is for what something IS: who, what, where from. You met it in Level 1: *Soy {name}.* *Soy de Australia.*", "*estar* is for how or where something is right now. You met that too: *¿Cómo estás?*", "This lesson is *ser*. The next one is *estar*."], "mistake": {"wrong": "Estoy de Australia.", "right": "Soy de Australia.", "why": "Where you're from never changes, so it's *ser*."}}, {"t": "learn", "title": "Ser, person by person", "text": ["Each person has its own form. Learn them as blocks.", "You can usually drop *yo*, *tú* and the rest, because the verb says who: *Soy estudiante.* I'm a student. *usted*, *él* and *ella* all use *es*, so the name or the situation tells you who.", "A group of only women uses *nosotras* and *ellas*."], "examples": [["yo soy", "I am"], ["tú eres", "you are (a mate)"], ["usted es", "you are (respectful)"], ["él es, ella es", "he is, she is, it is"], ["nosotros somos", "we are"], ["ustedes son", "you all are"], ["ellos son, ellas son", "they are"]], "mistake": {"wrong": "Nosotros son de Australia.", "right": "Nosotros somos de Australia.", "why": "*nosotros* (we) always takes *somos*."}, "say": ["soy", "eres", "es", "somos", "son"]}, {"t": "learn", "title": "Who someone is", "text": ["*ser* says who someone is, or who they are to you. (*mi* = my, *mis* = my, for more than one)"], "examples": [["Es mi jefe.", "He's my boss."], ["Es mi hermana.", "She's my sister."], ["Son mis amigos.", "They're my friends."]], "mistake": {"wrong": "Ella está mi hermana.", "right": "Ella es mi hermana.", "why": "Who someone is to you takes *ser*."}}, {"t": "learn", "title": "Jobs", "text": ["*ser* also says what someone does for a living.", "On its own, a job usually has no *un* or *una*: *Soy profesor* is the normal way to say it."], "examples": [["Soy profesor.", "I'm a teacher."], ["Ella es doctora.", "She's a doctor."], ["Soy estudiante.", "I'm a student."]], "mistake": {"wrong": "Estoy profesor.", "right": "Soy profesor.", "why": "A job is what you are, so it's *ser*, not *estar*."}}, {"t": "choice", "id": "2.1.soy", "prompt": "Completa: Yo ___ de Australia.", "options": ["soy", "eres", "es"], "answer": "soy", "why": "*yo* takes *soy*.", "speak": "Yo soy de Australia."}, {"t": "choice", "id": "2.1.eres", "prompt": "Completa: ¿Tú ___ de Chile?", "options": ["eres", "es", "soy"], "answer": "eres", "why": "*tú* takes *eres*.", "speak": "¿Tú eres de Chile?"}, {"t": "choice", "id": "2.1.somos", "prompt": "Completa: Nosotros ___ de Sídney.", "options": ["somos", "son", "soy"], "answer": "somos", "why": "*nosotros* takes *somos*.", "speak": "Nosotros somos de Sídney."}, {"t": "choice", "id": "2.1.son", "prompt": "Completa: Ellos ___ mis amigos.", "options": ["son", "somos", "es"], "answer": "son", "why": "*ellos* (they) takes *son*.", "speak": "Ellos son mis amigos."}, {"t": "listen", "id": "2.1.listen", "prompt": "Escucha. Which did you hear?", "es": "Somos amigos.", "options": ["Somos amigos.", "Son amigos.", "Soy amigo."], "answer": "Somos amigos.", "why": "*somos* is 'we are'. *son* is 'they are'."}, {"t": "choice", "id": "2.1.job", "prompt": "Elige: He's a teacher.", "options": ["Es profesor.", "Está profesor.", "Es de profesor."], "answer": "Es profesor.", "why": "A job takes *ser*, usually with no *un* in front.", "speak": "Es profesor."}, {"t": "build", "id": "2.1.build", "en": "We're from Australia.", "tiles": ["nosotros", "somos", "de", "Australia."], "extra": ["son"], "why": "*nosotros somos*, then *de* + the place."}, {"t": "type", "id": "2.1.student", "prompt": "Escribe: I'm a student.", "answers": ["soy estudiante", "yo soy estudiante", "soy un estudiante", "yo soy un estudiante"], "why": "*Soy estudiante.* Usually no *un* before a job.", "show": "Soy estudiante."}, {"t": "type", "id": "2.1.sister", "prompt": "Escribe: She's my sister. (my = *mi*)", "answers": ["ella es mi hermana", "es mi hermana"], "why": "*ella es* + *mi hermana*.", "show": "Ella es mi hermana."}, {"t": "say", "id": "2.1.say", "es": "Hola, soy {name}. Somos de Australia.", "en": "Hi, I'm {name}. We're from Australia.", "tip": "somos is SOH-mohs. Silent h in hola."}]}, {"id": "2.2", "title": "Estar: how and where", "minutes": 8, "steps": [{"t": "learn", "title": "Estar, person by person", "text": ["You already know *¿Cómo estás?* That's *estar*.", "Watch the accent marks on *estás*, *está* and *están*. The push goes on the end: es-TÁ. *estoy* pushes the end too: es-TOY."], "examples": [["yo estoy", "I am"], ["tú estás", "you are (a mate)"], ["usted está", "you are (respectful)"], ["él está, ella está", "he is, she is, it is"], ["nosotros estamos", "we are"], ["ustedes están", "you all are"], ["ellos están, ellas están", "they are"]], "mistake": {"wrong": "Yo está bien.", "right": "Yo estoy bien.", "why": "*yo* takes *estoy*. *está* is for usted, él and ella."}, "say": ["estoy", "estás", "está", "estamos", "están"]}, {"t": "learn", "title": "How you are right now", "text": ["*estar* says how someone is at the moment: tired, happy, sick, busy.", "A man says *cansado*, a woman says *cansada*. The same goes for the others. More on that in lesson 2.4."], "examples": [["Estoy cansado.", "I'm tired."], ["Estoy contento.", "I'm happy."], ["Estoy enfermo.", "I'm sick."], ["Estoy ocupado.", "I'm busy."]], "mistake": {"wrong": "Soy cansado.", "right": "Estoy cansado.", "why": "Tired is how you are right now, not who you are. That's *estar*."}}, {"t": "learn", "title": "Where something is", "text": ["*estar* also says where someone or something is.", "*en* means in, on or at: *en el camión* (in the truck), *en el techo* (on the roof), *en el hotel* (at the hotel)."], "examples": [["¿Dónde está el martillo?", "Where's the hammer?"], ["Está en el camión.", "It's in the truck."], ["Estoy en el techo.", "I'm on the roof."]], "mistake": {"wrong": "¿Dónde es el baño?", "right": "¿Dónde está el baño?", "why": "Where a thing is takes *estar*."}, "chile": "With mates, Chileans say *estai* for *estás*, just like *¿Cómo estai?* in Level 1. *¿Dónde estai?* means 'Where are you?'"}, {"t": "choice", "id": "2.2.estoy", "prompt": "Completa: Yo ___ cansado.", "options": ["estoy", "está", "estás"], "answer": "estoy", "why": "*yo* takes *estoy*.", "speak": "Yo estoy cansado."}, {"t": "choice", "id": "2.2.estamos", "prompt": "Completa: Nosotros ___ en el hotel.", "options": ["estamos", "están", "estoy"], "answer": "estamos", "why": "*nosotros* takes *estamos*.", "speak": "Nosotros estamos en el hotel."}, {"t": "choice", "id": "2.2.donde", "prompt": "Elige: Where's the key?", "options": ["¿Dónde está la llave?", "¿Dónde es la llave?", "¿Dónde estoy la llave?"], "answer": "¿Dónde está la llave?", "why": "Where a thing is takes *está*.", "speak": "¿Dónde está la llave?"}, {"t": "choice", "id": "2.2.busy", "prompt": "What does this mean?", "es": "Estoy ocupado.", "options": ["I'm busy.", "I'm tired.", "I'm sick."], "answer": "I'm busy.", "why": "*ocupado* is busy. Tired is *cansado*, sick is *enfermo*.", "speak": "Estoy ocupado.", "optLang": "en"}, {"t": "listen", "id": "2.2.listen", "prompt": "Escucha. Which did you hear?", "es": "Está en el techo.", "options": ["Está en el techo.", "Estoy en el techo.", "Es el techo."], "answer": "Está en el techo.", "why": "*está* (he, she or it is) ends in a strong á. *estoy* ends in -oy."}, {"t": "build", "id": "2.2.build", "en": "The hammer is in the truck.", "tiles": ["el", "martillo", "está", "en", "el", "camión."], "extra": ["estoy"], "why": "*el martillo está*, then *en el camión*."}, {"t": "type", "id": "2.2.tired", "prompt": "Escribe: I'm tired.", "answers": ["estoy cansado", "estoy cansada", "yo estoy cansado", "yo estoy cansada", "estoy muy cansado", "estoy muy cansada", "yo estoy muy cansado", "yo estoy muy cansada"], "why": "*Estoy cansado.* A woman says *cansada*.", "show": "Estoy cansado."}, {"t": "type", "id": "2.2.where", "prompt": "Escribe: Ask your mate where they are.", "answers": ["¿dónde estás?", "¿dónde estás tú?", "¿tú dónde estás?", "¿y tú, dónde estás?", "hola, ¿dónde estás?", "¿dónde estai?", "¿dónde estai tú?", "hola, ¿dónde estai?", "¿en dónde estás?", "¿dónde estás ahora?", "¿y dónde estás?", "¿dónde andas?", "¿en dónde estai?", "¿dónde estai ahora?"], "why": "*¿Dónde estás?* is the tú version for a mate.", "show": "¿Dónde estás?"}, {"t": "choice", "id": "2.2.chile", "prompt": "A Chilean mate texts ¿Dónde estai? They're asking…", "options": ["Where are you?", "How are you?", "Who are you?"], "answer": "Where are you?", "why": "*estai* is the Chilean way to say *estás* with mates.", "speak": "¿Dónde estai?", "optLang": "en"}, {"t": "say", "id": "2.2.say", "es": "Estoy en el techo. Estoy ocupado.", "en": "I'm on the roof. I'm busy.", "tip": "Push the end of estoy: es-TOY."}]}, {"id": "2.3", "title": "Ser or estar?", "minutes": 8, "steps": [{"t": "learn", "title": "The quick test", "text": ["Ask yourself: is this what it IS, or how or where it is right now?", "What it is (who, what job, where from): *ser*.", "How it is right now, or where it is: *estar*."], "examples": [["Es mi amigo.", "He's my friend. (who he is: ser)"], ["Está cansado.", "He's tired. (how he is now: estar)"], ["Es de Chile.", "She's from Chile. (where from: ser)"], ["Está en Chile.", "She's in Chile. (where she is: estar)"]], "mistake": {"wrong": "Es en Chile.", "right": "Está en Chile.", "why": "Being somewhere is *estar*. Coming from somewhere is *ser*."}, "chile": "Chileans often drop the d in words ending in -ado. *Estoy cansado* can sound like 'estoy cansao'. In standard Spanish, write it with the d."}, {"t": "learn", "title": "Places that never move", "text": ["Where a person, a thing or a place is takes *estar*, even if it never moves.", "*Sídney está en Australia.* Sydney is in Australia.", "*El hotel está en la playa.* The hotel is on the beach.", "(Events, like a meeting or a party, work differently. You'll meet that later.)"], "mistake": {"wrong": "Sídney es en Australia.", "right": "Sídney está en Australia.", "why": "Sydney won't move, but where it is still takes *estar*."}}, {"t": "choice", "id": "2.3.de", "prompt": "Completa: Mi jefe ___ de Chile.", "options": ["es", "está"], "answer": "es", "why": "Where he's from: *ser*.", "speak": "Mi jefe es de Chile."}, {"t": "choice", "id": "2.3.en", "prompt": "Completa: Mi jefe ___ en Chile.", "options": ["está", "es"], "answer": "está", "why": "Where he is: *estar*.", "speak": "Mi jefe está en Chile."}, {"t": "choice", "id": "2.3.sick", "prompt": "Completa: Mi hermana ___ enferma hoy. (hoy = today)", "options": ["está", "es"], "answer": "está", "why": "Sick today, right now: *estar*.", "speak": "Mi hermana está enferma hoy."}, {"t": "choice", "id": "2.3.doctor", "prompt": "Completa: Ella ___ doctora.", "options": ["es", "está"], "answer": "es", "why": "A job: *ser*.", "speak": "Ella es doctora."}, {"t": "choice", "id": "2.3.sydney", "prompt": "Completa: Sídney ___ en Australia.", "options": ["está", "es"], "answer": "está", "why": "Where a place is: *estar*, even though it never moves.", "speak": "Sídney está en Australia."}, {"t": "choice", "id": "2.3.friends", "prompt": "Completa: Nosotros ___ amigos.", "options": ["somos", "estamos"], "answer": "somos", "why": "Who you are to each other: *ser*.", "speak": "Nosotros somos amigos."}, {"t": "listen", "id": "2.3.listen", "prompt": "Escucha. Which did you hear?", "es": "Están en la playa.", "options": ["Están en la playa.", "Estamos en la playa.", "Son de la playa."], "answer": "Están en la playa.", "why": "*están* is 'they are'. *estamos* is 'we are'."}, {"t": "build", "id": "2.3.build", "en": "My friend is in Chile.", "tiles": ["mi", "amigo", "está", "en", "Chile."], "extra": ["es"], "why": "Where he is right now: *está*."}, {"t": "type", "id": "2.3.hotel", "prompt": "Escribe: The hotel is on the beach.", "answers": ["el hotel está en la playa", "el hotel queda en la playa"], "why": "Where a place is: *está*.", "show": "El hotel está en la playa."}, {"t": "type", "id": "2.3.from", "prompt": "Escribe: We're from Australia.", "answers": ["somos de australia", "nosotros somos de australia", "somos australianos", "nosotros somos australianos", "somos australianas", "nosotras somos australianas", "nosotras somos de australia"], "why": "Where you're from: *ser*. *Somos de Australia.*", "show": "Somos de Australia."}, {"t": "choice", "id": "2.3.chile", "prompt": "In Chile you hear 'estoy cansao'. How do you write it in standard Spanish?", "options": ["Estoy cansado.", "Estoy cansao.", "Soy cansado."], "answer": "Estoy cansado.", "why": "Chileans often drop the d in -ado when they speak. In standard writing the d stays: *cansado*.", "speak": "Estoy cansado."}, {"t": "say", "id": "2.3.say", "es": "Soy de Australia, pero estoy en Chile.", "en": "I'm from Australia, but I'm in Chile.", "tip": "pero means but. Say it PEH-roh, with a quick tap on the r."}]}, {"id": "2.4", "title": "Describing things", "minutes": 9, "steps": [{"t": "learn", "title": "Words to describe things", "text": ["Here are six handy pairs. You'll use them all through this level."], "examples": [["largo, corto", "long, short"], ["alto, bajo", "high, low (and tall, short)"], ["grande, pequeño", "big, small"], ["nuevo, viejo", "new, old"], ["caro, barato", "expensive, cheap"], ["bueno, malo", "good, bad"]], "mistake": {"wrong": "largo = large", "right": "largo = long", "why": "Large is *grande*. *largo* means long."}}, {"t": "learn", "title": "The describing word goes after", "text": ["In Spanish, the describing word usually comes after the thing.", "*la lámina larga*: the long sheet. *el techo alto*: the high roof.", "With *ser* it reads like English: *La lámina es larga.* The sheet is long."], "mistake": {"wrong": "el rojo camión", "right": "el camión rojo", "why": "Colours like *rojo* (red) always go after the thing."}}, {"t": "learn", "title": "-o or -a, to match", "text": ["A describing word ending in -o changes to -a for a *la* word.", "Same for people: a man is *cansado*, a woman is *cansada*."], "examples": [["el techo alto", "the high roof"], ["la pared alta", "the high wall"], ["el martillo nuevo", "the new hammer"], ["la llave nueva", "the new key"]], "mistake": {"wrong": "La lámina es largo.", "right": "La lámina es larga.", "why": "*lámina* is a *la* word, so *largo* becomes *larga*."}}, {"t": "learn", "title": "Words that don't change", "text": ["Most describing words ending in -e, or in a consonant, stay the same for *el* and *la*: *grande*, *verde*, *azul*.", "A few do change, like nationalities: *inglés*, *inglesa*."], "examples": [["el camión grande", "the big truck"], ["la casa grande", "the big house"], ["el techo verde", "the green roof"], ["la puerta azul", "the blue door"]], "mistake": {"wrong": "la casa granda", "right": "la casa grande", "why": "*grande* ends in -e, so it doesn't change."}, "chile": "In Chile a bedroom is often *la pieza*: *La pieza es grande.* The bedroom is big."}, {"t": "choice", "id": "2.4.larga", "prompt": "Completa: La lámina es ___. (long)", "options": ["larga", "largo", "grande"], "answer": "larga", "why": "*la lámina*, so *larga*. *grande* means big, not long.", "speak": "La lámina es larga."}, {"t": "choice", "id": "2.4.nuevo", "prompt": "Completa: El martillo es ___. (new)", "options": ["nuevo", "nueva"], "answer": "nuevo", "why": "*el martillo*, so *nuevo*.", "speak": "El martillo es nuevo."}, {"t": "choice", "id": "2.4.grande", "prompt": "Completa: La casa es ___. (big)", "options": ["grande", "granda", "grando"], "answer": "grande", "why": "*grande* ends in -e, so it never changes.", "speak": "La casa es grande."}, {"t": "choice", "id": "2.4.order", "prompt": "Elige: the red truck (red = rojo)", "options": ["el camión rojo", "el rojo camión", "la camión roja"], "answer": "el camión rojo", "why": "The colour goes after, and *camión* is an *el* word.", "speak": "el camión rojo"}, {"t": "listen", "id": "2.4.listen", "prompt": "Escucha. Which did you hear?", "es": "La puerta es azul.", "options": ["La puerta es azul.", "La puerta es alta.", "El techo es azul."], "answer": "La puerta es azul.", "why": "*azul* is blue. *alta* is high."}, {"t": "build", "id": "2.4.build", "en": "The sheet is long.", "tiles": ["la", "lámina", "es", "larga."], "extra": ["largo"], "why": "*la lámina*, so *larga* with an a."}, {"t": "build", "id": "2.4.build2", "en": "The new key is small.", "tiles": ["la", "llave", "nueva", "es", "pequeña."], "extra": ["nuevo"], "why": "*la llave*, so both words end in -a: *nueva* and *pequeña*."}, {"t": "type", "id": "2.4.roof", "prompt": "Escribe: The roof is high.", "answers": ["el techo es alto", "el techo es muy alto"], "why": "*el techo*, so *alto*.", "show": "El techo es alto."}, {"t": "type", "id": "2.4.door", "prompt": "Escribe: The door is green.", "answers": ["la puerta es verde", "la puerta es de color verde"], "why": "*verde* ends in -e, so it stays the same.", "show": "La puerta es verde."}, {"t": "choice", "id": "2.4.chile", "prompt": "In Chile, la pieza in a house is…", "options": ["a bedroom", "a kitchen", "a bathroom"], "answer": "a bedroom", "why": "Chileans often call a bedroom *la pieza*.", "speak": "La pieza es grande.", "optLang": "en"}, {"t": "say", "id": "2.4.say", "es": "La lámina es larga y el techo es alto.", "en": "The sheet is long and the roof is high.", "tip": "Both match: larga for la lámina, alto for el techo."}]}, {"id": "2.5", "title": "More than one", "minutes": 7, "steps": [{"t": "learn", "title": "Everything adds -s", "text": ["More than one? The describing word adds -s too, just like the noun.", "The verb changes as well: *es* becomes *son*, *está* becomes *están*."], "examples": [["Las láminas son largas.", "The sheets are long."], ["Los clavos son pequeños.", "The nails are small."], ["Los tornillos están en el camión.", "The screws are in the truck."]], "mistake": {"wrong": "Las láminas son larga.", "right": "Las láminas son largas.", "why": "Everything matches: *las*, *láminas*, *largas*."}}, {"t": "learn", "title": "Consonant endings add -es", "text": ["A describing word that ends in a consonant adds -es, just like a noun.", "*azul* becomes *azules*. *gris* (grey) becomes *grises*."], "examples": [["la puerta azul", "the blue door"], ["las puertas azules", "the blue doors"]], "mistake": {"wrong": "las puertas azuls", "right": "las puertas azules", "why": "*azul* ends in a consonant, so add -es."}}, {"t": "learn", "title": "Colours", "text": ["Colours go after the thing and match it like any describing word."], "examples": [["rojo", "red"], ["azul", "blue"], ["verde", "green"], ["blanco", "white"], ["negro", "black"], ["gris", "grey"], ["amarillo", "yellow"]], "mistake": {"wrong": "la lámina blanco", "right": "la lámina blanca", "why": "*blanco* ends in -o, so it changes to match *la lámina*."}, "say": ["rojo", "azul", "verde", "blanco", "negro", "gris", "amarillo"]}, {"t": "choice", "id": "2.5.largas", "prompt": "Completa: Las láminas son ___. (long)", "options": ["largas", "larga", "largos"], "answer": "largas", "why": "*las láminas*, so *largas*.", "speak": "Las láminas son largas."}, {"t": "choice", "id": "2.5.son", "prompt": "Completa: Los clavos ___ pequeños.", "options": ["son", "es", "somos"], "answer": "son", "why": "More than one thing: *son*.", "speak": "Los clavos son pequeños."}, {"t": "choice", "id": "2.5.azules", "prompt": "Elige: the blue doors", "options": ["las puertas azules", "las puertas azuls", "las puerta azul"], "answer": "las puertas azules", "why": "*azul* ends in a consonant, so *azules*.", "speak": "las puertas azules"}, {"t": "choice", "id": "2.5.grey", "prompt": "What colour is it?", "es": "La lámina es gris.", "options": ["grey", "green", "black"], "answer": "grey", "why": "*gris* is grey. Green is *verde*, black is *negro*.", "speak": "La lámina es gris.", "optLang": "en"}, {"t": "listen", "id": "2.5.listen", "prompt": "Escucha. Which did you hear?", "es": "Los techos son rojos.", "options": ["Los techos son rojos.", "El techo es rojo.", "Las puertas son rojas."], "answer": "Los techos son rojos.", "why": "*son* and the -s endings tell you there's more than one."}, {"t": "build", "id": "2.5.build", "en": "The screws are new.", "tiles": ["los", "tornillos", "son", "nuevos."], "extra": ["nuevo"], "why": "More than one, so *son* and *nuevos*."}, {"t": "type", "id": "2.5.trucks", "prompt": "Make it more than one: el camión blanco", "answers": ["los camiones blancos"], "why": "*camión* becomes *camiones* (no accent mark now), and *blanco* becomes *blancos*.", "show": "Los camiones blancos."}, {"t": "type", "id": "2.5.keys", "prompt": "Escribe: The keys are big.", "answers": ["las llaves son grandes"], "why": "*las llaves son*, and *grande* adds -s: *grandes*.", "show": "Las llaves son grandes."}, {"t": "say", "id": "2.5.say", "es": "Las láminas son largas y los tornillos son nuevos.", "en": "The sheets are long and the screws are new.", "tip": "Hear the s on las, láminas, largas, los, tornillos and nuevos."}]}, {"id": "2.6", "title": "Same word, new meaning", "minutes": 8, "steps": [{"t": "learn", "title": "Bored or boring, ready or clever", "text": ["A few describing words change meaning with the verb.", "*ser* says what someone is like. *estar* says how they are right now.", "For clever, *inteligente* also works everywhere."], "examples": [["Está aburrido.", "He's bored."], ["Es aburrido.", "He's boring. (or: It's boring.)"], ["Está listo.", "He's ready."], ["Es listo.", "He's clever."]], "mistake": {"wrong": "Soy aburrido. (meaning I'm bored)", "right": "Estoy aburrido.", "why": "*Soy aburrido* says 'I'm boring'. Bored right now is *estoy*."}, "chile": "In Chile, boring is often *fome*: *La reunión es fome.* (The meeting is boring.) And *bacán* means great or cool."}, {"t": "learn", "title": "Open, closed, broken", "text": ["A state right now (open, closed, broken, cold) takes *estar*.", "The shop is closed now, but it'll open later. So: *estar*.", "*ser* says what something is like: *La lámina es larga.*"], "examples": [["La puerta está abierta.", "The door is open."], ["La tienda está cerrada.", "The shop is closed."], ["El martillo está roto.", "The hammer is broken."], ["El café está frío.", "The coffee is cold."]], "mistake": {"wrong": "La tienda es cerrada.", "right": "La tienda está cerrada.", "why": "Closed is how the shop is right now, so it's *estar*."}}, {"t": "choice", "id": "2.6.ready", "prompt": "What does this mean?", "es": "¿Estás listo?", "options": ["Are you ready?", "Are you clever?", "Are you tired?"], "answer": "Are you ready?", "why": "*estar listo* is ready. *ser listo* is clever.", "speak": "¿Estás listo?", "optLang": "en"}, {"t": "choice", "id": "2.6.bored", "prompt": "Elige: I'm bored.", "options": ["Estoy aburrido.", "Soy aburrido.", "Es aburrido."], "answer": "Estoy aburrido.", "why": "Bored right now is *estoy*. *Soy aburrido* means 'I'm boring'.", "speak": "Estoy aburrido."}, {"t": "choice", "id": "2.6.closed", "prompt": "Completa: La tienda ___ cerrada.", "options": ["está", "es"], "answer": "está", "why": "Closed right now: *está*.", "speak": "La tienda está cerrada."}, {"t": "choice", "id": "2.6.broken", "prompt": "Completa: El martillo está ___. (broken)", "options": ["roto", "rota", "rotos"], "answer": "roto", "why": "*el martillo*, one of them, so *roto*.", "speak": "El martillo está roto."}, {"t": "listen", "id": "2.6.listen", "prompt": "Escucha. Which did you hear?", "es": "La puerta está abierta.", "options": ["La puerta está abierta.", "La puerta está cerrada.", "La puerta es alta."], "answer": "La puerta está abierta.", "why": "*abierta* is open. *cerrada* is closed."}, {"t": "build", "id": "2.6.build", "en": "The coffee is cold.", "tiles": ["el", "café", "está", "frío."], "extra": ["estoy"], "why": "*el café está*, then *frío*."}, {"t": "type", "id": "2.6.ready2", "prompt": "Escribe: Ask your mate if they're ready.", "answers": ["¿estás listo?", "¿estás lista?", "¿listo?", "¿lista?", "¿tú estás listo?", "¿tú estás lista?", "¿estás listo tú?", "¿estás lista tú?", "¿ya estás listo?", "¿ya estás lista?", "¿estai listo?", "¿estai lista?", "¿estás preparado?", "¿estás preparada?", "¿estás listo ya?", "¿estás lista ya?", "¿ya estai listo?", "¿ya estai lista?", "¿y tú, estás listo?", "¿y tú, estás lista?"], "why": "*¿Estás listo?* Ask a woman *¿Estás lista?*", "show": "¿Estás listo?"}, {"t": "type", "id": "2.6.shop", "prompt": "Escribe: The shop is closed.", "answers": ["la tienda está cerrada", "la tienda está cerrada ahora", "la tienda ya está cerrada", "la tienda está cerrada ya"], "why": "Closed right now: *está*, and *cerrada* to match *la tienda*.", "show": "La tienda está cerrada."}, {"t": "choice", "id": "2.6.chile", "prompt": "A Chilean says La reunión es fome. The meeting is…", "options": ["boring", "great", "long"], "answer": "boring", "why": "*fome* is Chilean for boring. Great is *bacán*.", "speak": "La reunión es fome.", "optLang": "en"}, {"t": "say", "id": "2.6.say", "es": "Estoy listo. La puerta está abierta.", "en": "I'm ready. The door is open.", "tip": "Push the end of está: es-TÁ."}]}], "check": {"title": "Level 2 check", "pass": 0.8, "steps": [{"t": "choice", "id": "2.c.soy", "prompt": "Completa: Yo ___ de Australia.", "options": ["soy", "estoy", "es"], "answer": "soy", "why": "Where you're from: *ser*. *yo* takes *soy*.", "speak": "Yo soy de Australia."}, {"t": "choice", "id": "2.c.roof", "prompt": "Completa: Yo ___ en el techo.", "options": ["estoy", "soy", "está"], "answer": "estoy", "why": "Where you are: *estar*. *yo* takes *estoy*.", "speak": "Yo estoy en el techo."}, {"t": "choice", "id": "2.c.ellas", "prompt": "Completa: Ellas ___ de Chile.", "options": ["son", "están", "somos"], "answer": "son", "why": "Where they're from: *ser*. *ellas* takes *son*.", "speak": "Ellas son de Chile."}, {"t": "choice", "id": "2.c.doctor", "prompt": "Elige: She's a doctor.", "options": ["Ella es doctora.", "Ella está doctora.", "Ella estoy doctora."], "answer": "Ella es doctora.", "why": "A job: *ser*.", "speak": "Ella es doctora."}, {"t": "type", "id": "2.c.tired", "prompt": "Escribe: We're tired.", "answers": ["estamos cansados", "estamos cansadas", "nosotros estamos cansados", "nosotras estamos cansadas", "estamos muy cansados", "estamos muy cansadas", "nosotros estamos muy cansados", "nosotras estamos muy cansadas"], "why": "How you are right now: *estar*. *Estamos cansados.*", "show": "Estamos cansados."}, {"t": "choice", "id": "2.c.alta", "prompt": "Completa: La pared es ___. (high)", "options": ["alta", "alto", "altas"], "answer": "alta", "why": "*la pared*, one wall, so *alta*.", "speak": "La pared es alta."}, {"t": "type", "id": "2.c.red", "prompt": "Escribe: The roof is red.", "answers": ["el techo es rojo", "el techo es de color rojo"], "why": "*el techo*, so *rojo*.", "show": "El techo es rojo."}, {"t": "choice", "id": "2.c.verde", "prompt": "Completa: La puerta es ___. (green)", "options": ["verde", "verda", "verdo"], "answer": "verde", "why": "*verde* ends in -e, so it never changes.", "speak": "La puerta es verde."}, {"t": "type", "id": "2.c.plural", "prompt": "Make it more than one: la lámina larga", "answers": ["las láminas largas"], "why": "*las láminas largas*. Everything adds -s.", "show": "Las láminas largas."}, {"t": "build", "id": "2.c.build", "en": "The keys are in the truck.", "tiles": ["las", "llaves", "están", "en", "el", "camión."], "extra": ["son"], "why": "Where things are: *están*."}, {"t": "listen", "id": "2.c.listen", "prompt": "Escucha. Which did you hear?", "es": "Estamos listos.", "options": ["Estamos listos.", "Están listos.", "Somos listos."], "answer": "Estamos listos.", "why": "*estamos listos* is 'we're ready'."}, {"t": "choice", "id": "2.c.bored", "prompt": "What does this mean?", "es": "Estoy aburrido.", "options": ["I'm bored.", "I'm boring.", "I'm busy."], "answer": "I'm bored.", "why": "*estar aburrido* is bored. *ser aburrido* is boring.", "speak": "Estoy aburrido.", "optLang": "en"}, {"t": "choice", "id": "2.c.open", "prompt": "Completa: La puerta ___ abierta.", "options": ["está", "es", "son"], "answer": "está", "why": "Open right now: *está*.", "speak": "La puerta está abierta."}, {"t": "type", "id": "2.c.hammer", "prompt": "Escribe: Where's the hammer?", "answers": ["¿dónde está el martillo?", "¿el martillo dónde está?", "¿en dónde está el martillo?", "¿dónde está el martillo ahora?"], "why": "Where a thing is: *estar*.", "show": "¿Dónde está el martillo?"}, {"t": "choice", "id": "2.c.friends", "prompt": "Completa: Mis amigos ___ en Sídney.", "options": ["están", "son", "estamos"], "answer": "están", "why": "Where they are: *estar*. *mis amigos* takes *están*.", "speak": "Mis amigos están en Sídney."}]}}};
  // "claude": the claude.ai page (account sync, Claude marking). "web": the GitHub Pages copy (this device only).
  const EDITION = "web";
  const DEFAULT_NAME = "Sam";

  // ---------- Small helpers ----------
  const $ = (s, r = document) => r.querySelector(s);
  function el(tag, cls, text) { const e = document.createElement(tag); if (cls) { e.className = cls; if (/(^| )(es|big-es|ex-es|chip)( |$)/.test(cls)) e.lang = "es"; } if (text != null) e.textContent = text; return e; }
  function add(parent, ...kids) { kids.forEach((k) => k && parent.appendChild(k)); return parent; }
  // *word* marks Spanish inside English copy; rendered bold. Built with text nodes only.
  function fmt(str, tag = "p", cls) {
    const p = el(tag, cls);
    str.split(/\*([^*]+)\*/).forEach((part, k) => p.appendChild(k % 2 ? el("strong", "es", part) : document.createTextNode(part)));
    return p;
  }
  const shuffle = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const pick = (a) => a[Math.floor(Math.random() * a.length)];
  const plural = (n, w) => `${n} ${w}${n === 1 ? "" : "s"}`;
  const capFirst = (s) => s.replace(/^([¿¡]?)(\p{L})/u, (_, p, c) => p + c.toUpperCase());
  function today(offset = 0) { const d = new Date(); d.setDate(d.getDate() + offset); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
  const strict = (s) => s.toLowerCase().replace(/[¿?¡!.,;:"'“”]/g, " ").replace(/\s+/g, " ").trim();
  const loose = (s) => strict(s).normalize("NFD").replace(/[\u0300-\u036f]/g, "");
  const ICON_SPEAK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>';

  // Every graded exercise by id, so review can pull them back from any lesson.
  const EXERCISES = {};
  Object.values(LEVELS).forEach((lv) => {
    lv.lessons.forEach((ls) => ls.steps.forEach((s) => { if (s.id) EXERCISES[s.id] = { ...s, lesson: ls.id }; }));
    lv.check.steps.forEach((s) => { EXERCISES[s.id] = { ...s, lesson: "check-" + lv.id }; });
  });

  // ---------- Progress: saved to the account (db) with a copy on the device ----------
  const BLANK = () => ({ v: 1, passed: {}, done: {}, review: {}, cleared: {}, streak: { last: null, days: 0 }, settings: { voice: "", rate: 0.9, name: "" }, inProgress: null, updatedAt: 0 });
  let P = BLANK();
  const sync = { where: "device", ref: null, writing: false, again: false, timer: null, failing: false };
  const local = {
    ok: (() => { try { localStorage.setItem("pap.test", "1"); localStorage.removeItem("pap.test"); return true; } catch (e) { return false; } })(),
    get() { try { const v = localStorage.getItem("pap.progress"); return v ? JSON.parse(v) : null; } catch (e) { return null; } },
    set(v) { try { localStorage.setItem("pap.progress", JSON.stringify(v)); } catch (e) { /* storage blocked */ } }
  };
  const isObj = (x) => !!x && typeof x === "object" && !Array.isArray(x);
  // Accepts anything (a frozen db snapshot, damaged saved data) and returns a fresh, well-formed copy.
  function normalise(raw) {
    const b = BLANK();
    let p; try { p = JSON.parse(JSON.stringify(raw)); } catch (e) { p = null; }
    if (!isObj(p)) return b;
    const out = b;
    for (const [k, v] of Object.entries(isObj(p.done) ? p.done : {})) if (isObj(v) && typeof v.best === "number" && typeof v.total === "number") out.done[k] = v;
    for (const [k, v] of Object.entries(isObj(p.passed) ? p.passed : {})) if (isObj(v)) out.passed[k] = v;
    // Drop damaged entries and finished-markers older than 60 days. Unknown question ids are kept (another device may have a newer level).
    for (const [k, v] of Object.entries(isObj(p.review) ? p.review : {})) if (isObj(v) && typeof v.due === "string" && typeof v.need === "number") out.review[k] = v;
    const cutoff = Date.now() - 60 * 864e5;
    for (const [k, v] of Object.entries(isObj(p.cleared) ? p.cleared : {})) if (typeof v === "number" && v > cutoff) out.cleared[k] = v;
    if (isObj(p.streak) && typeof p.streak.days === "number") out.streak = { last: typeof p.streak.last === "string" ? p.streak.last : null, days: p.streak.days };
    if (isObj(p.settings)) {
