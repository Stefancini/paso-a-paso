we' form is different: -imos for -ir verbs."}, "chile": "For -er and -ir verbs, Chilean mates use -ís: *comes* becomes *comís*, *vives* becomes *vivís*."}, {"t": "learn", "title": "Handy -er and -ir verbs", "text": ["Four of each. The -er ones take the *comer* endings, the -ir ones take the *vivir* endings.", "For drinks, Latin Americans mostly say *tomar*: *¿Tomas café?* (*beber* is understood too.)"], "examples": [["comer", "to eat"], ["beber", "to drink"], ["vender", "to sell"], ["aprender", "to learn"], ["vivir", "to live"], ["escribir", "to write"], ["abrir", "to open"], ["subir", "to go up, to climb"]], "mistake": {"wrong": "Aprendo a español.", "right": "Aprendo español.", "why": "Before a thing like *español*, no *a*. (Before a verb it does take *a*: *Aprendo a cortar láminas*. That comes later.)"}}, {"t": "choice", "id": "3.2.como", "prompt": "Completa: Yo ___ en el camión. (comer)", "options": ["como", "come", "comes"], "answer": "como", "why": "*yo* takes -o: *como*.", "speak": "Yo como en el camión."}, {"t": "choice", "id": "3.2.vende", "prompt": "Completa: La tienda ___ láminas. (vender)", "options": ["vende", "venden", "vendes"], "answer": "vende", "why": "One shop is like *ella*: *vende*.", "speak": "La tienda vende láminas."}, {"t": "choice", "id": "3.2.vivimos", "prompt": "Completa: Nosotros ___ en Sídney. (vivir)", "options": ["vivimos", "vivemos", "viven"], "answer": "vivimos", "why": "-ir verbs take -imos for 'we'.", "speak": "Nosotros vivimos en Sídney."}, {"t": "choice", "id": "3.2.abren", "prompt": "Completa: Ellos ___ la puerta. (abrir)", "options": ["abren", "abrimos", "abre"], "answer": "abren", "why": "*ellos* takes -en.", "speak": "Ellos abren la puerta."}, {"t": "choice", "id": "3.2.coffee", "prompt": "What does this mean?", "es": "¿Tomas café?", "options": ["Do you drink coffee?", "Do you sell coffee?", "Do you buy coffee?"], "answer": "Do you drink coffee?", "why": "*tomar* is the everyday word for drinking in Latin America. *beber* is understood too. Sell is *vender*, buy is *comprar*.", "speak": "¿Tomas café?", "optLang": "en"}, {"t": "listen", "id": "3.2.listen", "prompt": "Escucha. Which did you hear?", "es": "Escribimos la lista.", "options": ["Escribimos la lista.", "Escriben la lista.", "Escribo la lista."], "answer": "Escribimos la lista.", "why": "*escribimos* is 'we write'."}, {"t": "build", "id": "3.2.build", "en": "They live in Chile.", "tiles": ["ellos", "viven", "en", "Chile."], "extra": ["vivimos"], "why": "*ellos* takes -en: *viven*."}, {"t": "type", "id": "3.2.learn", "prompt": "Escribe: I'm learning Spanish.", "answers": ["aprendo español", "yo aprendo español", "estoy aprendiendo español", "yo estoy aprendiendo español", "aprendo el español", "yo aprendo el español"], "why": "Spanish often uses the plain present for 'I'm learning': *aprendo*. *el español* is fine too.", "show": "Aprendo español."}, {"t": "type", "id": "3.2.sell", "prompt": "Escribe: We sell nails.", "answers": ["vendemos clavos", "nosotros vendemos clavos", "vendemos los clavos", "nosotros vendemos los clavos"], "why": "*vender* with the 'we' ending: *vendemos*.", "show": "Vendemos clavos."}, {"t": "choice", "id": "3.2.chile", "prompt": "A Chilean mate asks ¿Dónde vivís? They're asking…", "options": ["Where do you live?", "Where do they live?", "Where did you live?"], "answer": "Where do you live?", "why": "*vivís* is the Chilean mate's way of saying *vives*.", "speak": "¿Dónde vivís?", "optLang": "en"}, {"t": "say", "id": "3.2.say", "es": "Vivo en Sídney y aprendo español.", "en": "I live in Sydney and I'm learning Spanish.", "tip": "v sounds like b: vivo is BEE-boh."}]}, {"id": "3.3", "title": "Saying no", "minutes": 7, "steps": [{"t": "learn", "title": "No goes in front", "text": ["To say don't or doesn't, put *no* in front of the verb. With *me llamo*, it goes in front of *me*: *No me llamo Pedro.*", "*aquí* means here."], "examples": [["No trabajo hoy.", "I'm not working today."], ["No hablo francés.", "I don't speak French."], ["Ella no vive aquí.", "She doesn't live here."], ["No me llamo Pedro.", "My name isn't Pedro."]], "mistake": {"wrong": "Trabajo no hoy.", "right": "No trabajo hoy.", "why": "*no* goes in front of the verb."}}, {"t": "learn", "title": "No, no…", "text": ["Answering no often gives you two of them. The first one answers the question. The second one goes before the verb."], "examples": [["¿Trabajas mañana? No, no trabajo mañana.", "Are you working tomorrow? No, I'm not working tomorrow."], ["¿Necesitas ayuda? No, gracias.", "Do you need help? No, thanks."]], "mistake": {"wrong": "No, trabajo no mañana.", "right": "No, no trabajo mañana.", "why": "The second *no* still goes right before the verb."}}, {"t": "learn", "title": "How often and when", "text": ["These can go at the start or the end: *Trabajo todos los días.* *A veces como en el camión.* *siempre* also sits before the verb: *Yo siempre trabajo aquí.*"], "examples": [["todos los días", "every day"], ["a veces", "sometimes"], ["siempre", "always"], ["hoy", "today"], ["mañana", "tomorrow"]], "mistake": {"wrong": "Trabajo todos días.", "right": "Trabajo todos los días.", "why": "It's *todos los días*, with *los*."}}, {"t": "choice", "id": "3.3.no", "prompt": "Elige: I don't need the saw.", "options": ["No necesito la sierra.", "Necesito no la sierra.", "Necesito la sierra no."], "answer": "No necesito la sierra.", "why": "*no* goes in front of the verb.", "speak": "No necesito la sierra."}, {"t": "choice", "id": "3.3.answer", "prompt": "Responde: ¿Hablas francés? (say you don't)", "options": ["No, no hablo francés.", "No, hablo francés.", "No, no hablas francés."], "answer": "No, no hablo francés.", "why": "One *no* answers, one goes before *hablo*.", "speak": "No, no hablo francés."}, {"t": "choice", "id": "3.3.daily", "prompt": "What does this mean?", "es": "Trabajo todos los días.", "options": ["I work every day.", "I work some days.", "I work today."], "answer": "I work every day.", "why": "*todos los días* is every day.", "speak": "Trabajo todos los días.", "optLang": "en"}, {"t": "choice", "id": "3.3.aveces", "prompt": "Completa: ___ como en el camión. (sometimes)", "options": ["A veces", "Siempre", "Hoy"], "answer": "A veces", "why": "*a veces* is sometimes. *siempre* is always.", "speak": "A veces como en el camión."}, {"t": "listen", "id": "3.3.listen", "prompt": "Escucha. Which did you hear?", "es": "No vivimos aquí.", "options": ["No vivimos aquí.", "Vivimos aquí.", "No viven aquí."], "answer": "No vivimos aquí.", "why": "*no* first, then *vivimos* (we live)."}, {"t": "build", "id": "3.3.build", "en": "She doesn't work today.", "tiles": ["ella", "no", "trabaja", "hoy."], "extra": ["trabajo"], "why": "*ella*, then *no* right before *trabaja*."}, {"t": "type", "id": "3.3.tomorrow", "prompt": "Escribe: I'm not working tomorrow.", "answers": ["no trabajo mañana", "yo no trabajo mañana", "mañana no trabajo", "yo mañana no trabajo", "mañana yo no trabajo"], "why": "*no* before the verb: *No trabajo mañana.*", "show": "No trabajo mañana."}, {"t": "type", "id": "3.3.help", "prompt": "Responde: ¿Necesitas ayuda? (no, thanks)", "answers": ["no, gracias", "no, muchas gracias", "no, no necesito ayuda", "no, no necesito ayuda, gracias", "no necesito ayuda, gracias", "no necesito ayuda", "no, no necesito", "no, no necesito, gracias", "no, no necesito ayuda, muchas gracias", "no, muchas gracias, no necesito ayuda", "no, gracias, no necesito ayuda"], "why": "*No, gracias.* Or the full answer: *No, no necesito ayuda.*", "show": "No, gracias."}, {"t": "say", "id": "3.3.say", "es": "No, no trabajo mañana.", "en": "No, I'm not working tomorrow.", "tip": "mañana: the ñ is 'ny', mah-NYAH-nah."}]}, {"id": "3.4", "title": "Asking yes or no", "minutes": 8, "steps": [{"t": "learn", "title": "No 'do' in Spanish questions", "text": ["English adds do or does to ask a question. Spanish doesn't.", "Use the same words and lift your voice at the end."], "examples": [["¿Trabajas hoy?", "Do you work today?"], ["¿Vives aquí?", "Do you live here?"], ["¿Necesitan ayuda?", "Do you all need help?"]], "mistake": {"wrong": "¿Haces hablas inglés?", "right": "¿Hablas inglés?", "why": "Spanish has no 'do' word to add. Just ask with the verb."}}, {"t": "learn", "title": "Question marks at both ends", "text": ["Written Spanish opens a question with ¿ and closes it with ?.", "The ¿ goes where the question starts, even in the middle of a sentence: *Hola, ¿cómo estás?* The app's accent keys have ¿ too."], "mistake": {"wrong": "Vives aquí?", "right": "¿Vives aquí?", "why": "A written question starts with ¿."}}, {"t": "learn", "title": "Asking a customer", "text": ["With *usted*, use the él or ella form. Adding *usted* makes it clear you mean 'you', politely."], "examples": [["¿Habla usted inglés?", "Do you speak English?"], ["¿Vive usted aquí?", "Do you live here?"], ["¿Necesita ayuda?", "Do you need help?"]], "mistake": {"wrong": "¿Hablas usted inglés?", "right": "¿Habla usted inglés?", "why": "*usted* takes the él or ella form, with no s."}}, {"t": "choice", "id": "3.4.ask", "prompt": "Elige: Do you work here? (to a mate)", "options": ["¿Trabajas aquí?", "¿Haces trabajas aquí?", "¿Trabajo aquí?"], "answer": "¿Trabajas aquí?", "why": "There's no 'do' word in Spanish. Just ask with *trabajas*. *¿Trabajo aquí?* asks about yourself.", "speak": "¿Trabajas aquí?"}, {"t": "choice", "id": "3.4.usted", "prompt": "Elige: Do you speak English? (to a customer)", "options": ["¿Habla usted inglés?", "¿Hablas usted inglés?", "¿Hablan usted inglés?"], "answer": "¿Habla usted inglés?", "why": "*usted* takes *habla*.", "speak": "¿Habla usted inglés?"}, {"t": "choice", "id": "3.4.marks", "prompt": "Which is written correctly?", "options": ["¿Vives aquí?", "Vives aquí?", "¿Vives aquí¿"], "answer": "¿Vives aquí?", "why": "Open with ¿, close with ?.", "speak": "¿Vives aquí?"}, {"t": "listen", "id": "3.4.listen", "prompt": "Escucha. Which did you hear?", "es": "¿Necesitas ayuda?", "options": ["¿Necesitas ayuda?", "Necesito ayuda.", "¿Necesitan ayuda?"], "answer": "¿Necesitas ayuda?", "why": "*necesitas* (you need), asked with a rising voice."}, {"t": "build", "id": "3.4.build", "en": "Do you all need help?", "tiles": ["¿ustedes", "necesitan", "ayuda?"], "extra": ["necesitamos"], "why": "*ustedes* takes -an: *necesitan*."}, {"t": "type", "id": "3.4.mate", "prompt": "Pregunta (to a mate): Do you live here?", "answers": ["¿vives aquí?", "¿tú vives aquí?", "¿vives tú aquí?", "¿vives acá?", "¿tú vives acá?", "¿vivís aquí?", "¿vivís acá?", "¿vives tú acá?"], "why": "*¿Vives aquí?* No 'do', just the verb.", "show": "¿Vives aquí?"}, {"t": "type", "id": "3.4.customer", "prompt": "Pregunta (to a customer): Do you need help?", "answers": ["¿necesita ayuda?", "¿necesita usted ayuda?", "¿usted necesita ayuda?", "¿necesita ayuda usted?"], "why": "*usted* takes *necesita*.", "show": "¿Necesita ayuda?"}, {"t": "choice", "id": "3.4.answer", "prompt": "Responde: ¿Hablas español? (a little = un poco)", "options": ["Sí, hablo un poco.", "Sí, hablas un poco.", "Sí, habla un poco."], "answer": "Sí, hablo un poco.", "why": "Answer about yourself with *hablo*.", "speak": "Sí, hablo un poco."}, {"t": "say", "id": "3.4.say", "es": "¿Habla usted inglés?", "en": "Do you speak English? (to a customer)", "tip": "Lift your voice at the end, like an English question."}]}, {"id": "3.5", "title": "Question words", "minutes": 8, "steps": [{"t": "learn", "title": "What, where, when, who, how", "text": ["The question word goes first, then the verb: *¿Dónde trabajas?* *¿Qué necesitas?* A small word like *de* can sit in front of it: *¿De dónde eres?*"], "examples": [["¿Qué?", "What?"], ["¿Dónde?", "Where?"], ["¿Cuándo?", "When?"], ["¿Quién?", "Who?"], ["¿Cómo?", "How?"]], "mistake": {"wrong": "¿Donde trabajas?", "right": "¿Dónde trabajas?", "why": "Question words carry an accent mark when they ask something: *dónde*, *qué*, *cuándo*, *quién*, *cómo*."}, "say": ["¿Qué?", "¿Dónde?", "¿Cuándo?", "¿Quién?", "¿Cómo?"]}, {"t": "learn", "title": "How much, how many", "text": ["*¿Cuánto es?* How much is it?", "For how many, *cuánto* matches the thing you count: *¿Cuántos clavos?* (el clavo), *¿Cuántas láminas?* (la lámina)."], "mistake": {"wrong": "¿Cuántos láminas?", "right": "¿Cuántas láminas?", "why": "*lámina* is a la word, so *cuántas*."}, "chile": "Chileans often count money in *lucas*. One *luca* is 1,000 pesos: *Son diez lucas.* That's 10,000 pesos."}, {"t": "choice", "id": "3.5.donde", "prompt": "Completa: ¿___ vives? (where)", "options": ["Dónde", "Qué", "Cuándo"], "answer": "Dónde", "why": "*dónde* is where.", "speak": "¿Dónde vives?"}, {"t": "choice", "id": "3.5.que", "prompt": "Completa: ¿___ necesitas? (what)", "options": ["Qué", "Quién", "Dónde"], "answer": "Qué", "why": "*qué* is what. *quién* is who.", "speak": "¿Qué necesitas?"}, {"t": "choice", "id": "3.5.cuando", "prompt": "Completa: ¿___ terminan? (when)", "options": ["Cuándo", "Cómo", "Dónde"], "answer": "Cuándo", "why": "*cuándo* is when.", "speak": "¿Cuándo terminan?"}, {"t": "choice", "id": "3.5.cuantas", "prompt": "Completa: ¿___ láminas necesitas?", "options": ["Cuántas", "Cuántos", "Cuánto"], "answer": "Cuántas", "why": "*láminas* is a las word, so *cuántas*.", "speak": "¿Cuántas láminas necesitas?"}, {"t": "choice", "id": "3.5.quien", "prompt": "What does this mean?", "es": "¿Quién es el jefe?", "options": ["Who's the boss?", "Where's the boss?", "How's the boss?"], "answer": "Who's the boss?", "why": "*quién* is who.", "speak": "¿Quién es el jefe?", "optLang": "en"}, {"t": "listen", "id": "3.5.listen", "prompt": "Escucha. Which did you hear?", "es": "¿Cuánto es?", "options": ["¿Cuánto es?", "¿Cuándo es?", "¿Cómo es?"], "answer": "¿Cuánto es?", "why": "*¿Cuánto es?* asks the price. *¿Cuándo es?* asks when."}, {"t": "build", "id": "3.5.build", "en": "And you, where do you work?", "tiles": ["¿y", "tú,", "dónde", "trabajas?"], "extra": ["trabajo"], "why": "*¿Y tú, dónde trabajas?* The question word comes first, then the verb."}, {"t": "type", "id": "3.5.what", "prompt": "Pregunta (to a mate): What do you need?", "answers": ["¿qué necesitas?", "¿qué necesitas tú?", "¿tú qué necesitas?", "¿qué necesitái?"], "why": "*qué* first, then *necesitas*.", "show": "¿Qué necesitas?"}, {"t": "type", "id": "3.5.price", "prompt": "Pregunta (in a shop): How much is it?", "answers": ["¿cuánto es?", "¿cuánto cuesta?", "¿cuánto vale?", "¿cuánto es esto?", "¿cuánto cuesta esto?", "¿cuánto vale esto?", "¿cuánto es, por favor?", "¿cuánto cuesta, por favor?", "¿cuánto es eso?", "¿cuánto cuesta eso?", "¿cuánto vale eso?", "¿cuánto es esto, por favor?", "¿cuánto sale?"], "why": "*¿Cuánto es?* You'll also hear *¿Cuánto cuesta?*", "show": "¿Cuánto es?"}, {"t": "choice", "id": "3.5.chile", "prompt": "In Chile, cinco lucas is…", "options": ["5,000 pesos", "5 pesos", "500 pesos"], "answer": "5,000 pesos", "why": "One *luca* is 1,000 pesos.", "speak": "Son cinco lucas.", "optLang": "en"}, {"t": "say", "id": "3.5.say", "es": "¿Dónde vives? ¿Qué necesitas?", "en": "Where do you live? What do you need?", "tip": "Push where the accent is: DÓN-de, QUÉ."}]}, {"id": "3.6", "title": "Questions and answers", "minutes": 8, "steps": [{"t": "learn", "title": "Answer with the yo form", "text": ["Someone asks you with *tú* or *usted*. You answer with *yo*: *¿Trabajas hoy?* *Sí, trabajo hoy.*"], "examples": [["¿Vives en Sídney? Sí, vivo en Sídney.", "Do you live in Sydney? Yes, I live in Sydney."], ["¿Hablas español? Un poco.", "Do you speak Spanish? A little."]], "mistake": {"wrong": "¿Hablas inglés? Sí, hablas inglés.", "right": "¿Hablas inglés? Sí, hablo inglés.", "why": "Answer about yourself with the yo form: *hablo*."}}, {"t": "learn", "title": "Asked about the crew", "text": ["Asked with *ustedes* (you all), answer with *nosotros* (we): *¿Dónde trabajan ustedes?* *Trabajamos en Sídney.*"], "mistake": {"wrong": "¿Trabajan ustedes hoy? Sí, trabajan hoy.", "right": "¿Trabajan ustedes hoy? Sí, trabajamos hoy.", "why": "You're answering for your crew, so it's *trabajamos* (we work)."}, "chile": "In Chile a city bus is *la micro*: *Tomo la micro todos los días.* I take the bus every day."}, {"t": "choice", "id": "3.6.yes", "prompt": "Responde: ¿Trabajas mañana? (yes)", "options": ["Sí, trabajo mañana.", "Sí, trabajas mañana.", "Sí, trabaja mañana."], "answer": "Sí, trabajo mañana.", "why": "Asked with *tú*, answer with *yo*: *trabajo*.", "speak": "Sí, trabajo mañana."}, {"t": "choice", "id": "3.6.crew", "prompt": "Responde: ¿Dónde viven ustedes? (in Sydney)", "options": ["Vivimos en Sídney.", "Viven en Sídney.", "Vivo en Sídney."], "answer": "Vivimos en Sídney.", "why": "Asked with *ustedes*, answer with *nosotros*: *vivimos*.", "speak": "Vivimos en Sídney."}, {"t": "choice", "id": "3.6.match", "prompt": "Which question fits this answer: Vendo láminas.", "options": ["¿Qué vendes?", "¿Dónde vives?", "¿Cuándo llegas?"], "answer": "¿Qué vendes?", "why": "*¿Qué vendes?* What do you sell? *Vendo láminas.* I sell sheets.", "speak": "¿Qué vendes? Vendo láminas."}, {"t": "listen", "id": "3.6.listen", "prompt": "Escucha. Which did you hear?", "es": "¿Cuándo llegas?", "options": ["¿Cuándo llegas?", "¿Cuándo llegan?", "¿Cuándo llego?"], "answer": "¿Cuándo llegas?", "why": "*llegas* (you arrive) ends in -as."}, {"t": "build", "id": "3.6.build", "en": "We arrive tomorrow.", "tiles": ["nosotros", "llegamos", "mañana."], "extra": ["llegan"], "why": "*nosotros* takes -amos: *llegamos*."}, {"t": "type", "id": "3.6.where", "prompt": "Responde: ¿Dónde trabajas? (in Sydney)", "answers": ["trabajo en sídney", "yo trabajo en sídney", "en sídney", "trabajo en sydney", "yo trabajo en sydney", "en sydney"], "why": "Answer with *trabajo* (I work).", "show": "Trabajo en Sídney."}, {"t": "type", "id": "3.6.customer", "prompt": "Pregunta (to a customer): Where do you live?", "answers": ["¿dónde vive usted?", "¿dónde vive?", "¿usted dónde vive?", "¿en dónde vive usted?", "¿en dónde vive?"], "why": "*usted* takes *vive*.", "show": "¿Dónde vive usted?"}, {"t": "choice", "id": "3.6.chile", "prompt": "In Chile, la micro is…", "options": ["a city bus", "a train", "a taxi"], "answer": "a city bus", "why": "*la micro* is a city bus in Chile.", "speak": "Tomo la micro todos los días.", "optLang": "en"}, {"t": "say", "id": "3.6.say", "es": "¿Trabajas hoy? No, hoy no trabajo.", "en": "Are you working today? No, I'm not working today.", "tip": "The question goes up at the end. The answer goes down."}]}], "check": {"title": "Level 3 check", "pass": 0.8, "steps": [{"t": "choice", "id": "3.c.trabaja", "prompt": "Completa: Ella ___ en el techo. (trabajar)", "options": ["trabaja", "trabajas", "trabajo"], "answer": "trabaja", "why": "*ella* takes -a: *trabaja*.", "speak": "Ella trabaja en el techo."}, {"t": "choice", "id": "3.c.escribimos", "prompt": "Completa: Nosotros ___ la lista. (escribir)", "options": ["escribimos", "escribemos", "escriben"], "answer": "escribimos", "why": "-ir verbs take -imos for 'we'.", "speak": "Nosotros escribimos la lista."}, {"t": "choice", "id": "3.c.bebes", "prompt": "Completa: ¿Tú ___ láminas? (vender)", "options": ["vendes", "vendas", "vende"], "answer": "vendes", "why": "-er verbs take -es for *tú*.", "speak": "¿Tú vendes láminas?"}, {"t": "type", "id": "3.c.buy", "prompt": "Escribe: They buy the sheets.", "answers": ["compran las láminas", "ellos compran las láminas", "ellas compran las láminas"], "why": "*comprar* with the 'they' ending: *compran*.", "show": "Compran las láminas."}, {"t": "choice", "id": "3.c.nono", "prompt": "Responde: ¿Trabajas hoy? (say no)", "options": ["No, no trabajo.", "No, trabajo no.", "No, no trabajas."], "answer": "No, no trabajo.", "why": "One *no* answers, one goes before *trabajo*.", "speak": "No, no trabajo."}, {"t": "type", "id": "3.c.help", "prompt": "Escribe: We don't need help.", "answers": ["no necesitamos ayuda", "nosotros no necesitamos ayuda"], "why": "*no* before *necesitamos* (we need).", "show": "No necesitamos ayuda."}, {"t": "choice", "id": "3.c.daily", "prompt": "What does this mean?", "es": "Abrimos la tienda todos los días.", "options": ["We open the shop every day.", "We open the shop sometimes.", "We open the shop today."], "answer": "We open the shop every day.", "why": "*abrimos* is we open, *todos los días* is every day.", "speak": "Abrimos la tienda todos los días.", "optLang": "en"}, {"t": "choice", "id": "3.c.cuantos", "prompt": "Completa: ¿___ clavos necesitas?", "options": ["Cuántos", "Cuántas", "Cuánto"], "answer": "Cuántos", "why": "*clavos* is a los word, so *cuántos*.", "speak": "¿Cuántos clavos necesitas?"}, {"t": "type", "id": "3.c.where", "prompt": "Pregunta (to a mate): Where do you work?", "answers": ["¿dónde trabajas?", "¿dónde trabajas tú?", "¿tú dónde trabajas?", "¿en dónde trabajas?", "¿dónde trabajái?"], "why": "*dónde* first, then *trabajas*.", "show": "¿Dónde trabajas?"}, {"t": "type", "id": "3.c.english", "prompt": "Pregunta (to a customer): Do you speak English?", "answers": ["¿habla usted inglés?", "¿habla inglés?", "¿usted habla inglés?", "¿habla inglés usted?"], "why": "*usted* takes *habla*.", "show": "¿Habla usted inglés?"}, {"t": "build", "id": "3.c.build", "en": "We sell sheets and nails.", "tiles": ["nosotros", "vendemos", "láminas", "y", "clavos."], "extra": ["venden"], "why": "*nosotros* takes *vendemos*."}, {"t": "listen", "id": "3.c.listen", "prompt": "Escucha. Which did you hear?", "es": "¿Cuándo terminan?", "options": ["¿Cuándo terminan?", "¿Cuándo terminamos?", "¿Dónde terminan?"], "answer": "¿Cuándo terminan?", "why": "*cuándo* (when) and *terminan* (they finish)."}, {"t": "choice", "id": "3.c.crew", "prompt": "Responde: ¿Dónde viven ustedes? (in Chile)", "options": ["Vivimos en Chile.", "Viven en Chile.", "Vivo en Chile."], "answer": "Vivimos en Chile.", "why": "Asked with *ustedes*, answer for your crew with *vivimos*.", "speak": "Vivimos en Chile."}, {"t": "choice", "id": "3.c.quien", "prompt": "What does this mean?", "es": "¿Quién llama?", "options": ["Who's calling?", "Where are you calling?", "When are they calling?"], "answer": "Who's calling?", "why": "*quién* is who, *llama* is calls.", "speak": "¿Quién llama?", "optLang": "en"}, {"t": "choice", "id": "3.c.chile", "prompt": "A Chilean mate asks ¿Comís aquí? They mean…", "options": ["Do you eat here?", "Do we eat here?", "Did you eat here?"], "answer": "Do you eat here?", "why": "*comís* is the Chilean mate's way of saying *comes*.", "speak": "¿Comís aquí?", "optLang": "en"}]}}, "4": {"id": 4, "lessons": [{"id": "4.1", "title": "Tengo que: I have to", "minutes": 8, "steps": [{"t": "learn", "title": "Two more instruction words", "text": ["Two more Spanish words for the instructions."], "examples": [["Usa…", "Use…"], ["Termina.", "Finish the sentence."]]}, {"t": "learn", "title": "Tengo que + a verb", "text": ["*Tengo que* means 'I have to'. After it comes a verb in its dictionary form, ending in -ar, -er or -ir.", "*Tengo que trabajar.* I have to work. *Tengo que comprar clavos.* I have to buy nails."], "mistake": {"wrong": "Tengo que trabajo.", "right": "Tengo que trabajar.", "why": "Only *tengo* changes for the person. The verb after *que* stays in its dictionary form."}}, {"t": "learn", "title": "Tener, person by person", "text": ["*tener* (to have) doesn't follow the regular pattern, so learn these as blocks. *que* and the verb after it never change."], "examples": [["tengo que", "I have to"], ["tienes que", "you have to (a mate)"], ["usted tiene que", "you have to (respectful)"], ["él tiene que, ella tiene que", "he has to, she has to"], ["tenemos que", "we have to"], ["ustedes tienen que", "you all have to"], ["ellos tienen que", "they have to"]], "mistake": {"wrong": "Nosotros tienen que terminar.", "right": "Nosotros tenemos que terminar.", "why": "*nosotros* takes *tenemos*."}, "say": ["tengo", "tienes", "tiene", "tenemos", "tienen"]}, {"t": "choice", "id": "4.1.tengo", "prompt": "Completa: Yo ___ que trabajar mañana.", "options": ["tengo", "tiene", "tienes"], "answer": "tengo", "why": "*yo* takes *tengo*.", "speak": "Yo tengo que trabajar mañana."}, {"t": "choice", "id": "4.1.tenemos", "prompt": "Completa: Nosotros ___ que terminar el techo.", "options": ["tenemos", "tienen", "tengo"], "answer": "tenemos", "why": "*nosotros* takes *tenemos*.", "speak": "Nosotros tenemos que terminar el techo."}, {"t": "choice", "id": "4.1.verb", "prompt": "Completa: Tengo que ___ las láminas.", "options": ["cortar", "corto", "corta"], "answer": "cortar", "why": "After *tengo que*, the verb stays in its dictionary form: *cortar*.", "speak": "Tengo que cortar las láminas."}, {"t": "choice", "id": "4.1.meaning", "prompt": "What does this mean?", "es": "¿Tienes que trabajar hoy?", "options": ["Do you have to work today?", "Do you want to work today?", "Are you going to work today?"], "answer": "Do you have to work today?", "why": "*tienes que* is 'you have to'.", "speak": "¿Tienes que trabajar hoy?", "optLang": "en"}, {"t": "listen", "id": "4.1.listen", "prompt": "Escucha. Which did you hear?", "es": "Tienen que llamar hoy.", "options": ["Tienen que llamar hoy.", "Tenemos que llamar hoy.", "Tiene que llamar hoy."], "answer": "Tienen que llamar hoy.", "why": "*tienen* (they have to) ends in -en."}, {"t": "build", "id": "4.1.build", "en": "I have to cut the sheets.", "tiles": ["tengo", "que", "cortar", "las", "láminas."], "extra": ["corto"], "why": "*tengo que*, then the verb in its dictionary form."}, {"t": "type", "id": "4.1.work", "prompt": "Usa tengo que: I have to work tomorrow.", "answers": ["tengo que trabajar mañana", "mañana tengo que trabajar", "yo tengo que trabajar mañana", "mañana yo tengo que trabajar"], "why": "*tengo que* + *trabajar*.", "show": "Tengo que trabajar mañana."}, {"t": "type", "id": "4.1.she", "prompt": "Escribe: She has to buy nails.", "answers": ["ella tiene que comprar clavos", "tiene que comprar clavos", "ella tiene que comprar los clavos", "tiene que comprar los clavos", "ella tiene que comprar unos clavos", "tiene que comprar unos clavos"], "why": "*ella tiene que* + *comprar*.", "show": "Ella tiene que comprar clavos."}, {"t": "type", "id": "4.1.finish", "prompt": "Termina: Tengo que ___ mañana. (to work)", "answers": ["tengo que trabajar mañana", "trabajar", "trabajar mañana", "yo tengo que trabajar mañana", "mañana tengo que trabajar", "mañana yo tengo que trabajar"], "why": "After *tengo que*, the verb stays in its dictionary form: *trabajar*.", "show": "Tengo que trabajar mañana."}, {"t": "say", "id": "4.1.say", "es": "Tengo que trabajar mañana.", "en": "I have to work tomorrow.", "tip": "tengo is TEN-goh. Keep tengo que together: TEN-goh-keh."}]}, {"id": "4.2", "title": "Voy a: I'm going to", "minutes": 8, "steps": [{"t": "learn", "title": "Ir, person by person", "text": ["*ir* (to go) is short and irregular. Learn these as blocks."], "examples": [["voy", "I go, I'm going"], ["vas", "you go (a mate)"], ["usted va", "you go (respectful)"], ["él va, ella va", "he goes, she goes"], ["vamos", "we go"], ["ustedes van", "you all go"], ["ellos van", "they go"]], "mistake": {"wrong": "Yo va.", "right": "Yo voy.", "why": "*yo* takes *voy*. *va* is for usted, él and ella."}, "say": ["voy", "vas", "va", "vamos", "van"]}, {"t": "learn", "title": "Voy a + a verb: plans", "text": ["*Voy a* + a verb in its dictionary form is how you talk about plans: *Voy a trabajar.* I'm going to work.", "It works for every person: *Vamos a terminar mañana.* We're going to finish tomorrow."], "mistake": {"wrong": "Voy trabajar mañana.", "right": "Voy a trabajar mañana.", "why": "Don't drop the *a*. It's always *voy a* + the verb."}}, {"t": "learn", "title": "Voy a + a place", "text": ["With a place, *a* means 'to': *Voy a Chile.* I'm going to Chile. *Vamos a la playa.* We're going to the beach.", "*¿Adónde vas?* asks where to. Level 5 explains little words like *a*. For now, learn these as chunks."], "examples": [["Voy a Chile.", "I'm going to Chile."], ["Vamos a la playa.", "We're going to the beach."], ["¿Vas a la tienda?", "Are you going to the shop?"], ["¿Adónde vas?", "Where are you going?"]], "mistake": {"wrong": "Voy en Chile.", "right": "Voy a Chile.", "why": "With a place you go *to*, so use *a*."}, "chile": "Chileans informally call work *la pega*: *Voy a la pega.* I'm going to work."}, {"t": "choice", "id": "4.2.voy", "prompt": "Completa: Yo ___ a comprar las láminas.", "options": ["voy", "va", "vas"], "answer": "voy", "why": "*yo* takes *voy*.", "speak": "Yo voy a comprar las láminas."}, {"t": "choice", "id": "4.2.vamos", "prompt": "Completa: Nosotros ___ a terminar hoy.", "options": ["vamos", "van", "voy"], "answer": "vamos", "why": "*nosotros* takes *vamos*.", "speak": "Nosotros vamos a terminar hoy."}, {"t": "choice", "id": "4.2.a", "prompt": "Elige: I'm going to call tomorrow.", "options": ["Voy a llamar mañana.", "Voy llamar mañana.", "Voy a llamo mañana."], "answer": "Voy a llamar mañana.", "why": "*voy a* + the verb in its dictionary form.", "speak": "Voy a llamar mañana."}, {"t": "choice", "id": "4.2.place", "prompt": "Elige: We're going to the beach.", "options": ["Vamos a la playa.", "Vamos en la playa.", "Vamos la playa."], "answer": "Vamos a la playa.", "why": "Going to a place takes *a*.", "speak": "Vamos a la playa."}, {"t": "listen", "id": "4.2.listen", "prompt": "Escucha. Which did you hear?", "es": "Van a llegar mañana.", "options": ["Van a llegar mañana.", "Vamos a llegar mañana.", "Voy a llegar mañana."], "answer": "Van a llegar mañana.", "why": "*van* is 'they go' or 'you all go'. *Van a llegar* is 'they're going to arrive'."}, {"t": "build", "id": "4.2.build", "en": "They're going to finish the roof.", "tiles": ["ellos", "van", "a", "terminar", "el", "techo."], "extra": ["termina"], "why": "*ellos van a* + *terminar*."}, {"t": "type", "id": "4.2.plan", "prompt": "Usa voy a: I'm going to buy nails.", "answers": ["voy a comprar clavos", "yo voy a comprar clavos", "voy a comprar los clavos", "yo voy a comprar los clavos", "voy a comprar unos clavos", "yo voy a comprar unos clavos"], "why": "*voy a* + *comprar*.", "show": "Voy a comprar clavos."}, {"t": "type", "id": "4.2.where", "prompt": "Pregunta (to a mate): Where are you going?", "answers": ["¿adónde vas?", "¿a dónde vas?", "¿dónde vas?", "¿adónde vas tú?", "¿a dónde vas tú?", "¿tú adónde vas?", "¿tú a dónde vas?", "¿adónde vai?", "¿a dónde vai?"], "why": "*¿Adónde vas?* Where (to) are you going? *¿A dónde vas?* is the same, written as two words.", "show": "¿Adónde vas?"}, {"t": "choice", "id": "4.2.chile", "prompt": "A Chilean mate says Voy a la pega. Where are they going?", "options": ["to work", "to a party", "to the beach"], "answer": "to work", "why": "*la pega* is Chilean for work.", "speak": "Voy a la pega.", "optLang": "en"}, {"t": "say", "id": "4.2.say", "es": "Mañana voy a trabajar en el techo.", "en": "Tomorrow I'm going to work on the roof.", "tip": "voy a runs together: BOY-ah."}]}, {"id": "4.3", "title": "Quiero and necesito", "minutes": 8, "steps": [{"t": "learn", "title": "Quiero: I want", "text": ["*quiero* is 'I want'. It changes its middle for some people, so learn these as blocks. Level 6 explains why."], "examples": [["quiero", "I want"], ["quieres", "you want (a mate)"], ["usted quiere", "you want (respectful)"], ["él quiere, ella quiere", "he wants, she wants"], ["queremos", "we want"], ["ustedes quieren", "you all want"], ["ellos quieren", "they want"]], "mistake": {"wrong": "Nosotros quieremos.", "right": "Nosotros queremos.", "why": "'We' keeps the plain e: *queremos*."}, "say": ["quiero", "quieres", "quiere", "queremos", "quieren"]}, {"t": "learn", "title": "A thing or an action", "text": ["After *quiero* and *necesito* you can put a thing or an action.", "A thing: *Quiero un café.* I want a coffee. *Necesito un martillo.* I need a hammer.", "An action: the verb in its dictionary form. *Quiero comer.* I want to eat. *Necesito llamar.* I need to call."], "mistake": {"wrong": "Quiero como.", "right": "Quiero comer.", "why": "Only *quiero* changes for the person. The action stays in its dictionary form."}}, {"t": "learn", "title": "No extra word after quiero", "text": ["*voy a* and *tengo que* keep their little word. *quiero* and *necesito* have none: the verb goes straight after."], "examples": [["Quiero aprender español.", "I want to learn Spanish."], ["Necesitamos terminar hoy.", "We need to finish today."]], "mistake": {"wrong": "Quiero a aprender español.", "right": "Quiero aprender español.", "why": "No *a* between *quiero* and the verb."}}, {"t": "choice", "id": "4.3.quieres", "prompt": "Completa: ¿Tú ___ un café?", "options": ["quieres", "quiero", "queremos"], "answer": "quieres", "why": "*tú* takes *quieres*.", "speak": "¿Tú quieres un café?"}, {"t": "choice", "id": "4.3.queremos", "prompt": "Completa: Nosotros ___ terminar hoy.", "options": ["queremos", "quieremos", "quieren"], "answer": "queremos", "why": "'We' keeps the plain e: *queremos*.", "speak": "Nosotros queremos terminar hoy."}, {"t": "choice", "id": "4.3.need", "prompt": "Elige: I need to call today.", "options": ["Necesito llamar hoy.", "Necesito a llamar hoy.", "Necesito llamo hoy."], "answer": "Necesito llamar hoy.", "why": "*necesito* + the verb in its dictionary form, with no *a* between.", "speak": "Necesito llamar hoy."}, {"t": "choice", "id": "4.3.thing", "prompt": "What does this mean?", "es": "Necesito un martillo.", "options": ["I need a hammer.", "I want a hammer.", "I have a hammer."], "answer": "I need a hammer.", "why": "*necesito* is 'I need'.", "speak": "Necesito un martillo.", "optLang": "en"}, {"t": "listen", "id": "4.3.listen", "prompt": "Escucha. Which did you hear?", "es": "Quieren comer ahora.", "options": ["Quieren comer ahora.", "Queremos comer ahora.", "Quiero comer ahora."], "answer": "Quieren comer ahora.", "why": "*quieren* (they want) ends in -en. *ahora* means now."}, {"t": "build", "id": "4.3.build", "en": "I want to learn Spanish.", "tiles": ["quiero", "aprender", "español."], "extra": ["aprendo"], "why": "*quiero* + *aprender*, with nothing in between."}, {"t": "type", "id": "4.3.eat", "prompt": "Escribe: I want to eat.", "answers": ["quiero comer", "yo quiero comer"], "why": "*quiero* + *comer*.", "show": "Quiero comer."}, {"t": "type", "id": "4.3.screws", "prompt": "Usa necesito: I need ten screws.", "answers": ["necesito diez tornillos", "yo necesito diez tornillos", "necesito 10 tornillos", "yo necesito 10 tornillos"], "why": "*necesito* + the thing.", "show": "Necesito diez tornillos."}, {"t": "say", "id": "4.3.say", "es": "Quiero aprender español.", "en": "I want to learn Spanish.", "tip": "quiero is KYEH-roh, with a quick tap on the r."}]}, {"id": "4.4", "title": "A verb after the frame", "minutes": 7, "steps": [{"t": "learn", "title": "Tengo que always needs a verb", "text": ["*tengo que* is never followed by a thing. It always needs an action, a verb in its dictionary form.", "*quiero* and *necesito* can take a thing or an action. *voy a* takes a place or an action. *tengo que* only takes an action."], "mistake": {"wrong": "Tengo que el trabajo.", "right": "Tengo que trabajar.", "why": "*el trabajo* is a thing (the job). *tengo que* needs the action: *trabajar*."}}, {"t": "learn", "title": "From the thing to the action", "text": ["When you reach for a thing after *tengo que*, swap it for the verb it comes from.", "No matching verb? Put a verb you know in front of the thing: *Tengo que comprar un café.*"], "examples": [["el trabajo → trabajar", "the job → to work"], ["la llamada → llamar", "the call → to call"], ["la compra → comprar", "the purchase → to buy"], ["la comida → comer", "the food, the meal → to eat"]], "mistake": {"wrong": "Tengo que la llamada.", "right": "Tengo que llamar.", "why": "Use the action *llamar*, not the thing *la llamada*."}}, {"t": "choice", "id": "4.4.fix1", "prompt": "Fix this sentence.", "es": "Tengo que el trabajo.", "options": ["Tengo que trabajar.", "Tengo que trabajo.", "Tengo el que trabajo."], "answer": "Tengo que trabajar.", "why": "*tengo que* needs a verb in its dictionary form.", "speak": "Tengo que trabajar."}, {"t": "choice", "id": "4.4.fix2", "prompt": "Fix this sentence.", "es": "Tenemos que la comida.", "options": ["Tenemos que comer.", "Tenemos que comemos.", "Tenemos la comida que."], "answer": "Tenemos que comer.", "why": "Swap the thing (*la comida*) for the action (*comer*).", "speak": "Tenemos que comer."}, {"t": "choice", "id": "4.4.which", "prompt": "Which one is correct?", "options": ["Tengo que comprar clavos.", "Tengo que la compra.", "Tengo que compro clavos."], "answer": "Tengo que comprar clavos.", "why": "*tengo que* + *comprar*, then the thing you buy.", "speak": "Tengo que comprar clavos."}, {"t": "choice", "id": "4.4.ok", "prompt": "Which one is correct?", "options": ["Quiero un café.", "Tengo que un café.", "Tengo que café."], "answer": "Quiero un café.", "why": "*quiero* can take a thing. *tengo que* can't.", "speak": "Quiero un café."}, {"t": "listen", "id": "4.4.listen", "prompt": "Escucha. Which did you hear?", "es": "Tienes que llamar.", "options": ["Tienes que llamar.", "Tienes la llamada.", "Tienes que llegar."], "answer": "Tienes que llamar.", "why": "*llamar* (to call). *llegar* is to arrive."}, {"t": "build", "id": "4.4.build", "en": "We have to work today.", "tiles": ["tenemos", "que", "trabajar", "hoy."], "extra": ["trabajo"], "why": "*tenemos que* + *trabajar*. *trabajo* is the thing or 'I work', so it doesn't fit."}, {"t": "type", "id": "4.4.call", "prompt": "Termina: Tengo que ___. (to call)", "answers": ["tengo que llamar", "llamar", "yo tengo que llamar"], "why": "The action *llamar*, not the thing *la llamada*.", "show": "Tengo que llamar."}, {"t": "type", "id": "4.4.shop", "prompt": "Usa tengo que: I have to buy food.", "answers": ["tengo que comprar comida", "yo tengo que comprar comida", "tengo que comprar la comida", "yo tengo que comprar la comida"], "why": "*tengo que comprar*, then the thing: *comida*.", "show": "Tengo que comprar comida."}, {"t": "say", "id": "4.4.say", "es": "Tengo que llamar y tengo que comprar clavos.", "en": "I have to call and I have to buy nails.", "tip": "Hear the -ar on the end of each verb: yah-MAR, kohm-PRAR."}]}, {"id": "4.5", "title": "Days and times", "minutes": 8, "steps": [{"t": "learn", "title": "Days of the week", "text": ["Days have no capital letter. For 'on Monday' use *el lunes*. After *es* there's no *el*: *Hoy es lunes.*", "*los lunes* means every Monday."], "examples": [["lunes", "Monday"], ["martes", "Tuesday"], ["miércoles", "Wednesday"], ["jueves", "Thursday"], ["viernes", "Friday"], ["sábado", "Saturday"], ["domingo", "Sunday"]], "mistake": {"wrong": "Voy a trabajar en lunes.", "right": "Voy a trabajar el lunes.", "why": "'On Monday' is *el lunes*, with no *en*."}, "say": ["lunes", "martes", "miércoles", "jueves", "viernes", "sábado", "domingo"]}, {"t": "learn", "title": "At what time?", "text": ["*¿A qué hora?* At what time?", "*a las* + the number: *a las siete* (at seven), *a las tres* (at three).", "One o'clock is singular: *a la una*.", "Learn *a las* and *a la* as chunks for now. Level 5 explains them."], "examples": [["¿A qué hora llegas?", "What time are you arriving?"], ["A las siete.", "At seven."], ["Terminamos a la una.", "We finish at one."], ["Es la una.", "It's one o'clock."]], "mistake": {"wrong": "a las uno", "right": "a la una", "why": "It's *la una* (one o'clock), so *a la una*."}}, {"t": "learn", "title": "Plan words", "text": ["These go at the start or the end of a plan: *La próxima semana voy a Chile.*"], "examples": [["hoy", "today"], ["mañana", "tomorrow"], ["esta semana", "this week"], ["la próxima semana", "next week"], ["el fin de semana", "the weekend"]], "mistake": {"wrong": "el próximo semana", "right": "la próxima semana", "why": "*semana* is a la word, so *la próxima*."}}, {"t": "choice", "id": "4.5.friday", "prompt": "Which day is viernes?", "options": ["Friday", "Thursday", "Tuesday"], "answer": "Friday", "why": "*viernes* is Friday. Thursday is *jueves*, Tuesday is *martes*.", "speak": "viernes", "optLang": "en"}, {"t": "choice", "id": "4.5.monday", "prompt": "Elige: I'm going to work on Monday.", "options": ["Voy a trabajar el lunes.", "Voy a trabajar en lunes.", "Voy a trabajar en el Lunes."], "answer": "Voy a trabajar el lunes.", "why": "'On Monday' is *el lunes*, with a small l.", "speak": "Voy a trabajar el lunes."}, {"t": "choice", "id": "4.5.una", "prompt": "Completa: Terminamos ___ una.", "options": ["a la", "a las", "en la"], "answer": "a la", "why": "One o'clock is *la una*, so *a la una*.", "speak": "Terminamos a la una."}, {"t": "listen", "id": "4.5.listen", "prompt": "Escucha. What time?", "es": "A las siete.", "options": ["7:00", "6:00", "10:00"], "answer": "7:00", "why": "*siete* is seven. Six is *seis*, ten is *diez*.", "optLang": "en"}, {"t": "choice", "id": "4.5.next", "prompt": "What does this mean?", "es": "La próxima semana voy a Chile.", "options": ["Next week I'm going to Chile.", "This week I'm going to Chile.", "Last week I went to Chile."], "answer": "Next week I'm going to Chile.", "why": "*la próxima semana* is next week.", "speak": "La próxima semana voy a Chile.", "optLang": "en"}, {"t": "build", "id": "4.5.build", "en": "We're going to finish at seven.", "tiles": ["vamos", "a", "terminar", "a", "las", "siete."], "extra": ["la"], "why": "*vamos a terminar*, then *a las siete*."}, {"t": "type", "id": "4.5.saturday", "prompt": "Escribe: I'm not going to work on Saturday.", "answers": ["no trabajo el sábado", "yo no trabajo el sábado", "el sábado no trabajo", "no voy a trabajar el sábado", "el sábado no voy a trabajar", "yo no voy a trabajar el sábado", "el sábado yo no trabajo", "el sábado yo no voy a trabajar"], "why": "*no* before the verb, and *el sábado* for 'on Saturday'.", "show": "No voy a trabajar el sábado."}, {"t": "type", "id": "4.5.time", "prompt": "Pregunta (to a mate): What time are you arriving?", "answers": ["¿a qué hora llegas?", "¿a qué hora vas a llegar?", "¿a qué hora llegas tú?", "¿tú a qué hora llegas?", "¿a qué hora llegái?", "¿a qué hora vas a llegar tú?", "¿tú a qué hora vas a llegar?", "¿a qué hora llegái tú?"], "why": "*¿A qué hora* + *llegas?*", "show": "¿A qué hora llegas?"}, {"t": "say", "id": "4.5.say", "es": "El lunes llego a las siete.", "en": "On Monday I arrive at seven.", "tip": "lunes is LOO-nehs. siete is SYEH-teh."}]}, {"id": "4.6", "title": "Making plans together", "minutes": 8, "steps": [{"t": "learn", "title": "¿Quieres…? Inviting a mate", "text": ["*¿Quieres* + a verb? is a friendly invitation: *¿Quieres comer?* Do you want to eat?", "Saying yes: *Sí, claro.* (Yes, of course.) Saying no politely: *No, gracias, tengo que trabajar.*"], "mistake": {"wrong": "¿Quieres a comer?", "right": "¿Quieres comer?", "why": "No *a* between *quieres* and the verb."}}, {"t": "learn", "title": "Vamos a…: let's", "text": ["*Vamos a* + a verb can mean 'we're going to' or 'let's': *Vamos a comer.* Let's eat.", "*¡Vamos!* on its own means 'Let's go!'"], "examples": [["Vamos a comer.", "Let's eat."], ["Vamos a empezar.", "Let's start."], ["¡Vamos!", "Let's go!"]], "mistake": {"wrong": "Vamos comer.", "right": "Vamos a comer.", "why": "Keep the *a*: *vamos a* + the verb."}, "chile": "In Chile, *al tiro* means right away: *Voy al tiro.* I'm coming right away."}, {"t": "choice", "id": "4.6.invite", "prompt": "Elige: Do you want to eat? (to a mate)", "options": ["¿Quieres comer?", "¿Quieres a comer?", "¿Quieres comes?"], "answer": "¿Quieres comer?", "why": "*quieres* + *comer*, with nothing in between.", "speak": "¿Quieres comer?"}, {"t": "choice", "id": "4.6.no", "prompt": "Responde: ¿Quieres un café? (no, you have to work)", "options": ["No, gracias, tengo que trabajar.", "No, gracias, tengo que trabajo.", "No, gracias, tengo trabajar."], "answer": "No, gracias, tengo que trabajar.", "why": "*tengo que* + *trabajar*.", "speak": "No, gracias, tengo que trabajar."}, {"t": "choice", "id": "4.6.lets", "prompt": "What does this mean?", "es": "Vamos a empezar.", "options": ["Let's start.", "Let's finish.", "Let's eat."], "answer": "Let's start.", "why": "*empezar* is to start. Finish is *terminar*, eat is *comer*.", "speak": "Vamos a empezar.", "optLang": "en"}, {"t": "listen", "id": "4.6.listen", "prompt": "Escucha. Which did you hear?", "es": "¿Quieres ir a la playa?", "options": ["¿Quieres ir a la playa?", "¿Quieres ir a la tienda?", "¿Quieres ir a Chile?"], "answer": "¿Quieres ir a la playa?", "why": "*la playa* is the beach."}, {"t": "build", "id": "4.6.build", "en": "Do you want to go to the beach on Saturday?", "tiles": ["¿quieres", "ir", "a", "la", "playa", "el", "sábado?"], "extra": ["vas"], "why": "*¿quieres* + *ir*, then *a la playa*, then *el sábado*."}, {"t": "type", "id": "4.6.ask", "prompt": "Pregunta (to a mate): Do you want to eat?", "answers": ["¿quieres comer?", "¿tú quieres comer?", "¿quieres comer tú?", "¿quieres comer algo?", "¿querís comer?", "¿tú querís comer?"], "why": "*¿Quieres* + *comer?*", "show": "¿Quieres comer?"}, {"t": "type", "id": "4.6.yes", "prompt": "Responde: ¿Quieres ir a la playa? (yes, of course)", "answers": ["sí, claro", "claro", "claro que sí", "sí, claro que sí", "sí, quiero ir", "sí, claro, quiero ir", "dale", "sí, dale", "sí, vamos", "por supuesto", "sí, por supuesto", "claro que quiero", "sí, claro que quiero", "sí, claro, vamos", "sí, quiero"], "why": "*Sí, claro.* Yes, of course.", "show": "Sí, claro."}, {"t": "choice", "id": "4.6.chile", "prompt": "A Chilean mate says Voy al tiro. When are they coming?", "options": ["right away", "tomorrow", "next week"], "answer": "right away", "why": "*al tiro* is Chilean for right away.", "speak": "Voy al tiro.", "optLang": "en"}, {"t": "say", "id": "4.6.say", "es": "¿Quieres ir a la playa el sábado? Sí, claro.", "en": "Do you want to go to the beach on Saturday? Yes, of course.", "tip": "sábado has the push at the start: SAH-bah-doh."}]}], "check": {"title": "Level 4 check", "pass": 0.8, "steps": [{"t": "choice", "id": "4.c.tienes", "prompt": "Completa: ¿Tú ___ que trabajar el sábado?", "options": ["tienes", "tengo", "tiene"], "answer": "tienes", "why": "*tú* takes *tienes*.", "speak": "¿Tú tienes que trabajar el sábado?"}, {"t": "choice", "id": "4.c.fix", "prompt": "Fix this sentence.", "es": "Tienes que la llamada.", "options": ["Tienes que llamar.", "Tienes que llamas.", "Tienes la llamada que."], "answer": "Tienes que llamar.", "why": "*tienes que* needs the verb *llamar*, not the thing *la llamada*.", "speak": "Tienes que llamar."}, {"t": "type", "id": "4.c.cut", "prompt": "Usa tengo que: We have to cut the sheets.", "answers": ["tenemos que cortar las láminas", "nosotros tenemos que cortar las láminas", "tenemos que cortar láminas", "nosotros tenemos que cortar láminas", "tenemos que cortar unas láminas", "nosotros tenemos que cortar unas láminas"], "why": "*tenemos que* + *cortar*.", "show": "Tenemos que cortar las láminas."}, {"t": "choice", "id": "4.c.van", "prompt": "Completa: Ellos ___ a llegar a las ocho.", "options": ["van", "vamos", "va"], "answer": "van", "why": "*ellos* takes *van*.", "speak": "Ellos van a llegar a las ocho."}, {"t": "choice", "id": "4.c.va", "prompt": "Elige: She's going to cut the sheets.", "options": ["Va a cortar las láminas.", "Va cortar las láminas.", "Va a corta las láminas."], "answer": "Va a cortar las láminas.", "why": "*va a* + the verb in its dictionary form.", "speak": "Va a cortar las láminas."}, {"t": "type", "id": "4.c.chile", "prompt": "Escribe: I'm going to Chile next week.", "answers": ["voy a chile la próxima semana", "la próxima semana voy a chile", "voy a ir a chile la próxima semana", "la próxima semana voy a ir a chile", "yo voy a chile la próxima semana", "voy a chile la semana que viene", "la semana que viene voy a chile", "la próxima semana yo voy a chile", "la semana que viene yo voy a chile", "voy a ir a chile la semana que viene", "la semana que viene voy a ir a chile", "me voy a chile la próxima semana", "voy a chile la semana próxima", "me voy a chile la semana que viene"], "why": "*voy a Chile* + *la próxima semana*.", "show": "Voy a Chile la próxima semana."}, {"t": "choice", "id": "4.c.quiere", "prompt": "Completa: ¿Usted ___ un café? (querer)", "options": ["quiere", "quieres", "quiero"], "answer": "quiere", "why": "*usted* takes *quiere*.", "speak": "¿Usted quiere un café?"}, {"t": "choice", "id": "4.c.noa", "prompt": "Elige: I need to buy screws.", "options": ["Necesito comprar tornillos.", "Necesito a comprar tornillos.", "Necesito compro tornillos."], "answer": "Necesito comprar tornillos.", "why": "*necesito* + *comprar*, with no *a* between.", "speak": "Necesito comprar tornillos."}, {"t": "build", "id": "4.c.build", "en": "I want to work on the roof.", "tiles": ["quiero", "trabajar", "en", "el", "techo."], "extra": ["trabajamos"], "why": "*quiero* + *trabajar*, then *en el techo*."}, {"t": "choice", "id": "4.c.day", "prompt": "Which day is miércoles?", "options": ["Wednesday", "Monday", "Thursday"], "answer": "Wednesday", "why": "*miércoles* is Wednesday.", "speak": "miércoles", "optLang": "en"}, {"t": "choice", "id": "4.c.ocho", "prompt": "Completa: Llegamos ___ ocho.", "options": ["a las", "a la", "en las"], "answer": "a las", "why": "*a las* + the number. Only one o'clock is *a la una*.", "speak": "Llegamos a las ocho."}, {"t": "listen", "id": "4.c.listen", "prompt": "Escucha. Which did you hear?", "es": "Tenemos que llegar a las seis.", "options": ["Tenemos que llegar a las seis.", "Tienen que llegar a las seis.", "Tenemos que llamar a las seis."], "answer": "Tenemos que llegar a las seis.", "why": "*tenemos* (we have to) and *llegar* (to arrive)."}, {"t": "type", "id": "4.c.invite", "prompt": "Pregunta (to a mate): Do you want to go to the beach?", "answers": ["¿quieres ir a la playa?", "¿tú quieres ir a la playa?", "¿quieres ir a la playa tú?", "¿querís ir a la playa?", "¿tú querís ir a la playa?"], "why": "*¿Quieres* + *ir* + *a la playa?*", "show": "¿Quieres ir a la playa?"}, {"t": "choice", "id": "4.c.lets", "prompt": "What does this mean?", "es": "¡Es la una! Vamos a comer.", "options": ["It's one o'clock! Let's eat.", "It's one o'clock! I want to eat.", "It's one o'clock! Do you want to eat?"], "answer": "It's one o'clock! Let's eat.", "why": "*Vamos a* + a verb often means 'let's'.", "speak": "¡Es la una! Vamos a comer.", "optLang": "en"}, {"t": "choice", "id": "4.c.coffee", "prompt": "Elige: I want a coffee.", "options": ["Quiero un café.", "Quiero a un café.", "Tengo que un café."], "answer": "Quiero un café.", "why": "*quiero* can take a thing straight after. *tengo que* can't.", "speak": "Quiero un café."}]}}, "5": {"id": 5, "lessons": [{"id": "5.1", "title": "¿Por qué? Porque…", "minutes": 8, "steps": [{"t": "learn", "title": "Two more instruction words", "text": ["Two more Spanish words for the instructions."], "examples": [["Une.", "Join them."], ["Corrige.", "Fix it."]]}, {"t": "learn", "title": "Why? Because…", "text": ["Asking why: *¿Por qué?* Two words, with an accent on *qué*.", "Answering because: *porque*. One word, no accent."], "examples": [["¿Por qué no vas?", "Why aren't you going?"], ["Porque tengo que trabajar.", "Because I have to work."]], "mistake": {"wrong": "¿Porque trabajas hoy?", "right": "¿Por qué trabajas hoy?", "why": "The question is two words with an accent: *por qué*."}}, {"t": "learn", "title": "Porque + a full sentence", "text": ["*porque* joins two sentences. After it comes a whole sentence with its own verb.", "*No voy.* + *Tengo que trabajar.* = *No voy porque tengo que trabajar.*"], "examples": [["Estoy cansado porque trabajo mucho.", "I'm tired because I work a lot."], ["Aprendo español porque voy a Chile.", "I'm learning Spanish because I'm going to Chile."]], "mistake": {"wrong": "Estoy cansado por trabajo mucho.", "right": "Estoy cansado porque trabajo mucho.", "why": "*trabajo mucho* is a whole sentence with a verb, so use *porque*."}}, {"t": "choice", "id": "5.1.question", "prompt": "Completa: ¿___ estás cansado?", "options": ["Por qué", "Porque", "Por"], "answer": "Por qué", "why": "Asking why is *¿Por qué?*, two words with an accent.", "speak": "¿Por qué estás cansado?"}, {"t": "choice", "id": "5.1.answer", "prompt": "Completa: Estoy cansado ___ trabajo mucho.", "options": ["porque", "por qué", "por"], "answer": "porque", "why": "Because + a sentence is *porque*, one word.", "speak": "Estoy cansado porque trabajo mucho."}, {"t": "choice", "id": "5.1.join", "prompt": "Une: No voy. Tengo que trabajar.", "options": ["No voy porque tengo que trabajar.", "No voy por qué tengo que trabajar.", "No voy por tengo que trabajar."], "answer": "No voy porque tengo que trabajar.", "why": "*porque* joins the two sentences.", "speak": "No voy porque tengo que trabajar."}, {"t": "choice", "id": "5.1.meaning", "prompt": "What does this mean?", "es": "¿Por qué aprendes español?", "options": ["Why are you learning Spanish?", "Where are you learning Spanish?", "When are you learning Spanish?"], "answer": "Why are you learning Spanish?", "why": "*por qué* is why.", "speak": "¿Por qué aprendes español?", "optLang": "en"}, {"t": "listen", "id": "5.1.listen", "prompt": "Escucha. Which did you hear?", "es": "Porque voy a Chile.", "options": ["Porque voy a Chile.", "¿Por qué vas a Chile?", "Porque vamos a Chile."], "answer": "Porque voy a Chile.", "why": "*voy* (I'm going), not *vas* or *vamos*."}, {"t": "build", "id": "5.1.build", "en": "I'm learning Spanish because I'm going to Chile.", "tiles": ["aprendo", "español", "porque", "voy", "a", "Chile."], "extra": ["de"], "why": "*porque* + a full sentence: *voy a Chile*."}, {"t": "type", "id": "5.1.why", "prompt": "Pregunta (to a mate): Why are you tired?", "answers": ["¿por qué estás cansado?", "¿por qué estás cansada?", "¿por qué estás tan cansado?", "¿por qué estás tan cansada?", "¿por qué estái cansado?", "¿por qué estái cansada?", "¿por qué tú estás cansado?", "¿por qué tú estás cansada?", "¿por qué estás cansado tú?", "¿por qué estás cansada tú?", "¿por qué estás cansado hoy?", "¿por qué estás cansada hoy?", "¿por qué estai cansado?", "¿por qué estai cansada?"], "why": "*¿Por qué* + *estás cansado?*", "show": "¿Por qué estás cansado?"}, {"t": "type", "id": "5.1.because", "prompt": "Une: Estoy cansado. Trabajo mucho.", "answers": ["estoy cansado porque trabajo mucho", "estoy cansada porque trabajo mucho", "yo estoy cansado porque trabajo mucho", "yo estoy cansada porque trabajo mucho", "estoy cansado porque yo trabajo mucho", "estoy cansada porque yo trabajo mucho", "porque trabajo mucho estoy cansado", "porque trabajo mucho estoy cansada"], "why": "*porque* goes between the two sentences.", "show": "Estoy cansado porque trabajo mucho."}, {"t": "say", "id": "5.1.say", "es": "¿Por qué aprendes español? Porque voy a Chile.", "en": "Why are you learning Spanish? Because I'm going to Chile.", "tip": "Hear the push: por qué stresses the end, por-KEH, and asks why. porque is said quickly, POR-keh, and means because. Your voice also goes up for the question."}]}, {"id": "5.2", "title": "Por or porque?", "minutes": 8, "steps": [{"t": "learn", "title": "Por + a thing", "text": ["When you give a reason, *por* + a thing means 'because of': *No voy por la lluvia.* I'm not going because of the rain.", "*por* also means 'for' after *gracias*: *Gracias por la ayuda.* Thanks for the help."], "examples": [["No voy por la lluvia.", "I'm not going because of the rain."], ["Llego tarde por el trabajo.", "I'm late because of work."], ["Gracias por la ayuda.", "Thanks for the help."]], "mistake": {"wrong": "No voy porque la lluvia.", "right": "No voy por la lluvia.", "why": "*la lluvia* is a thing, with no verb. A thing takes *por*."}}, {"t": "learn", "title": "The quick test: is there a verb?", "text": ["When you give a reason, look at what comes next.", "A verb, a whole sentence: *porque*. *No voy porque llueve.* (*llueve* = it's raining)", "Just a thing: *por*. *No voy por la lluvia.*", "Later you'll also see *por* + a verb's dictionary form (*Gracias por ayudar*). For now: a verb that changes for the person (*llueve*, *trabajo*) means *porque*."], "mistake": {"wrong": "No trabajo hoy porque el viento.", "right": "No trabajo hoy por el viento.", "why": "*el viento* (the wind) is a thing, so *por*. With a verb after it, you'd use *porque*."}}, {"t": "choice", "id": "5.2.rain", "prompt": "Completa: No trabajamos ___ la lluvia.", "options": ["por", "porque", "por qué"], "answer": "por", "why": "*la lluvia* is a thing with no verb, so *por*.", "speak": "No trabajamos por la lluvia."}, {"t": "choice", "id": "5.2.verb", "prompt": "Completa: No trabajamos ___ llueve.", "options": ["porque", "por", "por qué"], "answer": "porque", "why": "*llueve* is a verb, so *porque*.", "speak": "No trabajamos porque llueve."}, {"t": "choice", "id": "5.2.fix", "prompt": "Corrige: No voy porque el trabajo.", "options": ["No voy por el trabajo.", "No voy por qué el trabajo.", "No voy porque trabajo el."], "answer": "No voy por el trabajo.", "why": "*el trabajo* is a thing, so *por*.", "speak": "No voy por el trabajo."}, {"t": "choice", "id": "5.2.thanks", "prompt": "Completa: Gracias ___ la ayuda.", "options": ["por", "porque", "por qué"], "answer": "por", "why": "*gracias por* + the thing.", "speak": "Gracias por la ayuda."}, {"t": "listen", "id": "5.2.listen", "prompt": "Escucha. Which did you hear?", "es": "Llego tarde por el trabajo.", "options": ["Llego tarde por el trabajo.", "Llego tarde porque trabajo.", "Llego tarde por la lluvia."], "answer": "Llego tarde por el trabajo.", "why": "*por el trabajo*, because of work."}, {"t": "build", "id": "5.2.build", "en": "We're not working because of the rain.", "tiles": ["no", "trabajamos", "por", "la", "lluvia."], "extra": ["porque"], "why": "*la lluvia* is a thing, so *por*."}, {"t": "type", "id": "5.2.fixtype", "prompt": "Corrige: No voy porque la lluvia.", "answers": ["no voy por la lluvia", "no voy porque llueve", "no voy porque está lloviendo", "yo no voy por la lluvia", "no voy porque llueve mucho", "no voy porque va a llover"], "why": "With just a thing, use *por*: *No voy por la lluvia.*", "show": "No voy por la lluvia."}, {"t": "type", "id": "5.2.coffee", "prompt": "Escribe: Thanks for the coffee.", "answers": ["gracias por el café", "muchas gracias por el café", "mil gracias por el café", "gracias por el café, amigo"], "why": "*gracias por* + the thing.", "show": "Gracias por el café."}, {"t": "say", "id": "5.2.say", "es": "No trabajamos por la lluvia.", "en": "We're not working because of the rain.", "tip": "lluvia is YOO-byah: ll sounds like y, v like b."}]}, {"id": "5.3", "title": "Me gusta", "minutes": 8, "steps": [{"t": "learn", "title": "Me gusta: I like", "text": ["Spanish says 'it pleases me' instead of 'I like it'. *Me gusta el café.* I like coffee.", "It works with an action too: *Me gusta trabajar al aire libre.* I like working outdoors."], "examples": [["Me gusta el café.", "I like coffee."], ["Me gusta la playa.", "I like the beach."], ["Me gusta trabajar.", "I like working."]], "mistake": {"wrong": "Yo gusto el café.", "right": "Me gusta el café.", "why": "Start with *me*. The coffee is what does the pleasing, so the verb is *gusta*."}}, {"t": "learn", "title": "No me gusta", "text": ["For 'I don't like', put *no* at the very front: *No me gusta el frío.* I don't like the cold."], "examples": [["No me gusta el frío.", "I don't like the cold."], ["No me gusta la lluvia.", "I don't like the rain."]], "mistake": {"wrong": "Me no gusta el frío.", "right": "No me gusta el frío.", "why": "*no* goes in front of *me*."}, "chile": "In Chile, *harto* often means a lot: *Me gusta harto.* I like it a lot."}, {"t": "learn", "title": "¿Te gusta? Asking a mate", "text": ["Asking a mate: *¿Te gusta…?* Do you like…?", "Answer with *me*: *Sí, me gusta mucho.* Yes, I like it a lot."], "examples": [["¿Te gusta el café?", "Do you like coffee?"], ["Sí, me gusta mucho.", "Yes, I like it a lot."]], "mistake": {"wrong": "¿Tú gustas el café?", "right": "¿Te gusta el café?", "why": "Ask with *te*, and the coffee does the pleasing, so *gusta*."}}, {"t": "choice", "id": "5.3.like", "prompt": "Elige: I like the beach.", "options": ["Me gusta la playa.", "Yo gusto la playa.", "Me gusto la playa."], "answer": "Me gusta la playa.", "why": "*me gusta* + the thing.", "speak": "Me gusta la playa."}, {"t": "choice", "id": "5.3.no", "prompt": "Elige: I don't like the cold.", "options": ["No me gusta el frío.", "Me no gusta el frío.", "Me gusta no el frío."], "answer": "No me gusta el frío.", "why": "*no* goes at the very front.", "speak": "No me gusta el frío."}, {"t": "choice", "id": "5.3.te", "prompt": "Completa: ¿___ gusta el café? (you, a mate)", "options": ["Te", "Tú", "Me"], "answer": "Te", "why": "Asking a mate is *¿Te gusta…?*", "speak": "¿Te gusta el café?"}, {"t": "choice", "id": "5.3.meaning", "prompt": "What does this mean?", "es": "Me gusta trabajar al aire libre.", "options": ["I like working outdoors.", "I have to work outdoors.", "I want to work outdoors."], "answer": "I like working outdoors.", "why": "*me gusta* + an action: I like doing it. *al aire libre* is outdoors.", "speak": "Me gusta trabajar al aire libre.", "optLang": "en"}, {"t": "listen", "id": "5.3.listen", "prompt": "Escucha. Which did you hear?", "es": "No me gusta el frío.", "options": ["No me gusta el frío.", "Me gusta el frío.", "No me gusta el café."], "answer": "No me gusta el frío.", "why": "*No* at the front, then *el frío* (the cold)."}, {"t": "build", "id": "5.3.build", "en": "I like working on the roof.", "tiles": ["me", "gusta", "trabajar", "en", "el", "techo."], "extra": ["gusto"], "why": "*me gusta* + the action *trabajar*."}, {"t": "type", "id": "5.3.coffee", "prompt": "Escribe: I like coffee.", "answers": ["me gusta el café", "a mí me gusta el café", "me gusta mucho el café", "me gusta el café mucho", "a mí me gusta mucho el café", "a mí me gusta el café mucho", "el café me gusta", "a mí el café me gusta"], "why": "*me gusta* + *el café*. Spanish keeps the *el*.", "show": "Me gusta el café."}, {"t": "type", "id": "5.3.ask", "prompt": "Pregunta (to a mate): Do you like the beach?", "answers": ["¿te gusta la playa?", "¿a ti te gusta la playa?", "¿te gusta la playa a ti?", "¿te gusta mucho la playa?", "¿a ti te gusta mucho la playa?", "¿y a ti te gusta la playa?", "¿la playa te gusta?", "¿a ti la playa te gusta?"], "why": "*¿Te gusta* + *la playa?*", "show": "¿Te gusta la playa?"}, {"t": "say", "id": "5.3.say", "es": "Me gusta el café, pero no me gusta el frío.", "en": "I like coffee, but I don't like the cold.", "tip": "gusta is GOOS-tah. frío has the push on the í: FREE-oh."}]}, {"id": "5.4", "title": "Me gustan, te gusta, le gusta", "minutes": 8, "steps": [{"t": "learn", "title": "More than one: gustan", "text": ["The verb matches the thing you like. One thing: *gusta*. More than one: *gustan*.", "With actions it stays *gusta*, even with two of them: *Me gusta trabajar y aprender.*"], "examples": [["Me gusta el perro.", "I like the dog."], ["Me gustan los perros.", "I like dogs."], ["Me gustan las playas de Chile.", "I like Chile's beaches."]], "mistake": {"wrong": "Me gusta los perros.", "right": "Me gustan los perros.", "why": "*los perros* is more than one, so *gustan*."}}, {"t": "learn", "title": "Who likes it", "text": ["The little word in front says who likes it. *gusta* or *gustan* only changes for the thing.", "Add *a él*, *a ella* or *a usted* to make *le* clear: *A ella le gusta el fútbol.*"], "examples": [["me gusta", "I like"], ["te gusta", "you like (a mate)"], ["le gusta", "he likes, she likes, you like (usted)"], ["nos gusta", "we like"], ["les gusta", "they like, you all like"]], "mistake": {"wrong": "¿Tú gusta el fútbol?", "right": "¿Te gusta el fútbol?", "why": "Use *te*, not *tú*, with *gusta*."}, "say": ["me gusta", "te gusta", "le gusta", "nos gusta", "les gusta"]}, {"t": "choice", "id": "5.4.gustan", "prompt": "Completa: Me ___ los perros.", "options": ["gustan", "gusta", "gusto"], "answer": "gustan", "why": "*los perros* is more than one, so *gustan*.", "speak": "Me gustan los perros."}, {"t": "choice", "id": "5.4.nos", "prompt": "Completa: ___ gusta trabajar aquí. (we)", "options": ["Nos", "Nosotros", "Les"], "answer": "Nos", "why": "'We like' is *nos gusta*.", "speak": "Nos gusta trabajar aquí."}, {"t": "choice", "id": "5.4.le", "prompt": "Elige: She likes soccer. (soccer = fútbol)", "options": ["Le gusta el fútbol.", "Ella gusta el fútbol.", "Le gustan el fútbol."], "answer": "Le gusta el fútbol.", "why": "'She likes' is *le gusta*, and one thing takes *gusta*.", "speak": "Le gusta el fútbol."}, {"t": "choice", "id": "5.4.les", "prompt": "What does this mean?", "es": "No les gustan las reuniones.", "options": ["They don't like meetings.", "We don't like meetings.", "I don't like meetings."], "answer": "They don't like meetings.", "why": "*les* is they. *las reuniones* is more than one, so *gustan*.", "speak": "No les gustan las reuniones.", "optLang": "en"}, {"t": "listen", "id": "5.4.listen", "prompt": "Escucha. Which did you hear?", "es": "Nos gustan las playas.", "options": ["Nos gustan las playas.", "Nos gusta la playa.", "Les gustan las playas."], "answer": "Nos gustan las playas.", "why": "*nos* (we), and *gustan* for more than one beach."}, {"t": "build", "id": "5.4.build", "en": "Do you like dogs? (to a mate)", "tiles": ["¿te", "gustan", "los", "perros?"], "extra": ["gusta"], "why": "*los perros* is more than one, so *gustan*."}, {"t": "type", "id": "5.4.dogs", "prompt": "Escribe: I like dogs.", "answers": ["me gustan los perros", "a mí me gustan los perros", "me gustan mucho los perros", "a mí me gustan mucho los perros", "me gustan los perros mucho", "los perros me gustan"], "why": "*los perros*, more than one, so *me gustan*. Spanish keeps the *los*.", "show": "Me gustan los perros."}, {"t": "type", "id": "5.4.customer", "prompt": "Pregunta (to a customer): Do you like the colour?", "answers": ["¿le gusta el color?", "¿a usted le gusta el color?", "¿le gusta el color a usted?", "¿le gusta mucho el color?", "¿a usted le gusta mucho el color?", "¿y a usted le gusta el color?", "¿el color le gusta?"], "why": "*usted* takes *le*: *¿Le gusta el color?*", "show": "¿Le gusta el color?"}, {"t": "say", "id": "5.4.say", "es": "Me gustan los perros. ¿Te gustan los gatos?", "en": "I like dogs. Do you like cats?", "tip": "perros has a rolled rr: PEH-rrohs."}]}, {"id": "5.5", "title": "A and de", "minutes": 8, "steps": [{"t": "learn", "title": "No 's in Spanish: use de", "text": ["Spanish has no 's. 'My boss's keys' becomes 'the keys of my boss': *las llaves de mi jefe*.", "(*de* also means from: *Soy de Australia.*)"], "examples": [["la casa de mi hermana", "my sister's house"], ["el teléfono de {name}", "{name}'s phone"], ["las llaves de mi jefe", "my boss's keys"]], "mistake": {"wrong": "el {name} teléfono", "right": "el teléfono de {name}", "why": "The thing comes first, then *de* + the owner."}}, {"t": "learn", "title": "a + el = al, de + el = del", "text": ["Two words always join up: *a* + *el* becomes *al*, *de* + *el* becomes *del*.", "They don't join with *la*, *los* or *las*: *a la playa*, *de la casa*. And not with *él* (he): *la casa de él*."], "examples": [["Voy al trabajo.", "I'm going to work."], ["Llamo al jefe.", "I'm calling the boss."], ["Es la casa del jefe.", "It's the boss's house."]], "mistake": {"wrong": "Voy a el trabajo.", "right": "Voy al trabajo.", "why": "*a* + *el* always becomes *al*."}}, {"t": "learn", "title": "An a before people", "text": ["When the person you call, see or help is the one the action happens to, put *a* in front of them: *Llamo a mi hermana.* *Ayudo al jefe.*", "Not for things: *Veo el camión.* Not for someone you don't know yet: *Necesito un ayudante.* And not after *tengo*: *Tengo una hermana.*"], "mistake": {"wrong": "Llamo mi hermana.", "right": "Llamo a mi hermana.", "why": "Your sister is a person, so put *a* in front."}, "examples": [["Veo a mi jefe.", "I see my boss."], ["Llamo a mi hermana.", "I'm calling my sister."]]}, {"t": "choice", "id": "5.5.al", "prompt": "Completa: Voy ___ trabajo.", "options": ["al", "a el", "a la"], "answer": "al", "why": "*a* + *el* becomes *al*.", "speak": "Voy al trabajo."}, {"t": "choice", "id": "5.5.del", "prompt": "Elige: the truck's key", "options": ["la llave del camión", "la llave de el camión", "el camión llave"], "answer": "la llave del camión", "why": "The thing first, then *del* (*de* + *el*) + the owner.", "speak": "la llave del camión"}, {"t": "choice", "id": "5.5.ala", "prompt": "Completa: Vamos ___ playa.", "options": ["a la", "al", "a el"], "answer": "a la", "why": "*a* only joins with *el*. With *la* it stays *a la*.", "speak": "Vamos a la playa."}, {"t": "choice", "id": "5.5.person", "prompt": "Elige: I'm calling my sister.", "options": ["Llamo a mi hermana.", "Llamo mi hermana.", "Llamo de mi hermana."], "answer": "Llamo a mi hermana.", "why": "A person gets *a* in front.", "speak": "Llamo a mi hermana."}, {"t": "listen", "id": "5.5.listen", "prompt": "Escucha. Which did you hear?", "es": "Es la casa del jefe.", "options": ["Es la casa del jefe.", "Es la casa de la jefa.", "Es el camión del jefe."], "answer": "Es la casa del jefe.", "why": "*la casa del jefe*, the boss's house."}, {"t": "build", "id": "5.5.build", "en": "I'm going to call the boss.", "tiles": ["voy", "a", "llamar", "al", "jefe."], "extra": ["el"], "why": "*voy a llamar*, then *al jefe* (*a* + *el*)."}, {"t": "type", "id": "5.5.phone", "prompt": "Escribe: my sister's phone", "answers": ["el teléfono de mi hermana", "el celular de mi hermana", "el móvil de mi hermana", "el teléfono celular de mi hermana", "teléfono de mi hermana", "celular de mi hermana"], "why": "The thing first, then *de* + the owner. A mobile is *el celular* in Latin America.", "show": "El teléfono de mi hermana."}, {"t": "type", "id": "5.5.work", "prompt": "Escribe: I'm going to work. (the place)", "answers": ["voy al trabajo", "yo voy al trabajo", "me voy al trabajo", "voy a la pega", "voy a mi trabajo"], "why": "*a* + *el trabajo* becomes *al trabajo*.", "show": "Voy al trabajo."}, {"t": "say", "id": "5.5.say", "es": "Voy al trabajo en el camión del jefe.", "en": "I'm going to work in the boss's truck.", "tip": "al and del run into the next word: ahl-trah-BAH-hoh, dehl-kah-MYOHN."}]}, {"id": "5.6", "title": "En and con", "minutes": 7, "steps": [{"t": "learn", "title": "Con and sin: with and without", "text": ["*con* means with: *café con leche* (coffee with milk), *Trabajo con mi hermano.* (I work with my brother.)", "*sin* means without: *café sin azúcar*."], "examples": [["café con leche", "coffee with milk"], ["Trabajo con mi hermano.", "I work with my brother."], ["café sin azúcar", "coffee without sugar"]], "mistake": {"wrong": "café de leche", "right": "café con leche", "why": "With milk is *con leche*."}, "chile": "In Chile, *once* is also a light meal in the late afternoon or evening, with tea or coffee and bread: *Vamos a tomar once.* Let's have once (afternoon tea and snacks). In most places *once* is just the number eleven."}, {"t": "learn", "title": "Conmigo, contigo", "text": ["With me and with you (a mate) are one word each: *conmigo*, *contigo*. With *usted* it's *con usted*.", "*¿Vas conmigo?* Are you going with me? *Sí, voy contigo.* Yes, I'm going with you."], "mistake": {"wrong": "con mí", "right": "conmigo", "why": "With me is always *conmigo*, one word."}}, {"t": "learn", "title": "En: in, on, at", "text": ["*en* covers in, on and at: *en el camión* (in the truck), *en el techo* (on the roof), *en el trabajo* (at work).", "Going *to* a place takes *a*. Being *at* a place takes *en*. (*en* also covers going *by* something: *Voy en el camión.*)"], "examples": [["Estoy en el trabajo.", "I'm at work."], ["Voy al trabajo.", "I'm going to work."]], "mistake": {"wrong": "Estoy al trabajo.", "right": "Estoy en el trabajo.", "why": "Being somewhere takes *en*. *al* is for going to a place."}}, {"t": "choice", "id": "5.6.con", "prompt": "Elige: coffee with milk", "options": ["café con leche", "café de leche", "café en leche"], "answer": "café con leche", "why": "With is *con*.", "speak": "café con leche"}, {"t": "choice", "id": "5.6.conmigo", "prompt": "Completa: ¿Vas ___? (with me)", "options": ["conmigo", "con mí", "con yo"], "answer": "conmigo", "why": "With me is *conmigo*.", "speak": "¿Vas conmigo?"}, {"t": "choice", "id": "5.6.en", "prompt": "Completa: Estoy ___ el techo.", "options": ["en", "a", "de"], "answer": "en", "why": "Being on the roof takes *en*.", "speak": "Estoy en el techo."}, {"t": "choice", "id": "5.6.sin", "prompt": "What does this mean?", "es": "Un café sin azúcar, por favor.", "options": ["A coffee without sugar, please.", "A coffee with sugar, please.", "A coffee with milk, please."], "answer": "A coffee without sugar, please.", "why": "*sin* is without.", "speak": "Un café sin azúcar, por favor.", "optLang": "en"}, {"t": "listen", "id": "5.6.listen", "prompt": "Escucha. Which did you hear?", "es": "Trabajo con mi hermano.", "options": ["Trabajo con mi hermano.", "Trabajo sin mi hermano.", "Trabajo con mi hermana."], "answer": "Trabajo con mi hermano.", "why": "*con mi hermano*, with my brother."}, {"t": "build", "id": "5.6.build", "en": "I'm going to the beach with you.", "tiles": ["voy", "a", "la", "playa", "contigo."], "extra": ["con"], "why": "*a la playa*, then *contigo*, one word."}, {"t": "type", "id": "5.6.coffee", "prompt": "Escribe (ordering): A coffee with milk, please.", "answers": ["un café con leche, por favor", "café con leche, por favor", "por favor, un café con leche", "un café con leche por favor", "quiero un café con leche, por favor", "me da un café con leche, por favor", "quisiera un café con leche, por favor", "me das un café con leche, por favor", "me puede dar un café con leche, por favor", "deme un café con leche, por favor"], "why": "*un café con leche, por favor*.", "show": "Un café con leche, por favor."}, {"t": "type", "id": "5.6.come", "prompt": "Pregunta (to a mate): Are you going with me?", "answers": ["¿vas conmigo?", "¿tú vas conmigo?", "¿vas tú conmigo?", "¿vienes conmigo?", "¿venís conmigo?", "¿vas a ir conmigo?", "¿vas conmigo o no?", "¿quieres ir conmigo?", "¿vas a venir conmigo?", "¿quieres venir conmigo?", "¿vienes tú conmigo?"], "why": "*¿Vas* + *conmigo?*", "show": "¿Vas conmigo?"}, {"t": "choice", "id": "5.6.chile", "prompt": "In Chile, Vamos a tomar once means…", "options": ["Let's have a light afternoon meal.", "Let's meet at eleven.", "Let's have eleven drinks."], "answer": "Let's have a light afternoon meal.", "why": "In Chile, *once* is a light meal in the late afternoon or evening.", "speak": "Vamos a tomar once.", "optLang": "en"}, {"t": "say", "id": "5.6.say", "es": "Un café con leche, por favor. ¿Vas conmigo?", "en": "A coffee with milk, please. Are you going with me?", "tip": "leche is LEH-cheh, with an English ch."}]}], "check": {"title": "Level 5 check", "pass": 0.8, "steps": [{"t": "choice", "id": "5.c.porque", "prompt": "Completa: Estoy contento ___ voy a Chile.", "options": ["porque", "por", "por qué"], "answer": "porque", "why": "A whole sentence follows, so *porque*.", "speak": "Estoy contento porque voy a Chile."}, {"t": "choice", "id": "5.c.por", "prompt": "Completa: Gracias ___ el martillo.", "options": ["por", "porque", "por qué"], "answer": "por", "why": "*gracias por* + the thing.", "speak": "Gracias por el martillo."}, {"t": "type", "id": "5.c.fix", "prompt": "Corrige: Llego tarde porque el trabajo.", "answers": ["llego tarde por el trabajo", "llego tarde porque trabajo", "llego tarde por mi trabajo", "yo llego tarde por el trabajo", "llego tarde porque tengo que trabajar", "llego tarde porque tengo trabajo"], "why": "*el trabajo* is a thing, so *por*.", "show": "Llego tarde por el trabajo."}, {"t": "type", "id": "5.c.why", "prompt": "Pregunta (to a mate): Why are you learning Spanish?", "answers": ["¿por qué aprendes español?", "¿por qué estás aprendiendo español?", "¿tú por qué aprendes español?", "¿por qué aprendís español?", "¿por qué tú aprendes español?", "¿por qué aprendes tú español?", "¿por qué estudias español?"], "why": "*¿Por qué* + *aprendes español?*", "show": "¿Por qué aprendes español?"}, {"t": "choice", "id": "5.c.le", "prompt": "Elige: He likes the beach.", "options": ["Le gusta la playa.", "Él gusta la playa.", "Le gustan la playa."], "answer": "Le gusta la playa.", "why": "'He likes' is *le gusta*, and one beach takes *gusta*.", "speak": "Le gusta la playa."}, {"t": "choice", "id": "5.c.gustan", "prompt": "Completa: ¿Te ___ los gatos?", "options": ["gustan", "gusta", "gustas"], "answer": "gustan", "why": "*los gatos* is more than one, so *gustan*.", "speak": "¿Te gustan los gatos?"}, {"t": "choice", "id": "5.c.no", "prompt": "Elige: We don't like working here.", "options": ["No nos gusta trabajar aquí.", "Nos no gusta trabajar aquí.", "No nosotros gusta trabajar aquí."], "answer": "No nos gusta trabajar aquí.", "why": "*no* at the very front, then *nos gusta* + the action.", "speak": "No nos gusta trabajar aquí."}, {"t": "type", "id": "5.c.call", "prompt": "Escribe: I'm calling my brother.", "answers": ["llamo a mi hermano", "yo llamo a mi hermano", "estoy llamando a mi hermano", "yo estoy llamando a mi hermano"], "why": "A person gets *a* in front: *Llamo a mi hermano.*", "show": "Llamo a mi hermano."}, {"t": "choice", "id": "5.c.al", "prompt": "Completa: Llamo ___ jefe.", "options": ["al", "a el", "el"], "answer": "al", "why": "A person gets *a*, and *a* + *el* becomes *al*.", "speak": "Llamo al jefe."}, {"t": "choice", "id": "5.c.de", "prompt": "Elige: my brother's truck", "options": ["el camión de mi hermano", "mi hermano camión", "el camión a mi hermano"], "answer": "el camión de mi hermano", "why": "The thing first, then *de* + the owner.", "speak": "el camión de mi hermano"}, {"t": "build", "id": "5.c.build", "en": "The keys are in the boss's truck.", "tiles": ["las", "llaves", "están", "en", "el", "camión", "del", "jefe."], "extra": ["de"], "why": "*en el camión*, then *del jefe* (*de* + *el*)."}, {"t": "choice", "id": "5.c.contigo", "prompt": "Completa: Sí, voy ___. (with you, a mate)", "options": ["contigo", "con tú", "con te"], "answer": "contigo", "why": "With you (a mate) is *contigo*.", "speak": "Sí, voy contigo."}, {"t": "choice", "id": "5.c.en", "prompt": "Completa: Mi hermano está ___ el trabajo.", "options": ["en", "al", "a"], "answer": "en", "why": "Being somewhere takes *en*.", "speak": "Mi hermano está en el trabajo."}, {"t": "listen", "id": "5.c.listen", "prompt": "Escucha. Which did you hear?", "es": "Un café sin azúcar, por favor.", "options": ["Un café sin azúcar, por favor.", "Un café con azúcar, por favor.", "Un café con leche, por favor."], "answer": "Un café sin azúcar, por favor.", "why": "*sin azúcar*, without sugar."}, {"t": "choice", "id": "5.c.harto", "prompt": "A Chilean says Me gusta harto. They like it…", "options": ["a lot", "a little", "not at all"], "answer": "a lot", "why": "In Chile, *harto* often means a lot.", "speak": "Me gusta harto.", "optLang": "en"}]}}, "6": {"id": 6, "lessons": [{"id": "6.1", "title": "e becomes ie: empiezo, cierro", "minutes": 9, "steps": [{"t": "learn", "title": "One more instruction word", "text": ["One more Spanish word for the instructions. You'll see it as *Cambia a yo* (change it to I) or *Cambia a nosotros* (change it to we)."], "examples": [["Cambia.", "Change it."]]}, {"t": "learn", "title": "Some verbs change their middle", "text": ["In some verbs the e in the middle becomes ie when the push lands on it: *empezar* (to start) becomes *empiezo* (I start).", "You a
