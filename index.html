    const fill = el("span"); fill.style.width = `${((run.i + 1) / run.steps.length) * 100}%`; prog.appendChild(fill);
    add(bar, quit, prog, el("span", "count", `${run.i + 1}/${run.steps.length}`));
    box.appendChild(bar);
    if (run.confirmQuit) {
      const q = el("div", "notice confirm");
      const lv = el("button", "btn small", "Leave"); lv.id = "leave-yes"; lv.addEventListener("click", () => { run.confirmQuit = false; go({ name: "home" }); });
      const st = el("button", "btn small primary", "Stay"); st.id = "leave-no"; st.addEventListener("click", () => { run.confirmQuit = false; renderRun(); });
      add(q, el("p", null, run.kind === "lesson" ? "Leave this lesson? You can pick it up from the home screen." : "Leave now? Answers so far are kept in your review."), add(el("div", "row"), st, lv));
      box.appendChild(q);
    }
    const kick = run.kind === "check" ? run.title : step.review ? "Review" : run.title;
    box.appendChild(el("p", "kicker", kick));
    if (canSpeak && spainVoice()) box.appendChild(el("p", "notice", "Your device only has a Spain Spanish voice. It says 'th' for c and z, where Latin Americans say s."));
    ({ learn: stepLearn, choice: stepChoice, listen: stepChoice, build: stepBuild, type: stepType, say: stepSay })[step.t](box, step);
    if (old) old.replaceWith(box); else app.appendChild(box);
    if (run.focusedStep !== run.i) run.lockUntil = performance.now() + 400;
    if (run.confirmQuit) { const f = $("#leave-no"); if (f) f.focus({ preventScroll: true }); }
    else if (run.answered) { const f = $("#continue-step"); if (f) f.focus({ preventScroll: true }); }
    else if (run.focusId) { const f = document.getElementById(run.focusId) || $("#check"); if (f) f.focus({ preventScroll: true }); run.focusId = null; }
    else if (run.focusedStep !== run.i && step.t !== "type") { box.tabIndex = -1; box.focus({ preventScroll: true }); }
    run.focusedStep = run.i;
  }

  function continueBtn(label = "Continue") {
    const b = el("button", "btn primary", label); b.id = "continue-step"; b.addEventListener("click", next); return b;
  }
  function feedback(step, right, extra) {
    const f = el("div", "feedback " + (right ? "ok" : "bad"));
    f.appendChild(el("p", "verdict", right ? pick(["¡Muy bien!", "¡Eso!", "¡Bien hecho!", "¡Perfecto!"]) : "Not quite"));
    if (extra) extra.forEach((x) => x && f.appendChild(x));
    if (step.why) f.appendChild(fmt(step.why));
    return f;
  }

  function stepLearn(box, s) {
    box.appendChild(el("h2", null, s.title));
    const t = el("div", "learn-text"); s.text.forEach((p) => t.appendChild(fmt(p))); box.appendChild(t);
    if (s.examples) {
      const ul = el("ul", "examples");
      s.examples.forEach(([es, en]) => { const li = el("li"); add(li, speakBtn(es), add(el("div"), el("div", "ex-es", es), el("div", "ex-en", en))); ul.appendChild(li); });
      box.appendChild(ul);
    }
    if (s.say) {
      box.appendChild(el("p", "label", canSpeak ? "Tap to hear, then say it" : "Say these out loud"));
      const c = el("div", "chips"); s.say.forEach((w) => { const b = el("button", "chip", w); b.addEventListener("click", () => speak(w)); c.appendChild(b); }); box.appendChild(c);
    }
    if (s.mistake) {
      const m = el("div", "mistake");
      add(m, el("p", "kicker", "Common mistake"), add(el("p"), el("span", "w es", s.mistake.wrong), document.createTextNode("  →  "), el("span", "r es", s.mistake.right)), fmt(s.mistake.why, "p", "muted"));
      box.appendChild(m);
    }
    if (s.chile) { const c = el("div", "chile"); add(c, el("p", "kicker", "In Chile"), fmt(s.chile)); box.appendChild(c); }
    box.appendChild(add(el("div", "row"), continueBtn("Got it")));
  }

  function stepChoice(box, s) {
    box.appendChild(el("p", "prompt", s.prompt));
    if (s.t === "listen") {
      const p = el("div", "play");
      if (canSpeak) { const b = speakBtn(s.es, "Play the word"); b.id = "play"; p.appendChild(b); p.appendChild(el("span", "muted", "Tap to play. No sound? Check your phone isn't on silent.")); }
      else p.appendChild(add(el("div"), el("p", "muted", "Audio isn't available on this device. Read it instead:"), el("p", "big-es", s.es)));
      box.appendChild(p);
    } else if (s.es) {
      box.appendChild(add(el("div", "row"), speakBtn(s.es), el("p", "big-es", s.es)));
    }
    const ch = el("div", "choices");
    s.opts.forEach((o, k) => {
      const b = el("button", "tile", o); b.id = "opt-" + k; b.lang = s.optLang || "es";
      if (run.answered) {
        b.disabled = true;
        if (o === s.answer) b.classList.add("ok"); else if (o === run.result.chosen) b.classList.add("bad");
      } else b.addEventListener("click", () => grade(o === s.answer, s, { chosen: o }));
      ch.appendChild(b);
    });
    box.appendChild(ch);
    if (run.answered) {
      box.appendChild(feedback(s, run.result.right, run.result.right ? null : [add(el("p"), el("span", "muted", "Answer: "), el("strong", null, s.answer))]));
      const sayText = s.t === "listen" ? s.es : s.speak;
      box.appendChild(add(el("div", "row"), sayText ? speakBtn(sayText, "Listen: " + sayText) : null, continueBtn()));
    }
  }

  function buildSentence(tiles) { const s = capFirst(tiles.join(" ")); return /[.?!]$/.test(s) ? s : s + "."; }
  function stepBuild(box, s) {
    box.appendChild(el("p", "prompt", "Build this in Spanish:"));
    box.appendChild(el("p", "big-en", s.en));
    box.appendChild(el("p", "muted", "Tap the blocks in order. One block doesn't belong."));
    const trayWrap = el("div"); trayWrap.appendChild(el("p", "label", "Your sentence"));
    const tray = el("div", "tray");
    if (!run.placed.length) tray.appendChild(el("span", "muted", "Tap a block below."));
    run.placed.forEach((p, k) => {
      const b = el("button", "tile", k === 0 ? capFirst(p.t) : p.t); b.id = "placed-" + p.k; b.lang = "es";
      if (run.answered) { b.disabled = true; b.classList.add(run.result.right ? "ok" : "bad"); }
      else b.addEventListener("click", () => { if (tapLocked()) return; run.placed.splice(k, 1); run.focusId = run.placed.length ? "check" : "pool-" + p.k; renderRun(); });
      tray.appendChild(b);
    });
    trayWrap.appendChild(tray); box.appendChild(trayWrap);
    if (!run.answered) {
      const used = new Set(run.placed.map((p) => p.k));
      const poolWrap = el("div"); poolWrap.appendChild(el("p", "label", "Blocks"));
      const pool = el("div", "pool");
      s.bank.filter((b) => !used.has(b.k)).forEach((p) => { const b = el("button", "tile", p.t); b.id = "pool-" + p.k; b.lang = "es"; b.addEventListener("click", () => { if (tapLocked()) return; run.placed.push(p); const rest = s.bank.filter((x) => x.k !== p.k && !run.placed.some((y) => y.k === x.k)); run.focusId = rest.length ? "pool-" + rest[0].k : "check"; renderRun(); }); pool.appendChild(b); });
      poolWrap.appendChild(pool); box.appendChild(poolWrap);
      const chk = el("button", "btn primary", "Check"); chk.id = "check"; chk.disabled = !run.placed.length;
      chk.addEventListener("click", () => {
        const got = run.placed.map((p) => p.t);
        const right = got.length === s.tiles.length && got.every((t, k) => t === s.tiles[k]);
        grade(right, s, { got });
      });
      const clr = el("button", "btn", "Clear"); clr.id = "clear"; clr.disabled = !run.placed.length; clr.addEventListener("click", () => { run.placed = []; renderRun(); });
      box.appendChild(add(el("div", "row"), clr, chk));
    } else {
      const sentence = buildSentence(s.tiles);
      box.appendChild(feedback(s, run.result.right, [el("p", "big-es", sentence)]));
      box.appendChild(add(el("div", "row"), speakBtn(sentence), continueBtn()));
    }
  }

  function stepType(box, s) {
    box.appendChild(fmt(s.prompt, "p", "prompt"));
    const input = el("input", "answer"); input.id = "answer-input"; input.type = "text";
    input.setAttribute("lang", "es"); input.setAttribute("autocomplete", "off"); input.setAttribute("autocorrect", "off"); input.setAttribute("autocapitalize", "off"); input.setAttribute("spellcheck", "false");
    input.setAttribute("aria-label", "Your answer in Spanish"); input.setAttribute("enterkeyhint", "go");
    input.value = run.typed;
    input.addEventListener("input", () => { run.typed = input.value; chk.disabled = !input.value.trim(); });
    input.addEventListener("keydown", (e) => { if (e.key === "Enter" && !run.answered && !run.checking && input.value.trim()) { e.preventDefault(); markTyped(s); } });
    const answerRow = el("div", "answer-row"); answerRow.appendChild(input); box.appendChild(answerRow);
    const keys = el("div", "keys");
    ["á", "é", "í", "ó", "ú", "ñ", "¿", "¡"].forEach((c) => {
      const k = el("button", null, c); k.type = "button"; k.setAttribute("aria-label", "Type " + c);
      k.addEventListener("click", () => { const p = input.selectionStart ?? input.value.length; input.value = input.value.slice(0, p) + c + input.value.slice(input.selectionEnd ?? p); run.typed = input.value; chk.disabled = false; input.focus(); input.setSelectionRange(p + 1, p + 1); });
      keys.appendChild(k);
    });
    const chk = el("button", "btn primary", "Check"); chk.id = "check"; chk.disabled = !run.typed.trim();
    chk.addEventListener("click", () => markTyped(s));
    if (!run.answered) {
      input.disabled = run.checking;
      if (!run.checking) answerRow.appendChild(chk);
      box.appendChild(keys);
      if (run.checking) {
        const w = el("div", "feedback wait"); add(w, el("p", null, "Your answer isn't on the list, so Claude is checking it. The first time, Claude asks your permission."));
        const stop = el("button", "linkbtn", "Stop waiting"); stop.id = "stop-wait"; stop.addEventListener("click", () => { run.checkId = (run.checkId || 0) + 1; run.checking = false; run.checkFailed = true; renderRun(); });
        w.appendChild(stop); box.appendChild(w);
      }
      if (run.checkFailed) { const w = el("div", "feedback wait"); add(w, el("p", null, "Couldn't check that just now. Tap Check to try again, or count it as right if you're sure.")); const o = el("button", "linkbtn", "My answer was right, count it"); o.id = "override"; o.addEventListener("click", () => { run.checkFailed = false; grade(true, s, { note: "Counted as right." }); }); w.appendChild(o); box.appendChild(w); }
      if (!run.checking) setTimeout(() => input.focus({ preventScroll: true }), 0);
      return;
    }
    input.disabled = true;
    const r = run.result;
    const extra = [];
    if (r.note) extra.push(fmt(r.note));
    if (r.claude) extra.push(el("p", null, "Claude: " + r.claude));
    if (!r.right || r.fixed) extra.push(add(el("p"), el("span", "muted", r.right ? "Also good: " : "Answer: "), el("strong", "es", r.fixed || s.show)));
    if (r.overridden) extra.push(el("p", "muted", "Counted as right."));
    box.appendChild(feedback(s, r.right, extra));
    const row = el("div", "row");
    add(row, speakBtn(r.fixed || s.show), continueBtn());
    if (!r.right) { const o = el("button", "linkbtn", "My answer was right, count it"); o.id = "override"; o.addEventListener("click", () => overrideRight(s)); row.appendChild(o); }
    box.appendChild(row);
  }
  async function markTyped(s) {
    const attempt = run.typed.trim();
    if (!attempt) return;
    if (s.answers.some((a) => strict(a) === strict(attempt))) return grade(true, s);
    const near = s.answers.find((a) => loose(a) === loose(attempt));
    if (near) return grade(true, s, { note: "Right. Watch the accents: *" + capFirst(near) + "*" });
    run.checkId = (run.checkId || 0) + 1;
    const mine = run, at = run.i, ticket = run.checkId;
    if (run.checking) return;
    run.checking = true; run.checkFailed = false; renderRun();
    const verdict = await askClaude(s, attempt);
    if (run !== mine || run.i !== at || run.checkId !== ticket || route.name !== "run") return; // learner quit, moved on or stopped waiting
    run.checking = false;
    if (verdict === "failed") { run.checkFailed = true; renderRun(); return; } // a hiccup is not a wrong answer
    if (verdict !== "off") return grade(verdict.correct, s, { claude: verdict.why, fixed: verdict.fixed && strict(verdict.fixed) !== strict(attempt) ? verdict.fixed : "" });
    grade(false, s, { note: "That's not on my list of answers. If you're sure it's right, tap 'count it'." });
  }

  function stepSay(box, s) {
    box.appendChild(el("p", "prompt", "Say this out loud:"));
    box.appendChild(el("p", "big-es", s.es));
    box.appendChild(el("p", "en", s.en));
    if (s.tip) box.appendChild(add(el("p", "muted"), el("strong", null, "Tip: "), document.createTextNode(s.tip)));
    if (!run.said) {
      const b = el("button", "btn primary", canSpeak ? "I said it, now let me hear it" : "I said it"); b.id = "said";
      b.addEventListener("click", () => { if (tapLocked()) return; run.said = true; speak(s.es); renderRun(); });
      box.appendChild(add(el("div", "row"), b));
      return;
    }
    if (!run.answered) {
      box.appendChild(add(el("div", "row"), speakBtn(s.es, "Hear it again"), el("span", "muted", "How did you go?")));
      const g = el("div", "selfmark");
      [["Nailed it", true], ["Close", true], ["Missed it", false]].forEach(([label, ok], k) => {
        const b = el("button", "btn" + (k === 0 ? " primary" : ""), label); b.id = "self-" + k;
        b.addEventListener("click", () => grade(ok, s, { self: label })); g.appendChild(b);
      });
      box.appendChild(g);
      return;
    }
    const msg = run.result.self === "Missed it" ? "No worries. It'll come back in your review." : run.result.self === "Close" ? "Close counts. Say it once more with the audio." : "Good. Keep saying things out loud.";
    const f = el("div", "feedback " + (run.result.right ? "ok" : "bad")); f.setAttribute("role", "status");
    add(f, el("p", "verdict", run.result.self), el("p", null, msg));
    box.appendChild(f);
    box.appendChild(add(el("div", "row"), speakBtn(s.es, "Hear it again"), continueBtn()));
  }

  // ---------- Results ----------
  function renderDone() {
    const r = route.res;
    const box = el("main", "card"); box.id = "done";
    const pct = r.graded ? Math.round((r.right / r.graded) * 100) : 100;
    box.appendChild(el("p", "kicker", r.title));
    if (r.kind === "check") box.appendChild(el("h2", null, r.passed ? `Level ${r.level} passed` : "Not yet"));
    else box.appendChild(el("h2", null, pct >= 80 ? "¡Muy bien!" : pct >= 50 ? "¡Vas bien!" : "¡Sigue así!"));
    box.appendChild(el("p", "result-score", `${r.right}/${r.graded}`));
    if (r.kind === "check") box.appendChild(el("p", "muted", r.passed ? (LEVELS[r.level + 1] ? `Level ${r.level + 1} is open.` : `Level ${r.level + 1} is next. Ask Claude to build it, then it appears on your home screen.`) : `You need ${Math.ceil(r.graded * 0.8)} to pass. Redo the lessons you found hard, then try again.`));
    if (r.missed.length) {
      box.appendChild(el("p", "kicker", "These go into your review"));
      const ul = el("ul", "plain");
      r.missed.forEach((m) => ul.appendChild(el("li", null, m.t === "say" ? m.es : m.t === "build" ? buildSentence(m.tiles) : m.t === "type" ? m.show : m.prompt.includes("___") ? m.prompt.replace("___", m.answer) : `${m.prompt} ${m.answer}`)));
      box.appendChild(ul);
    }
    const home = el("button", "btn primary", "Back to levels"); home.id = "home"; home.addEventListener("click", () => go({ name: "home" }));
    box.appendChild(add(el("div", "row"), home));
    app.appendChild(box);
    home.focus({ preventScroll: true });
  }

  // ---------- Settings sheet ----------
  let sheetOpen = false;
  function renderSheet() {
    const old = $("#sheet"); if (old) old.remove();
    document.body.classList.toggle("sheet-open", sheetOpen);
    const opener = $("#settings-btn"); if (opener) opener.setAttribute("aria-expanded", String(sheetOpen));
    if (!sheetOpen) { if (old && opener) opener.focus({ preventScroll: true }); return; }
    const sh = el("div", "sheet"); sh.id = "sheet"; sh.setAttribute("role", "dialog"); sh.setAttribute("aria-label", "Settings");
    const inner = el("div", "inner");
    add(inner, el("h3", null, "Settings"));
    const nl = el("label", "label", "Your name (used in the lessons)"); nl.setAttribute("for", "name-input");
    const ni = el("input"); ni.id = "name-input"; ni.type = "text"; ni.maxLength = 40; ni.value = P.settings.name || ""; ni.placeholder = DEFAULT_NAME; ni.setAttribute("autocomplete", "given-name");
    ni.addEventListener("input", () => { P.settings.name = ni.value.trim().slice(0, 40); save(); });
    add(inner, add(el("div", "field"), nl, ni));
    if (canSpeak) {
      loadVoices();
      const lab = el("label", "label", "Spanish voice"); lab.setAttribute("for", "voice");
      const sel = el("select"); sel.id = "voice";
      sel.appendChild(new Option("Automatic (Latin American first)", ""));
      voices.forEach((v) => sel.appendChild(new Option(`${v.name} (${v.lang})`, v.name)));
      sel.value = P.settings.voice || "";
      sel.addEventListener("change", () => { P.settings.voice = sel.value; save(); speak("Hola, ¿cómo estás?"); });
      const rate = el("select"); rate.id = "rate";
      [["Slow", 0.75], ["Normal", 0.9], ["Fast", 1]].forEach(([l, v]) => rate.appendChild(new Option(l, String(v))));
      rate.value = String(P.settings.rate || 0.9);
      rate.addEventListener("change", () => { P.settings.rate = Number(rate.value); save(); speak("Cinco, diez, quince."); });
      const rl = el("label", "label", "Speed"); rl.setAttribute("for", "rate");
      add(inner, add(el("div"), lab, sel), add(el("div"), rl, rate), el("p", "muted", "No sound? Check your phone isn't on silent. Voices come from your device. Mexican or US Spanish voices match this course best. Avoid Spain's voices (they say 'th' for c and z) and Argentina's (they say 'sh' for ll and y)."));
    } else add(inner, el("p", "muted", "This device can't read Spanish aloud."));
    add(inner, el("p", "muted", EDITION === "web" ? "This copy saves your progress on this device only, so your phone and iPad each keep their own. The Claude version syncs between them." : sync.where === "account" ? "Your progress is saved to your Claude account, so it follows you between phone and iPad." : "Your progress is saved on this device only. Open the app while signed in to Claude to save it to your account."));
    const close = el("button", "btn", "Close"); close.id = "close-settings"; close.addEventListener("click", () => { sheetOpen = false; renderSheet(); });
    inner.appendChild(add(el("div", "row"), close));
    sh.appendChild(inner);
    document.body.appendChild(sh);
    const first = sh.querySelector("select, button"); if (first) first.focus({ preventScroll: true });
  }

  // ---------- Boot ----------
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && sheetOpen) { sheetOpen = false; renderSheet(); }
  });
  const live = el("div", "sr-only"); live.id = "live"; live.setAttribute("aria-live", "polite"); document.body.appendChild(live);
  const start = () => { rerender(); connectAccount(); };
  if (window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(start); else start();
})();
</script>

<script>if("serviceWorker" in navigator){addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));}</script>
