    if (!run.said) {
      const b = el("button", "btn primary", canSpeak ? "I said it, now let me hear it" : "I said it"); b.id = "said";
      b.addEventListener("click", () => { if (tapLocked()) return; run.said = true; speak(s.es); renderRun(); });
      dock(box, "", acts(b));
      return;
    }
    if (!run.answered) {
      const ask = add(el("div", "row"), speakBtn(s.es, "Hear it again"), el("span", "muted", "How did you go?"));
      const g = el("div", "selfmark");
      [["Nailed it", true], ["Close", true], ["Missed it", false]].forEach(([label, ok], k) => {
        const b = el("button", "btn" + (k === 0 ? " primary" : ""), label); b.id = "self-" + k;
        b.addEventListener("click", () => grade(ok, s, { self: label })); g.appendChild(b);
      });
      dock(box, "", ask, g);
      return;
    }
    const msg = run.result.self === "Missed it" ? "No worries. It'll come back in your review." : run.result.self === "Close" ? "Close counts. Say it once more with the audio." : "Good. Keep saying things out loud.";
    dock(box, "feedback " + (run.result.right ? "ok" : "bad"), el("p", "verdict", run.result.self), el("p", null, msg), acts(speakBtn(s.es, "Hear it again"), continueBtn()));
  }

  // ---------- Results ----------
  function renderDone() {
    const r = route.res;
    const box = el("main", "card"); box.id = "done";
    const pct = r.graded ? Math.round((r.right / r.graded) * 100) : 100;
    box.appendChild(el("p", "kicker", r.title));
    if (r.kind === "check") box.appendChild(el("h2", null, r.passed ? `Level ${r.level} passed` : "Not yet"));
    else box.appendChild(el("h2", null, pct >= 80 ? "¡Muy bien!" : pct >= 50 ? "¡Vas bien!" : "¡Sigue así!"));
    box.appendChild(el("p", "result-score", `${r.right}/${r.graded}`));
    if (r.kind === "check") box.appendChild(el("p", "muted", r.passed ? (LEVELS[r.level + 1] ? `Level ${r.level + 1} is open.` : r.level >= COURSE.levels.length ? "That was the last level. You've finished the whole course." : `Level ${r.level + 1} is next. Ask Claude to build it${EDITION === "web" ? " and reinstall the app" : ""}, then it appears on your home screen.`) : `You need ${Math.ceil(r.graded * 0.8)} to pass. Redo the lessons you found hard, then try again.`));
    if (r.missed.length) {
      box.appendChild(el("p", "kicker", "These go into your review"));
      const ul = el("ul", "missed");
      r.missed.forEach((m) => ul.appendChild(missedItem(m)));
      box.appendChild(ul);
    }
    // Straight on to whatever comes next, unless a failed check sends you back to the lessons.
    const nx = !(r.kind === "check" && !r.passed) && nextLesson();
    const go_ = nx && (nx.lesson ? el("button", "btn primary wide", "Next: " + nx.lesson.title) : nx.check ? el("button", "btn primary wide", `Take the Level ${nx.level.id} check`) : null);
    if (go_) { go_.id = "next-lesson"; go_.addEventListener("click", () => (nx.lesson ? startLesson(nx.lesson.id) : startCheck(nx.level.id))); }
    const home = el("button", "btn wide" + (go_ ? "" : " primary"), "Back to home"); home.id = "home"; home.addEventListener("click", () => go({ name: "home" }));
    box.appendChild(add(el("div", "stack"), go_, home));
    app.appendChild(box);
    (go_ || home).focus({ preventScroll: true });
  }
  // One line per missed question: the Spanish to remember, with the question it came from when that helps.
  function missedItem(m) {
    const li = el("li");
    const main = (t) => li.appendChild(el("span", "es", t));
    if (m.t === "say" || m.t === "listen") main(m.es);
    else if (m.t === "build") main(buildSentence(m.tiles));
    else if (m.t === "type") { main(m.show); li.appendChild(fmt(m.prompt, "span", "ctx")); }
    else if (m.prompt.includes("___")) { const f = m.prompt.replace("___", m.answer), c = m.prompt.lastIndexOf(": ", m.prompt.indexOf("___")); main(c >= 0 ? f.slice(c + 2) : f); }
    else if (m.es && m.optLang === "en") main(`${m.es} = ${m.answer}`);
    else if (m.es && m.es !== m.answer) { main(m.answer); li.appendChild(add(el("span", "ctx"), document.createTextNode("Not: "), el("s", "es", m.es))); }
    else { li.appendChild(el("strong", m.optLang === "en" ? null : "es", m.answer)); li.appendChild(el("span", "ctx", m.prompt)); }
    return li;
  }

  // ---------- Settings sheet ----------
  let sheetOpen = false;
  // Closing Settings redraws the page, so anything synced while it was open shows (a stale Review button can't be tapped).
  function closeSheet() { sheetOpen = false; if (route.name === "run") renderSheet(); else rerender(); }
  function renderSheet() {
    const old = $("#sheet"); if (old) old.remove();
    document.body.classList.toggle("sheet-open", sheetOpen);
    const opener = $("#settings-btn"); if (opener) opener.setAttribute("aria-expanded", String(sheetOpen));
    if (!sheetOpen) { if (old && opener) opener.focus({ preventScroll: true }); return; }
    const sh = el("div", "sheet"); sh.id = "sheet"; sh.setAttribute("role", "dialog"); sh.setAttribute("aria-label", "Settings");
    const inner = el("div", "inner");
    add(inner, el("h3", null, "Settings"));
    const nl = el("label", "label", "Your name (used in the lessons)"); nl.setAttribute("for", "name-input");
    const ni = el("input"); ni.id = "name-input"; ni.type = "text"; ni.maxLength = 40; ni.value = P.settings.name || ""; ni.placeholder = DEFAULT_NAME; ni.setAttribute("autocomplete", "given-name");
    ni.addEventListener("input", () => { P.settings.name = ni.value.trim().slice(0, 40); P.settingsAt = Date.now(); save(); const w = $(".who"); if (w) w.textContent = learnerName(); });
    add(inner, add(el("div", "field"), nl, ni));
    if (canSpeak) {
      loadVoices();
      const lab = el("label", "label", "Spanish voice"); lab.setAttribute("for", "voice");
      const sel = el("select"); sel.id = "voice";
      sel.appendChild(new Option("Automatic (Latin American first)", ""));
      voices.forEach((v) => sel.appendChild(new Option(`${v.name} (${v.lang})`, v.name)));
      sel.value = myVoice() ? voicePref.get() : "";
      sel.addEventListener("change", () => { voicePref.set(sel.value); speak("Hola, ¿cómo estás?"); });
      const rate = el("select"); rate.id = "rate";
      [["Slow", 0.75], ["Normal", 0.9], ["Fast", 1]].forEach(([l, v]) => rate.appendChild(new Option(l, String(v))));
      rate.value = String(P.settings.rate || 0.9);
      rate.addEventListener("change", () => { P.settings.rate = Number(rate.value); P.settingsAt = Date.now(); save(); speak("Cinco, diez, quince."); });
      const rl = el("label", "label", "Speed"); rl.setAttribute("for", "rate");
      add(inner, add(el("div"), lab, sel), add(el("div"), rl, rate), el("p", "muted", "No sound? Check your phone isn't on silent. Voices come from your device. Mexican or US Spanish voices match this course best. Avoid Spain's voices (they say 'th' for c and z) and Argentina's (they say 'sh' for ll and y)."));
    } else add(inner, el("p", "muted", "This device can't read Spanish aloud."));
    add(inner, el("p", "muted", EDITION === "web" ? "This copy saves your progress on this device only, so your phone and iPad each keep their own. The Claude version syncs between them." : sync.where === "account" ? "Your progress is saved to your Claude account, so it follows you between phone and iPad." : "Your progress is saved on this device only. Open the app while signed in to Claude to save it to your account."));
    const ss = el("p", "muted", saveStatus()); ss.id = "save-status";
    add(inner, add(el("div"), el("p", "label", "Saving"), ss));
    const close = el("button", "btn", "Close"); close.id = "close-settings"; close.addEventListener("click", closeSheet);
    inner.appendChild(add(el("div", "row"), close));
    sh.appendChild(inner);
    document.body.appendChild(sh);
    const first = sh.querySelector("select, button"); if (first) first.focus({ preventScroll: true });
  }

  // ---------- Boot ----------
  // After home redraws from a sync, a tap already on its way is ignored for a moment (it was aimed at the old layout).
  let tapsHeldUntil = 0;
  function holdTaps() { tapsHeldUntil = performance.now() + 400; }
  document.addEventListener("click", (e) => { if (performance.now() < tapsHeldUntil) { e.stopPropagation(); e.preventDefault(); } }, true);
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && sheetOpen) closeSheet();
  });
  const live = el("div", "sr-only"); live.id = "live"; live.setAttribute("aria-live", "polite"); document.body.appendChild(live);
  const start = () => { rerender(); connectAccount(); };
  if (window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(start); else start();
})();
</script>
