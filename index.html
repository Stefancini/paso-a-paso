<meta name="apple-mobile-web-app-capable" content="yes">

<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>

<body>
<style>
/* Layout: one column like a site diary. Levels stack like roof courses; hi-vis yellow marks the one thing to press next. */
:root {
  --bg: #E4E8EA;
  --panel: #F6F7F8;
  --ink: #1C2226;
  --muted: #56636A;
  --line: #C3CBD0;
  --rib: #D3D9DD;
  --edge: #6B777E;
  --hivis: #F2B705;
  --hivis-ink: #1C2226;
  --ok: #2B7448;
  --ok-soft: #DCEFE3;
  --bad: #A93D2C;
  --bad-soft: #F6E1DC;
  --chile: #1F4E8C;
  --chile-soft: #E1E9F5;
  --display: "Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
  --body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #171C1F; --panel: #222A2E; --ink: #E8ECEE; --muted: #9AA6AC; --line: #36414A; --rib: #2D363C; --edge: #6F7C84;
    --hivis: #F5C02A; --hivis-ink: #171C1F; --ok: #63BE88; --ok-soft: #1E3628; --bad: #E2775F; --bad-soft: #3D231D;
    --chile: #8DB4EE; --chile-soft: #1D2A3D;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #171C1F; --panel: #222A2E; --ink: #E8ECEE; --muted: #9AA6AC; --line: #36414A; --rib: #2D363C; --edge: #6F7C84;
  --hivis: #F5C02A; --hivis-ink: #171C1F; --ok: #63BE88; --ok-soft: #1E3628; --bad: #E2775F; --bad-soft: #3D231D;
  --chile: #8DB4EE; --chile-soft: #1D2A3D;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 18px; line-height: 1.5;
  padding-inline: 16px; padding-block: 16px 48px;
}
.wrap { max-width: 760px; margin: 0 auto; display: grid; gap: 18px; }
p { margin: 0; }
.es { font-weight: 700; }

/* Top bar */
.top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; }
.brand { font-family: var(--display); font-weight: 800; font-size: 2.2rem; line-height: .9; text-transform: uppercase; margin: 0; letter-spacing: .01em; }
.brand button { all: unset; cursor: pointer; display: inline-flex; align-items: center; min-height: 44px; }
.meta { display: flex; gap: 14px; align-items: center; font: 500 .8rem var(--mono); color: var(--muted); }
.iconbtn { font: 700 .9rem var(--body); color: var(--ink); background: transparent; border: 1.5px solid var(--edge); border-radius: 8px; padding: 8px 14px; min-height: 44px; cursor: pointer; }

/* Generic */
.card { background: var(--panel); border: 1.5px solid var(--line); border-radius: 14px; padding: 20px; display: grid; gap: 14px; min-width: 0; }
.kicker { font: 700 .75rem var(--body); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
h2 { font-family: var(--display); font-weight: 800; font-size: clamp(1.9rem, 7vw, 2.6rem); line-height: .95; margin: 0; text-transform: uppercase; text-wrap: balance; }
h3 { font-size: 1.25rem; margin: 0; line-height: 1.25; text-wrap: balance; }
.muted { color: var(--muted); }
.btn {
  font: 700 1.05rem var(--body); border-radius: 10px; padding: 13px 20px; min-height: 50px; cursor: pointer;
  border: 1.5px solid var(--ink); background: transparent; color: var(--ink);
}
.btn.primary { background: var(--hivis); border-color: var(--hivis); color: var(--hivis-ink); }
.btn.small { font-size: .9rem; padding: 8px 14px; min-height: 44px; }
.btn:disabled { opacity: .45; cursor: default; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }

/* Home: today */
.today { display: grid; gap: 12px; }
.today .next { display: grid; gap: 4px; }
.stats { display: flex; flex-wrap: wrap; gap: 8px 18px; font: 500 .85rem var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }

/* Level path: each level is a roof course */
.path { display: grid; gap: 10px; }
.level { background: var(--panel); border: 1.5px solid var(--line); border-radius: 12px; overflow: hidden; }
.level-head { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; padding: 14px 16px; width: 100%; background: none; border: 0; color: inherit; font: inherit; text-align: left; cursor: pointer; }
.level-head:disabled { cursor: default; }
.lvnum { font-family: var(--display); font-weight: 800; font-size: 2rem; line-height: 1; width: 2.2ch; text-align: center; }
.lvtext { min-width: 0; display: grid; gap: 2px; }
.lvtitle { font-weight: 700; }
.lvidea { color: var(--muted); font-size: .9rem; }
.pill { font: 700 .72rem var(--body); letter-spacing: .08em; text-transform: uppercase; padding: 4px 9px; border-radius: 999px; border: 1.5px solid var(--line); color: var(--muted); white-space: nowrap; }
.pill.done { border-color: var(--ok); color: var(--ok); }
.pill.open { border-color: var(--ink); color: var(--ink); }
.level.locked { opacity: .6; }
.level.current { border-color: var(--ink); }
.level.current::before { content: ""; display: block; height: 8px; background: repeating-linear-gradient(90deg, var(--hivis) 0 10px, color-mix(in srgb, var(--hivis) 70%, var(--ink)) 10px 14px); }
.lessons { display: grid; border-top: 1.5px solid var(--line); }
.lesson-row { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; padding: 12px 16px; background: none; border: 0; border-top: 1px solid var(--line); color: inherit; font: inherit; text-align: left; cursor: pointer; min-height: 56px; }
.lesson-row:first-child { border-top: 0; }
.tick { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; font-size: .8rem; font-weight: 700; }
.tick.done { background: var(--ok); border-color: var(--ok); color: var(--panel); }
.lesson-row .mins { font: 500 .8rem var(--mono); color: var(--muted); white-space: nowrap; }

/* Runner */
.bar { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; }
.progress { height: 12px; border-radius: 3px; background: repeating-linear-gradient(90deg, var(--rib) 0 5px, var(--line) 5px 7px); overflow: hidden; }
.progress > span { display: block; height: 100%; background: repeating-linear-gradient(90deg, var(--hivis) 0 5px, color-mix(in srgb, var(--hivis) 70%, var(--ink)) 5px 7px); transition: width .25s ease; }
.count { font: 500 .85rem var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.prompt { font-size: 1.15rem; }
.big-es, .big-en { font-weight: 700; font-size: clamp(1.5rem, 6vw, 2rem); line-height: 1.3; text-wrap: balance; }
.en { color: var(--muted); font-style: italic; }
.learn-text { display: grid; gap: 10px; }
.examples { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none; }
.examples li { display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: center; }
.ex-es { font-weight: 700; }
.ex-en { color: var(--muted); font-size: .95rem; }
.speak { width: 46px; height: 46px; border-radius: 50%; border: 1.5px solid var(--edge); background: var(--bg); color: var(--ink); cursor: pointer; display: grid; place-items: center; flex: none; }
.speak svg { width: 18px; height: 18px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { font: 700 1rem var(--body); padding: 8px 14px; min-height: 44px; border-radius: 8px; border: 1.5px solid var(--edge); background: var(--bg); color: var(--ink); cursor: pointer; }
.mistake { display: grid; gap: 4px; border-left: 4px solid var(--bad); padding: 4px 0 4px 12px; }
.mistake .w { color: var(--bad); text-decoration: line-through; font-weight: 700; }
.mistake .r { color: var(--ok); font-weight: 700; }
.chile { display: grid; gap: 4px; background: var(--chile-soft); border-radius: 10px; padding: 12px 14px; }
.chile .kicker { color: var(--chile); }

.tile {
  position: relative; font: 700 1.1rem var(--body); color: var(--ink); background: var(--bg);
  border: 1.5px solid var(--edge); border-radius: 10px; padding: 18px 14px 12px; cursor: pointer; text-align: center;
  min-height: 58px; min-width: 0; overflow-wrap: anywhere;
}
.tile::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 7px; border-radius: 9px 9px 0 0; background: repeating-linear-gradient(90deg, var(--rib) 0 6px, var(--line) 6px 9px); }
@media (hover: hover) { .tile:hover:not(:disabled) { border-color: var(--ink); } }
.tile:disabled { cursor: default; }
.tile.ok { border-color: var(--ok); background: var(--ok-soft); }
.tile.bad { border-color: var(--bad); background: var(--bad-soft); }
.choices { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; }
.tray, .pool { display: flex; flex-wrap: wrap; gap: 8px; min-height: 62px; align-items: flex-start; }
.tray { border: 2px dashed var(--line); border-radius: 10px; padding: 8px; }
.tray .tile, .pool .tile { padding: 14px 12px 8px; font-size: 1.05rem; min-height: 50px; min-width: 48px; }
button { touch-action: manipulation; }
.answer-row { display: flex; gap: 10px; align-items: stretch; }
.answer-row .answer { flex: 1; min-width: 0; }
.confirm { display: grid; gap: 10px; color: var(--ink); }
body.sheet-open { padding-bottom: 60vh; }
.field { display: grid; gap: 6px; }
.field input { font: 400 1rem var(--body); padding: 10px; min-height: 44px; border-radius: 8px; border: 1.5px solid var(--edge); background: var(--bg); color: var(--ink); max-width: 100%; }
.label { font: 700 .75rem var(--body); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }

.answer { width: 100%; font: 700 1.25rem var(--body); padding: 14px; border-radius: 10px; border: 2px solid var(--edge); background: var(--bg); color: var(--ink); }
.answer:focus { border-color: var(--ink); }
.keys { display: flex; flex-wrap: wrap; gap: 6px; }
.keys button { font: 700 1.05rem var(--body); min-width: 44px; min-height: 44px; border-radius: 8px; border: 1.5px solid var(--edge); background: var(--bg); color: var(--ink); cursor: pointer; }

.play { display: grid; place-items: center; gap: 8px; }
.play .speak { width: 84px; height: 84px; border-color: var(--ink); }
.play .speak svg { width: 34px; height: 34px; }

.feedback { border-radius: 12px; padding: 14px 16px; display: grid; gap: 6px; }
.feedback.ok { background: var(--ok-soft); }
.feedback.bad { background: var(--bad-soft); }
.feedback.wait { background: var(--bg); border: 1.5px dashed var(--line); }
.verdict { font-family: var(--display); font-weight: 800; font-size: 1.6rem; line-height: 1; text-transform: uppercase; }
.feedback.ok .verdict { color: var(--ok); }
.feedback.bad .verdict { color: var(--bad); }
.linkbtn { all: unset; cursor: pointer; text-decoration: underline; color: var(--muted); font-size: .95rem; display: inline-flex; align-items: center; min-height: 44px; padding: 0 4px; }
.speak[hidden] { display: none; }
.notice { font-size: .9rem; color: var(--muted); border: 1.5px dashed var(--edge); border-radius: 8px; padding: 8px 12px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.selfmark { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.selfmark .btn { padding-inline: 8px; }

.result-score { font-family: var(--display); font-weight: 800; font-size: clamp(3rem, 14vw, 4.5rem); line-height: .9; }
ul.plain { margin: 0; padding-left: 1.2em; display: grid; gap: 4px; }

.sheet { position: fixed; inset: auto 0 0 0; background: var(--panel); border-top: 1.5px solid var(--line); padding: 18px 16px calc(18px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 12px; max-height: 80vh; overflow: auto; box-shadow: 0 -8px 30px rgb(0 0 0 / .18); }
.sheet .inner { max-width: 760px; margin: 0 auto; width: 100%; display: grid; gap: 12px; }
select { font: 400 1rem var(--body); padding: 10px; min-height: 44px; border-radius: 8px; border: 1.5px solid var(--edge); background: var(--bg); color: var(--ink); max-width: 100%; }

button:focus-visible, summary:focus-visible, select:focus-visible, input:focus-visible, #runner:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; box-shadow: 0 0 0 7px var(--hivis); }
@media (prefers-reduced-motion: reduce) { .progress > span { transition: none; } }
@media (max-width: 420px) { .card { padding: 16px; } body { font-size: 17px; } .selfmark { grid-template-columns: 1fr; } }
</style>

<div class="wrap" id="app"></div>

<script>
(function () {
  "use strict";
  const COURSE = {"levels": [{"id": 1, "title": "First words", "idea": "Sounds, greetings, el/la, numbers 0 to 20, soy and me llamo"}, {"id": 2, "title": "Is it ser or estar?", "idea": "Two verbs for 'to be', and describing things: la lámina es larga"}, {"id": 3, "title": "Doing things", "idea": "Present tense of regular verbs (hablo, comes, vivimos) and asking questions"}, {"id": 4, "title": "Plans and jobs", "idea": "tengo que / voy a / quiero / necesito + a verb"}, {"id": 5, "title": "Why and what you like", "idea": "por vs porque, gustar, and little words like a, de, en, con"}, {"id": 6, "title": "Shape-shifting verbs", "idea": "Verbs that change their middle (quiero, puedo) and me / te / se verbs"}, {"id": 7, "title": "Yesterday", "idea": "Talking about the past: trabajé, fui"}, {"id": 8, "title": "Two pasts", "idea": "'was doing' vs 'did': trabajaba vs trabajé"}, {"id": 9, "title": "Orders and plans", "idea": "Commands and future plans"}, {"id": 10, "title": "Wishes and real speed", "idea": "Wishes and feelings (quiero que...) and Chilean speech at full speed"}]};
  const LEVELS = {"1": {"id": 1, "lessons": [{"id": "1.1", "title": "How Spanish sounds", "minutes": 7, "steps": [{"t": "learn", "title": "Five vowels, five sounds", "text": ["English vowels change sound all the time. Spanish vowels never do. Learn these five and you can read most Spanish words out loud."], "examples": [["a", "ah, as in 'father'"], ["e", "eh, as in 'bed'"], ["i", "ee, as in 'see'"], ["o", "oh, short and clean, with no 'ow' glide at the end"], ["u", "oo, as in 'food'"]], "say": ["casa", "mesa", "libro", "uno"]}, {"t": "learn", "title": "Letters that trick English speakers", "text": ["*h* is always silent: *hola* is OH-lah.", "*j* is a soft, breathy h: *jefe* (boss) is HEH-feh.", "*ll* and *y* both sound like the English y: *llave* (key) is YAH-beh.", "*ñ* is 'ny', like canyon: *mañana* is mah-NYAH-nah.", "*c* before e or i, and every *z*, sound like s in Latin America: *cinco* is SEEN-koh, *zapato* is sah-PAH-toh."], "mistake": {"wrong": "THEEN-koh", "right": "SEEN-koh", "why": "The 'th' sound is only used in central and northern Spain. Latin Americans say s."}, "chile": "Chileans often swallow an s at the end of a syllable. *¿Cómo estás?* can sound like 'cómo ehtá', and *los amigos* like 'loh amigoh'. The s is still there in writing."}, {"t": "learn", "title": "Four more sounds", "text": ["*ch* is the English ch: *mucho*, *techo*, *chao*.", "*qu* is just k, the u is silent: *quince* is KEEN-seh, *¿qué tal?* is keh TAHL.", "*v* sounds like b: *llave* is YAH-beh, *vivo* is BEE-boh.", "One *r* is a quick tap, like the fast d sound in an Aussie 'butter': *tres*, *cuatro*, *por favor*. Double *rr* is rolled: *perro* (dog).", "The word *y* (and) on its own sounds like 'ee': *el techo y la puerta*."]}, {"t": "learn", "title": "Where to push", "text": ["Every word has one strong syllable. Three simple rules tell you which one.", "Ends in a vowel, n or s: push the second-to-last. CA-sa, TE-cho, GRA-cias.", "Ends in any other letter: push the last. pa-PEL, re-LOJ.", "An accent mark breaks the rules: push where the mark is. ca-FÉ, te-LÉ-fo-no."]}, {"t": "choice", "id": "1.1.h", "prompt": "How do you say the h in this word?", "es": "hola", "options": ["Silent: OH-lah", "Like English h: HOH-lah", "Like a j: JOH-lah"], "answer": "Silent: OH-lah", "why": "The h is always silent in Spanish.", "speak": "hola", "optLang": "en"}, {"t": "choice", "id": "1.1.ll", "prompt": "How does llave (key) sound?", "es": "llave", "options": ["YAH-beh", "LAH-beh", "JAH-beh"], "answer": "YAH-beh", "why": "ll sounds like the English y, and v sounds like b.", "speak": "llave", "optLang": "en"}, {"t": "choice", "id": "1.1.c", "prompt": "In Latin America, cinco (five) sounds like…", "es": "cinco", "options": ["SEEN-koh", "THEEN-koh", "KEEN-koh"], "answer": "SEEN-koh", "why": "c before e or i sounds like s. The 'th' version is Spain only.", "speak": "cinco", "optLang": "en"}, {"t": "choice", "id": "1.1.j", "prompt": "How does jefe (boss) sound?", "es": "jefe", "options": ["HEH-feh", "JEH-feh, like 'jet'", "YEH-feh"], "answer": "HEH-feh", "why": "j is a breathy h, never the English j.", "speak": "jefe", "optLang": "en"}, {"t": "choice", "id": "1.1.stress", "prompt": "Where's the push in teléfono?", "es": "teléfono", "options": ["te-LÉ-fo-no", "TE-le-fo-no", "te-le-FO-no"], "answer": "te-LÉ-fo-no", "why": "The accent mark shows exactly where to push.", "speak": "teléfono", "optLang": "en"}, {"t": "listen", "id": "1.1.listen", "prompt": "Listen. Which word did you hear?", "es": "mañana", "options": ["mañana", "manzana", "mano"], "answer": "mañana", "why": "mañana (tomorrow) has the ny sound of ñ. manzana is an apple."}, {"t": "say", "id": "1.1.say1", "es": "Hola. Mañana. La llave.", "en": "Hello. Tomorrow. The key.", "tip": "Silent h, 'ny' for ñ, 'y' for ll."}, {"t": "say", "id": "1.1.say2", "es": "Cinco zapatos.", "en": "Five shoes.", "tip": "Both the c and the z sound like s."}, {"t": "choice", "id": "1.1.chile", "prompt": "A Chilean mate says 'loh amigoh'. What did they say?", "options": ["los amigos", "lo amigo", "las amigas"], "answer": "los amigos", "why": "Chileans soften the s at the end of a syllable. It's still there in writing.", "speak": "los amigos"}]}, {"id": "1.2", "title": "Hello and goodbye", "minutes": 7, "steps": [{"t": "learn", "title": "Saying hello", "text": ["*Hola* works any time, with anyone.", "*Buenos días*: good morning, until about lunchtime.", "*Buenas tardes*: good afternoon, from lunch until dark.", "*Buenas noches*: good evening. It's also how you say goodnight."], "mistake": {"wrong": "Buenos tardes", "right": "Buenas tardes", "why": "It's *la tarde* and *la noche*, so buen*as*. Only *el día* takes buen*os*."}}, {"t": "learn", "title": "How are you?", "text": ["*¿Cómo estás?* How are you?", "Answers: *Bien, gracias.* (Good, thanks.) *Muy bien.* (Very good.) *Más o menos.* (So-so.) *Mal.* (Not good.)", "Then bounce it back: *¿Y tú?* (And you?)"], "examples": [["¿Cómo estás?", "How are you?"], ["Bien, gracias, ¿y tú?", "Good, thanks, and you?"]], "chile": "In Chile you'll hear *¿Cómo estai?* It means exactly the same as *¿Cómo estás?* Push the last bit: es-TAI. *¿Qué tal?* (How's it going?) works everywhere, Chile included."}, {"t": "learn", "title": "Meeting someone and leaving", "text": ["*Mucho gusto.* Nice to meet you. The reply is *Igualmente.* (Likewise.) You'll also hear *Encantado* (delighted).", "Leaving: *Chao.* (Bye, very common in Chile and much of South America.) *Adiós.* (Goodbye, a bit more final.) *Hasta luego.* (See you later.) *Nos vemos.* (See you.) *Hasta mañana.* (See you tomorrow.)"]}, {"t": "choice", "id": "1.2.morning", "prompt": "It's 7 am and you arrive on site. You say…", "options": ["Buenos días", "Buenas tardes", "Buenas noches"], "answer": "Buenos días", "why": "Buenos días is for the morning, until about lunchtime.", "speak": "Buenos días"}, {"t": "choice", "id": "1.2.afternoon", "prompt": "It's 3 pm and a customer walks in. You say…", "options": ["Buenas tardes", "Buenos días", "Buenas noches"], "answer": "Buenas tardes", "why": "Buenas tardes covers lunch until dark.", "speak": "Buenas tardes"}, {"t": "choice", "id": "1.2.fix", "prompt": "Fix this greeting.", "es": "Buenos tardes", "options": ["Buenas tardes", "Buena tarde", "Buenos tarde"], "answer": "Buenas tardes", "why": "It's la tarde, so buenas. Only el día takes buenos.", "speak": "Buenas tardes"}, {"t": "build", "id": "1.2.build", "en": "Good, thanks, and you?", "tiles": ["bien,", "gracias,", "¿y tú?"], "extra": ["buenos días"], "why": "Answer, say thanks, then bounce the question back."}, {"t": "type", "id": "1.2.type1", "prompt": "Someone asks: ¿Cómo estás? Say you're good, thanks.", "answers": ["bien, gracias", "muy bien, gracias", "bien, gracias, ¿y tú?", "muy bien, gracias, ¿y tú?", "estoy bien, gracias", "estoy muy bien, gracias", "bien gracias y usted", "muy bien gracias y usted", "estoy bien, gracias, ¿y tú?", "estoy muy bien, gracias, ¿y tú?", "gracias, bien", "bien, muchas gracias", "muy bien, muchas gracias", "bien, gracias, ¿y usted?", "estoy bien, gracias, ¿y usted?"], "why": "Bien, gracias. Add ¿y tú? to be friendly.", "show": "Bien, gracias."}, {"t": "choice", "id": "1.2.gusto", "prompt": "Someone says Mucho gusto. You reply…", "options": ["Igualmente", "De nada", "Hasta luego"], "answer": "Igualmente", "why": "Igualmente means likewise. De nada is 'you're welcome'.", "speak": "Mucho gusto. Igualmente."}, {"t": "choice", "id": "1.2.chile", "prompt": "A Chilean asks ¿Cómo estai? What do they mean?", "options": ["How are you?", "Where are you?", "Who are you?"], "answer": "How are you?", "why": "Chileans change estás to estai with friends. Same meaning.", "speak": "¿Cómo estai?", "optLang": "en"}, {"t": "type", "id": "1.2.type2", "prompt": "Knocking off for the day. Say 'See you tomorrow'.", "answers": ["hasta mañana", "chao, hasta mañana", "nos vemos mañana", "chao, nos vemos mañana", "hasta mañana, chao", "nos vemos, hasta mañana", "adiós, hasta mañana", "hasta mañana, nos vemos"], "why": "Hasta mañana. Nos vemos mañana works too.", "show": "Hasta mañana."}, {"t": "say", "id": "1.2.say", "es": "Buenos días, ¿cómo estás?", "en": "Good morning, how are you?", "tip": "Buenos with an o. Say it BWEH-nohs DEE-ahs."}]}, {"id": "1.3", "title": "Two ways to say 'you'", "minutes": 6, "steps": [{"t": "learn", "title": "Tú or usted", "text": ["Spanish has a friendly 'you' and a respectful 'you'.", "*tú*: mates, family, kids, people your own age.", "*usted*: the boss, customers, older people, strangers, police.", "Not sure? *usted* is the safe choice with strangers. With mates it can sound stiff."], "examples": [["¿Cómo estás?", "How are you? (tú, to a mate)"], ["¿Cómo está?", "How are you? (usted, to a customer)"]]}, {"t": "learn", "title": "Talking to a group", "text": ["For 'you all', Latin America always says *ustedes*. It works for mates and strangers alike.", "Spain has another word for this, but you won't need it."], "examples": [["¿Cómo están?", "How are you all?"]], "chile": "This is a Chile difference: Chileans use *tú* a lot, even with new people their own age. With *tú* they often change the verb ending and push the last bit: *¿cómo estai?* (es-TAI), *¿cachai?* (ca-CHAI, you get it?). Understand it for now, no need to say it yet."}, {"t": "choice", "id": "1.3.customer", "prompt": "An older customer on site. Which 'you'?", "options": ["usted", "tú", "ustedes"], "answer": "usted", "why": "Customers and older people get usted.", "speak": "¿Cómo está usted?"}, {"t": "choice", "id": "1.3.mate", "prompt": "Your mate from work. Which 'you'?", "options": ["tú", "usted", "ustedes"], "answer": "tú", "why": "Mates get tú.", "speak": "¿Cómo estás?"}, {"t": "choice", "id": "1.3.crew", "prompt": "Talking to the whole crew at once. Which 'you'?", "options": ["ustedes", "tú", "usted"], "answer": "ustedes", "why": "More than one person is always ustedes in Latin America.", "speak": "¿Cómo están ustedes?"}, {"t": "choice", "id": "1.3.police", "prompt": "A police officer stops you. Which 'you'?", "options": ["usted", "tú", "ustedes"], "answer": "usted", "why": "Officials and strangers get usted.", "speak": "Buenas tardes. ¿Cómo está usted?"}, {"t": "choice", "id": "1.3.esta", "prompt": "¿Cómo está? is said to…", "options": ["someone you call usted", "a close mate", "a group"], "answer": "someone you call usted", "why": "está goes with usted. estás goes with tú.", "speak": "¿Cómo está?", "optLang": "en"}, {"t": "build", "id": "1.3.build", "en": "How are you? (to a customer)", "tiles": ["¿cómo", "está", "usted?"], "extra": ["estás"], "why": "usted takes está, without the s."}, {"t": "type", "id": "1.3.type", "prompt": "Ask your mate how they are.", "answers": ["¿cómo estás?", "hola, ¿cómo estás?", "¿qué tal?", "hola, ¿qué tal?", "¿cómo estai?", "¿cómo estás tú?", "hola, ¿cómo estai?", "¿tú cómo estás?", "¿y tú, cómo estás?", "¿cómo andas?", "¿cómo te va?", "hola, ¿cómo te va?", "hola, ¿cómo estás tú?", "¿qué tal estás?"], "why": "¿Cómo estás? is the tú version for a mate.", "show": "¿Cómo estás?"}, {"t": "say", "id": "1.3.say", "es": "Mucho gusto, ¿cómo está usted?", "en": "Nice to meet you, how are you?", "tip": "Respectful, for a new customer. MOO-choh GOOS-toh."}]}, {"id": "1.4", "title": "El, la, los, las", "minutes": 8, "steps": [{"t": "learn", "title": "Every thing is el or la", "text": ["Every Spanish noun is either masculine or feminine. For things, it's just grammar. For people, it matches the person: *el amigo*, *la amiga*.", "*el* = the (masculine). *la* = the (feminine).", "Most words ending in -o take *el*: *el techo* (roof), *el martillo* (hammer).", "Most words ending in -a take *la*: *la puerta* (door), *la ventana* (window).", "Learn each word with its el or la, as one block."]}, {"t": "learn", "title": "The tricky ones", "text": ["A few break the pattern. Learn these as they come.", "End in -a but take el: *el día*, *el mapa*, *el problema*.", "End in -o but take la: *la mano* (hand), *la foto*.", "Words ending in -ción or -sión take la: *la canción* (song), *la información*. Other -ión words can differ: *el camión* (truck) and *el avión* (plane) are masculine.", "*el agua* (water) is feminine, but takes el because *la agua* is hard to say. Just learn it as *el agua*."], "mistake": {"wrong": "la problema", "right": "el problema", "why": "problema ends in -a but takes el. One of the rule-breakers."}}, {"t": "learn", "title": "More than one, and 'a'", "text": ["Ends in a vowel: add -s. *el techo* → *los techos*, *la puerta* → *las puertas*.", "Ends in a consonant: add -es. *el papel* → *los papeles*, *la flor* → *las flores*.", "*los* and *las* = the, for more than one.", "'A' or 'an' is *un* (masculine) or *una* (feminine): *un martillo*, *una llave* (a key)."], "chile": "Car is *el carro* in many countries, but in Chile it's *el auto*."}, {"t": "choice", "id": "1.4.techo", "prompt": "Pick the right word: ___ techo (roof)", "options": ["el", "la"], "answer": "el", "why": "techo ends in -o, so el techo.", "speak": "el techo"}, {"t": "choice", "id": "1.4.puerta", "prompt": "Pick the right word: ___ puerta (door)", "options": ["la", "el"], "answer": "la", "why": "puerta ends in -a, so la puerta.", "speak": "la puerta"}, {"t": "choice", "id": "1.4.dia", "prompt": "Pick the right word: ___ día (day)", "options": ["el", "la"], "answer": "el", "why": "día is a rule-breaker: it ends in -a but takes el.", "speak": "el día"}, {"t": "choice", "id": "1.4.mano", "prompt": "Pick the right word: ___ mano (hand)", "options": ["la", "el"], "answer": "la", "why": "mano is a rule-breaker: it ends in -o but takes la.", "speak": "la mano"}, {"t": "choice", "id": "1.4.cancion", "prompt": "Pick the right word: ___ canción (song)", "options": ["la", "el"], "answer": "la", "why": "Words ending in -ción take la.", "speak": "la canción"}, {"t": "choice", "id": "1.4.plural", "prompt": "More than one: el martillo → ?", "options": ["los martillos", "las martillos", "los martillo"], "answer": "los martillos", "why": "el becomes los, and add -s after a vowel.", "speak": "los martillos"}, {"t": "type", "id": "1.4.llaves", "prompt": "Make it more than one: la llave (the key)", "answers": ["las llaves"], "why": "la becomes las, and llave ends in a vowel, so add -s.", "show": "Las llaves."}, {"t": "type", "id": "1.4.un", "prompt": "Write 'a hammer' in Spanish.", "answers": ["un martillo"], "why": "martillo is masculine, so un martillo.", "show": "Un martillo."}, {"t": "build", "id": "1.4.build", "en": "the roof and the door", "tiles": ["el", "techo", "y", "la", "puerta"], "extra": ["los"], "why": "el techo, la puerta. y means 'and'."}, {"t": "say", "id": "1.4.say", "es": "El martillo, la llave y los clavos.", "en": "The hammer, the key and the nails.", "tip": "ll in martillo and llave sounds like y."}]}, {"id": "1.5", "title": "Numbers 0 to 20", "minutes": 7, "steps": [{"t": "learn", "title": "0 to 10", "text": ["*cero, uno, dos, tres, cuatro, cinco, seis, siete, ocho, nueve, diez*", "Before a noun, *uno* becomes *un* or *una*: *un martillo*, *una llave*."], "say": ["uno", "dos", "tres", "cuatro", "cinco", "seis", "siete", "ocho", "nueve", "diez"]}, {"t": "learn", "title": "11 to 20", "text": ["*once, doce, trece, catorce, quince*: just learn these five.", "16 to 19 are 'ten and six' squashed into one word: *dieciséis, diecisiete, dieciocho, diecinueve*.", "*veinte* = 20."], "mistake": {"wrong": "dieciseis", "right": "dieciséis", "why": "16 has an accent mark: dieci-SÉIS."}, "say": ["once", "doce", "trece", "catorce", "quince", "dieciséis", "veinte"]}, {"t": "choice", "id": "1.5.7", "prompt": "Which one is 7?", "options": ["siete", "seis", "diez"], "answer": "siete", "why": "seis is 6, siete is 7.", "speak": "siete"}, {"t": "choice", "id": "1.5.15", "prompt": "Which one is 15?", "options": ["quince", "cinco", "catorce"], "answer": "quince", "why": "cinco is 5, catorce is 14, quince is 15.", "speak": "quince"}, {"t": "listen", "id": "1.5.listen12", "prompt": "Listen. Which number?", "es": "doce", "options": ["12", "2", "20"], "answer": "12", "why": "doce is 12. dos is 2, veinte is 20.", "optLang": "en"}, {"t": "listen", "id": "1.5.listen13", "prompt": "Listen. Which number?", "es": "trece", "options": ["13", "3", "16"], "answer": "13", "why": "trece is 13. tres is 3.", "optLang": "en"}, {"t": "type", "id": "1.5.16", "prompt": "Write 16 as a word.", "answers": ["dieciséis", "diez y seis"], "why": "dieci + seis, with an accent: dieciséis.", "show": "Dieciséis."}, {"t": "type", "id": "1.5.20", "prompt": "Write 20 as a word.", "answers": ["veinte"], "why": "veinte, said BAYN-teh.", "show": "Veinte."}, {"t": "type", "id": "1.5.laminas", "prompt": "Write '12 sheets' (sheet = lámina).", "answers": ["doce láminas", "doce planchas", "12 láminas"], "why": "doce + láminas. Plural because there's more than one.", "show": "Doce láminas."}, {"t": "choice", "id": "1.5.una", "prompt": "Pick the right word: ___ llave (a key)", "options": ["una", "uno", "un"], "answer": "una", "why": "llave takes la, so it's una llave.", "speak": "una llave"}, {"t": "say", "id": "1.5.say1", "es": "Uno, dos, tres, cuatro, cinco.", "en": "One, two, three, four, five.", "tip": "cuatro is KWAH-troh, cinco is SEEN-koh."}, {"t": "say", "id": "1.5.say2", "es": "Diez tornillos, por favor.", "en": "Ten screws, please.", "tip": "diez is one beat, like 'yes' with a d in front: dyess."}]}, {"id": "1.6", "title": "Who you are", "minutes": 7, "steps": [{"t": "learn", "title": "Your name", "text": ["*Me llamo {name}.* My name is {name}. (Literally 'I call myself {name}'.)", "*Soy {name}.* I'm {name}. Just as common.", "Asking: *¿Cómo te llamas?* to a mate, *¿Cómo se llama?* to a customer."], "mistake": {"wrong": "Me llamo es {name}", "right": "Me llamo {name}", "why": "*me llamo* already means 'my name is'. No es needed."}, "chile": "A Chilean might ask *¿Cómo te llamai?* (te lla-MAI). Same question, Chilean ending."}, {"t": "learn     if (s.answers.some((a) => strict(a) === strict(attempt))) return grade(true, s);
    const near = s.answers.find((a) => loose(a) === loose(attempt));
    if (near) return grade(true, s, { note: "Right. Watch the accents: *" + capFirst(near) + "*" });
    run.checkId = (run.checkId || 0) + 1;
    const mine = run, at = run.i, ticket = run.checkId;
    if (run.checking) return;
    run.checking = true; run.checkFailed = false; renderRun();
    const verdict = await askClaude(s, attempt);
    if (run !== mine || run.i !== at || run.checkId !== ticket || route.name !== "run") return; // learner quit, moved on or stopped waiting
    run.checking = false;
    if (verdict === "failed") { run.checkFailed = true; renderRun(); return; } // a hiccup is not a wrong answer
    if (verdict !== "off") return grade(verdict.correct, s, { claude: verdict.why, fixed: verdict.fixed && strict(verdict.fixed) !== strict(attempt) ? verdict.fixed : "" });
    grade(false, s, { note: "That's not on my list of answers. If you're sure it's right, tap 'count it'." });
  }

  function stepSay(box, s) {
    box.appendChild(el("p", "prompt", "Say this out loud:"));
    box.appendChild(el("p", "big-es", s.es));
    box.appendChild(el("p", "en", s.en));
    if (s.tip) box.appendChild(add(el("p", "muted"), el("strong", null, "Tip: "), document.createTextNode(s.tip)));
    if (!run.said) {
      const b = el("button", "btn primary", canSpeak ? "I said it, now let me hear it" : "I said it"); b.id = "said";
      b.addEventListener("click", () => { if (tapLocked()) return; run.said = true; speak(s.es); renderRun(); });
      box.appendChild(add(el("div", "row"), b));
      return;
    }
    if (!run.answered) {
      box.appendChild(add(el("div", "row"), speakBtn(s.es, "Hear it again"), el("span", "muted", "How did you go?")));
      const g = el("div", "selfmark");
      [["Nailed it", true], ["Close", true], ["Missed it", false]].forEach(([label, ok], k) => {
        const b = el("button", "btn" + (k === 0 ? " primary" : ""), label); b.id = "self-" + k;
        b.addEventListener("click", () => grade(ok, s, { self: label })); g.appendChild(b);
      });
      box.appendChild(g);
      return;
    }
    const msg = run.result.self === "Missed it" ? "No worries. It'll come back in your review." : run.result.self === "Close" ? "Close counts. Say it once more with the audio." : "Good. Keep saying things out loud.";
    const f = el("div", "feedback " + (run.result.right ? "ok" : "bad")); f.setAttribute("role", "status");
    add(f, el("p", "verdict", run.result.self), el("p", null, msg));
    box.appendChild(f);
    box.appendChild(add(el("div", "row"), speakBtn(s.es, "Hear it again"), continueBtn()));
  }

  // ---------- Results ----------
  function renderDone() {
    const r = route.res;
    const box = el("main", "card"); box.id = "done";
    const pct = r.graded ? Math.round((r.right / r.graded) * 100) : 100;
    box.appendChild(el("p", "kicker", r.title));
    if (r.kind === "check") box.appendChild(el("h2", null, r.passed ? `Level ${r.level} passed` : "Not yet"));
    else box.appendChild(el("h2", null, pct >= 80 ? "¡Muy bien!" : pct >= 50 ? "¡Vas bien!" : "¡Sigue así!"));
    box.appendChild(el("p", "result-score", `${r.right}/${r.graded}`));
    if (r.kind === "check") box.appendChild(el("p", "muted", r.passed ? (LEVELS[r.level + 1] ? `Level ${r.level + 1} is open.` : `Level ${r.level + 1} is next. Ask Claude to build it, then it appears on your home screen.`) : `You need ${Math.ceil(r.graded * 0.8)} to pass. Redo the lessons you found hard, then try again.`));
    if (r.missed.length) {
      box.appendChild(el("p", "kicker", "These go into your review"));
      const ul = el("ul", "plain");
      r.missed.forEach((m) => ul.appendChild(el("li", null, m.t === "say" ? m.es : m.t === "build" ? buildSentence(m.tiles) : m.t === "type" ? m.show : m.prompt.includes("___") ? m.prompt.replace("___", m.answer) : `${m.prompt} ${m.answer}`)));
      box.appendChild(ul);
    }
    const home = el("button", "btn primary", "Back to levels"); home.id = "home"; home.addEventListener("click", () => go({ name: "home" }));
    box.appendChild(add(el("div", "row"), home));
    app.appendChild(box);
    home.focus({ preventScroll: true });
  }

  // ---------- Settings sheet ----------
  let sheetOpen = false;
  function renderSheet() {
    const old = $("#sheet"); if (old) old.remove();
    document.body.classList.toggle("sheet-open", sheetOpen);
    const opener = $("#settings-btn"); if (opener) opener.setAttribute("aria-expanded", String(sheetOpen));
    if (!sheetOpen) { if (old && opener) opener.focus({ preventScroll: true }); return; }
    const sh = el("div", "sheet"); sh.id = "sheet"; sh.setAttribute("role", "dialog"); sh.setAttribute("aria-label", "Settings");
    const inner = el("div", "inner");
    add(inner, el("h3", null, "Settings"));
    const nl = el("label", "label", "Your name (used in the lessons)"); nl.setAttribute("for", "name-input");
    const ni = el("input"); ni.id = "name-input"; ni.type = "text"; ni.maxLength = 40; ni.value = P.settings.name || ""; ni.placeholder = DEFAULT_NAME; ni.setAttribute("autocomplete", "given-name");
    ni.addEventListener("input", () => { P.settings.name = ni.value.trim().slice(0, 40); save(); });
    add(inner, add(el("div", "field"), nl, ni));
    if (canSpeak) {
      loadVoices();
      const lab = el("label", "label", "Spanish voice"); lab.setAttribute("for", "voice");
      const sel = el("select"); sel.id = "voice";
      sel.appendChild(new Option("Automatic (Latin American first)", ""));
      voices.forEach((v) => sel.appendChild(new Option(`${v.name} (${v.lang})`, v.name)));
      sel.value = P.settings.voice || "";
      sel.addEventListener("change", () => { P.settings.voice = sel.value; save(); speak("Hola, ¿cómo estás?"); });
      const rate = el("select"); rate.id = "rate";
      [["Slow", 0.75], ["Normal", 0.9], ["Fast", 1]].forEach(([l, v]) => rate.appendChild(new Option(l, String(v))));
      rate.value = String(P.settings.rate || 0.9);
      rate.addEventListener("change", () => { P.settings.rate = Number(rate.value); save(); speak("Cinco, diez, quince."); });
      const rl = el("label", "label", "Speed"); rl.setAttribute("for", "rate");
      add(inner, add(el("div"), lab, sel), add(el("div"), rl, rate), el("p", "muted", "No sound? Check your phone isn't on silent. Voices come from your device. Mexican or US Spanish voices match this course best. Avoid Spain's voices (they say 'th' for c and z) and Argentina's (they say 'sh' for ll and y)."));
    } else add(inner, el("p", "muted", "This device can't read Spanish aloud."));
    add(inner, el("p", "muted", EDITION === "web" ? "This copy saves your progress on this device only, so your phone and iPad each keep their own. The Claude version syncs between them." : sync.where === "account" ? "Your progress is saved to your Claude account, so it follows you between phone and iPad." : "Your progress is saved on this device only. Open the app while signed in to Claude to save it to your account."));
    const close = el("button", "btn", "Close"); close.id = "close-settings"; close.addEventListener("click", () => { sheetOpen = false; renderSheet(); });
    inner.appendChild(add(el("div", "row"), close));
    sh.appendChild(inner);
    document.body.appendChild(sh);
    const first = sh.querySelector("select, button"); if (first) first.focus({ preventScroll: true });
  }

  // ---------- Boot ----------
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && sheetOpen) { sheetOpen = false; renderSheet(); }
  });
  const live = el("div", "sr-only"); live.id = "live"; live.setAttribute("aria-live", "polite"); document.body.appendChild(live);
  const start = () => { rerender(); connectAccount(); };
  if (window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(start); else start();
})();
</script>

<script>if("serviceWorker" in navigator){addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));}</script>
